<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skillstone — mannequin lab</title>
<style>
  :root { color-scheme: dark; --board: #0f0e0c; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace; --dust: #b5a589; --gold: #c9a961; --mortar: #51432f; }
  html, body { margin: 0; height: 100%; background: var(--board); color: var(--dust); font: 11px/1.5 var(--mono); }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 10px 14px; background: linear-gradient(transparent, #0f0e0ccc 30%); letter-spacing: .06em; text-transform: uppercase; }
  .bar button { appearance: none; background: none; border: 1px solid var(--mortar); color: var(--dust); font: inherit; letter-spacing: inherit; text-transform: inherit; padding: 6px 10px; min-height: 32px; cursor: pointer; }
  .bar button[aria-pressed="true"] { border-color: var(--gold); color: #f0e7d1; }
  .bar .sp { flex: 1; }
  .bar .worn { text-transform: none; letter-spacing: 0; color: #8c806b; max-width: 60ch; }
  .note { position: fixed; top: 12px; left: 14px; color: #8c806b; letter-spacing: .06em; text-transform: uppercase; }
  .note b { color: var(--dust); font-weight: 500; }
</style>
</head>
<body>
<div id="stage" role="img" aria-label="A 3D figure wearing the equipped outfit"></div>
<div class="note">Mannequin lab · <b id="state">loading</b></div>
<div class="bar">
  <button type="button" data-angle="0" aria-pressed="true">Front</button>
  <button type="button" data-angle="40">Three-quarter</button>
  <button type="button" data-angle="90">Side</button>
  <button type="button" data-angle="180">Back</button>
  <button type="button" id="spin" aria-pressed="false">Spin</button>
  <span class="sp"></span>
  <span class="worn" id="worn"></span>
  <button type="button" id="refresh">Read wardrobe</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

/* ---------- the board ----------
   The same dark stone the character stands on in 2D: a warm key from the upper right, a cool
   fill from behind, and a pool of shadow under the feet. Nothing in the scene is lit flat. */
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f0e0c);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.35;

const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 50);
const LOOK = new THREE.Vector3(0, 0.95, 0), DIST = 3.9, HEIGHT = 1.2;
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(LOOK); controls.enablePan = false; controls.minDistance = 1.5; controls.maxDistance = 7;
controls.maxPolarAngle = Math.PI * 0.55;

scene.add(new THREE.HemisphereLight(0xfff1dc, 0x1a1510, 0.55));
const key = new THREE.DirectionalLight(0xffe4bd, 2.6);
key.position.set(2.2, 3.6, 2.4); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.camera.near = 1; key.shadow.camera.far = 10;
key.shadow.camera.left = key.shadow.camera.bottom = -1.5; key.shadow.camera.right = key.shadow.camera.top = 1.5;
key.shadow.bias = -0.0008; key.shadow.normalBias = 0.02;
scene.add(key);
const fill = new THREE.DirectionalLight(0xbfd0ff, 0.5); fill.position.set(-2.5, 2, -2); scene.add(fill);

const floor = new THREE.Mesh(new THREE.CircleGeometry(1.6, 64), new THREE.MeshStandardMaterial({ color: 0x1a1712, roughness: 1 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const shadowCatcher = new THREE.Mesh(new THREE.PlaneGeometry(8, 8), new THREE.ShadowMaterial({ opacity: 0.55 }));
shadowCatcher.rotation.x = -Math.PI / 2; shadowCatcher.position.y = 0.001; shadowCatcher.receiveShadow = true; scene.add(shadowCatcher);

/* ---------- the body ----------
   Quaternius' Universal Base Character (CC0), baked to one GLB by lab/bake-body.py with its hair
   parented to the head bone. The skin keeps its own texture; the hair takes his colour. */
/* the light skin map, brought down to his tone (the 2D figure's #ad8062) by a tint */
const SKIN_TINT = 0xa88f7f, HAIR = 0x302720;
let body, root, bones = {}, garments = [];
const setState = t => { document.getElementById("state").textContent = t; };

const gltf = await new GLTFLoader().loadAsync("assets/ubc/khev-body.glb");
root = gltf.scene; scene.add(root);
root.traverse(o => {
  if (o.isSkinnedMesh) { o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false; }
  if (o.isMesh && !o.isSkinnedMesh) { o.castShadow = true; }
  if (o.isBone) bones[o.name] = o;
  if (o.isSkinnedMesh && /superhero|male|body/i.test(o.name)) body = o;
  if (o.isMesh && /hair/i.test(o.name)) { o.material = o.material.clone(); o.material.color.setHex(HAIR); o.material.roughness = 0.75; }
  if (o.isMesh && /eyebrow/i.test(o.name)) { o.material = o.material.clone(); o.material.color.setHex(HAIR); }
});
if (!body) throw new Error("no body mesh in the GLB");
body.material.color.setHex(SKIN_TINT); body.material.roughness = 0.62;

/* A relaxed stance: the pack's rest pose holds the arms out; ours hang, a little away from the
   hips, with a bend at the elbow. Rotations are in each bone's own space, found by looking. */
function relax() {
  const rot = (n, x, y, z) => { const b = bones[n]; if (b) { b.rotation.x += x; b.rotation.y += y; b.rotation.z += z; } };
  rot("upperarm_l", 0.10, 0, -1.28); rot("upperarm_r", 0.10, 0, 1.28);
  rot("lowerarm_l", 0, 0, -0.22); rot("lowerarm_r", 0, 0, 0.22);
  root.updateMatrixWorld(true);
}

/* The free body is the pack's Superhero proportion — the Regular one is in the paid Source
   pack. Until then, the arms and chest are drawn in toward their bones: a slimming pass on the
   skin itself, before any garment is derived from it, so clothes follow the slimmer body. */
function slim(geo, skeletonBones, headPos, axes, amounts) {
  const P = geo.attributes.position, SI = geo.attributes.skinIndex, SW = geo.attributes.skinWeight;
  const p = new THREE.Vector3(), q = new THREE.Vector3();
  for (let v = 0; v < P.count; v++) {
    let best = 0; for (let k = 1; k < 4; k++) if (SW.getComponent(v, k) > SW.getComponent(v, best)) best = k;
    const bone = skeletonBones[SI.getComponent(v, best)].name, f = amounts[bone];
    if (!f) continue;
    p.fromBufferAttribute(P, v);
    const h = headPos[bone], ax = axes[bone];
    const t = p.clone().sub(h).dot(ax.dir);
    q.copy(h).addScaledVector(ax.dir, t);                     /* the nearest point on the bone */
    p.sub(q).multiplyScalar(f).add(q);
    P.setXYZ(v, p.x, p.y, p.z);

}

/* ---------- garments, derived from the body itself ----------
   A shirt is the body's own surface, pushed out a few millimetres, cut where a shirt ends. Each
   vertex knows which bone owns it and how far along that bone it sits, so a hem is "thigh, below
   40%" and a sleeve is "upper arm, above 45%". The shell keeps the skin weights, so it moves with
   the skeleton for free. No asset is needed for a new garment kind — a rule and an offset. */
const geo = body.geometry;
const P = geo.attributes.position, N = geo.attributes.normal, SI = geo.attributes.skinIndex, SW = geo.attributes.skinWeight, UV = geo.attributes.uv;
const IDX = geo.index;
const boneOf = i => body.skeleton.bones[i];

/* bone heads and axes in the mesh's space, from the bind pose */
body.skeleton.pose(); root.updateMatrixWorld(true);
const invMesh = new THREE.Matrix4().copy(body.matrixWorld).invert();
const head = {}, axis = {};

  head[b.name] = new THREE.Vector3().setFromMatrixPosition(b.matrixWorld).applyMatrix4(invMesh);
}
for (const b of body.skeleton.bones) {

  const a = child ? head[child.name].clone().sub(head[b.name]) : (b.parent && head[b.parent.name] ? head[b.name].clone().sub(head[b.parent.name]) : new THREE.Vector3(0, 1, 0));

slim(geo, body.skeleton.bones, head, axis, { upperarm_l: 0.84, upperarm_r: 0.84, lowerarm_l: 0.86, lowerarm_r: 0.86, spine_03: 0.93, spine_02: 0.95, clavicle_l: 0.92, clavicle_r: 0.92, thigh_l: 0.93, thigh_r: 0.93, calf_l: 0.92, calf_r: 0.92 });
/* The skin mesh carries duplicate vertices along its UV seams, each with its own normal. A shell
   offset along those normals opens a crack at every seam, and smoothing pulls the two copies
   apart. So shells are built on WELDED vertices — one per position — with the normal averaged
   over the copies. Prints get their own UVs anyway. */
const CANON = new Int32Array(P.count), AVGN = new Float32Array(P.count * 3);

  const seen = new Map(), k = v => (Math.round(P.getX(v) * 1e4)) + "," + (Math.round(P.getY(v) * 1e4)) + "," + (Math.round(P.getZ(v) * 1e4));
  for (let v = 0; v < P.count; v++) { const key = k(v); if (!seen.has(key)) seen.set(key, v); CANON[v] = seen.get(key); }
  for (let v = 0; v < P.count; v++) { const c = CANON[v]; AVGN[c * 3] += N.getX(v); AVGN[c * 3 + 1] += N.getY(v); AVGN[c * 3 + 2] += N.getZ(v); }
  for (let v = 0; v < P.count; v++) { if (CANON[v] !== v) continue; const l = Math.hypot(AVGN[v * 3], AVGN[v * 3 + 1], AVGN[v * 3 + 2]) || 1; AVGN[v * 3] /= l; AVGN[v * 3 + 1] /= l; AVGN[v * 3 + 2] /= l; }
}
/* the torso's axis for hanging and for wrapping a print round it, and the arms' for sleeves */
const SPINE = { cx: (head.spine_01.x + head.spine_03.x) / 2, cz: (head.spine_01.z + head.spine_03.z) / 2, r: 0.17 };
const armAxis = {};
for (const b of ["upperarm_l", "upperarm_r", "lowerarm_l", "lowerarm_r"]) {
  const dir = axis[b].dir.clone(), n1 = new THREE.Vector3(0, 1, 0).cross(dir).normalize(); if (n1.lengthSq() < 1e-6) n1.set(1, 0, 0);
  armAxis[b] = { head: head[b].clone(), dir, n1, n2: dir.clone().cross(n1).normalize() };
}
const vTag = new Array(P.count);

  const p = new THREE.Vector3(), w = [0, 0, 0, 0], j = [0, 0, 0, 0];
  for (let v = 0; v < P.count; v++) {
    p.fromBufferAttribute(P, v);
    for (let k = 0; k < 4; k++) { w[k] = SW.getComponent(v, k); j[k] = SI.getComponent(v, k); }
    let best = 0; for (let k = 1; k < 4; k++) if (w[k] > w[best]) best = k;
    const bone = boneOf(j[best]).name;
    const h = head[bone], ax = axis[bone];
    const t = h && ax ? p.clone().sub(h).dot(ax.dir) / ax.len : 0;
    const r = Math.hypot(p.x, p.z);

const Y = { neck: head.neck_01.y, pelvis: head.pelvis.y, spine1: head.spine_01.y, thigh: head.thigh_l.y, calf: head.calf_l.y, foot: head.foot_l.y };

/* A cut is a plane, and the shell is pulled flat to it: vertices in a band past the hem are kept
   and their height clamped to the hem, so the edge is a line rather than the sawtooth that
   dropping whole triangles leaves. `clamp` returns the corrected y for a vertex, or nothing. */
/* ---------- how cloth sits ----------
   A shell offset from the skin is a second skin: every muscle prints through it. A shirt hangs.
   Two rules make the difference. HANG: below the armpit, nothing on a shirt can be narrower
   than what is above it in the same direction — fabric falls from the widest point — so each
   angular sector carries a running maximum radius downward and the shell is pulled out to it.
   RELAX: a few passes of Laplacian smoothing take the remaining muscle detail out, with the
   boundary rings (hem, neck, cuffs) pinned and a clearance check that keeps the cloth off the
   skin. Both run on the shell's vertices only; the body is untouched. */

    const t = [index[f], index[f + 1], index[f + 2]];
    for (let k = 0; k < 3; k++) { const a = t[k], b = t[(k + 1) % 3]; nb[a].add(b); nb[b].add(a); const key = a < b ? a + "_" + b : b + "_" + a; edges.set(key, (edges.get(key) || 0) + 1); }
  }

  for (const [key, c] of edges) if (c === 1) { const [a, b] = key.split("_").map(Number); boundary[a] = 1; boundary[b] = 1; }

  if (opts.hang) {
    const { cx, cz, top: topY, sectors = 40, mix = 0.85 } = opts.hang;
    const order = [];
    for (let v = 0; v < count; v++) if (tags[v].torso) order.push(v);
    order.sort((a, b) => pos[b * 3 + 1] - pos[a * 3 + 1]);
    const runMax = new Float32Array(sectors);

      const th = Math.atan2(z, x), sec = ((Math.floor((th + Math.PI) / (2 * Math.PI) * sectors) % sectors) + sectors) % sectors;
      const r = Math.hypot(x, z);

      if (want > r) { const k = want / r; pos[v * 3] = cx + x * k; pos[v * 3 + 2] = cz + z * k; }

      let ax = 0, ay = 0, az = 0; for (const u of nb[v]) { ax += pos[u * 3]; ay += pos[u * 3 + 1]; az += pos[u * 3 + 2]; }
      const m = nb[v].size;
      tmp[v * 3] = pos[v * 3] + lambda * (ax / m - pos[v * 3]); tmp[v * 3 + 2] = pos[v * 3 + 2] + lambda * (az / m - pos[v * 3 + 2]);
      /* a hem, cuff or neckline ring keeps its height — it is the cut — and follows the body sideways */
      tmp[v * 3 + 1] = boundary[v] ? pos[v * 3 + 1] : pos[v * 3 + 1] + lambda * (ay / m - pos[v * 3 + 1]);
    }
    pos.set(tmp);
    /* clearance: the cloth stays at least most of its offset off the skin */
    for (let v = 0; v < count; v++) {
      const dx = pos[v * 3] - base[v * 3], dy = pos[v * 3 + 1] - base[v * 3 + 1], dz = pos[v * 3 + 2] - base[v * 3 + 2];
      const d = dx * nrm[v * 3] + dy * nrm[v * 3 + 1] + dz * nrm[v * 3 + 2], want = offset * 0.7;
      if (d < want) { const k = want - d; pos[v * 3] += nrm[v * 3] * k; pos[v * 3 + 1] += nrm[v * 3 + 1] * k; pos[v * 3 + 2] += nrm[v * 3 + 2] * k; }
    }
  }
}

/* ---------- the prints ----------
   The same five patterns the 2D figure wears, from the app's shirtPattern(): drawn once into a
   canvas over the shirt's colour and used as a repeating texture. The shell gets cylindrical
   UVs — round the spine for the torso, round the arm for a sleeve — so the print runs
   continuously round the body at a real tile size instead of following the skin's UV atlas. */
const shirtInk = (c, f) => /^#[0-9a-f]{6}$/i.test(c || "") ? c : f;

  let marks = "";
  if (k === "sticks") marks = '<path d="M2 2l2 4m5-5-1 5m5 3 3-2M3 12l-1 4m6-6 2 4m5 1 1 3" fill="none" stroke="' + a + '" stroke-width=".8" stroke-linecap="round"/><path d="M6 7l1 3m9-6-2 2" stroke="' + b + '" stroke-width=".8"/>';

  else if (k === "spots") marks = '<path d="M3 2q4-2 4 2l-1 3q-4 2-4-2ZM12 11q3-2 4 1l-1 4q-4 2-5-1Z" fill="' + a + '"/><path d="M13 2q3-1 3 2l-2 2-2-2Z" fill="' + b + '"/>';
  else if (k === "flowers") marks = '<g fill="' + a + '"><path d="M6 2C1-2-1 5 3 7c-4 5 3 9 6 5 6 2 9-5 4-7 1-5-5-7-7-3Z"/></g><path d="M20 17c-4-5-9 0-6 4-4 3 1 8 5 5 5 4 9-2 5-5 2-4-1-6-4-4Z" fill="' + b + '"/><g fill="' + shirtInk(it.color, "#172026") + '"><circle cx="7" cy="7" r="2.2"/><circle cx="20" cy="22" r="2"/></g>';

const TILE_M = 0.19;   /* one pattern tile is about 19 cm of cloth, whatever its unit size */

/* u round the axis, v along it, both in tiles of TILE_M */

  }
  if (opts.relax) {
    const posF = new Float32Array(pos);
    relaxShell(posF, index, base, nrms, tags, offset, { hang: opts.hang ? { cx: SPINE.cx, cz: SPINE.cz, top: Y.neck - 0.15 } : null, iters: opts.iters });
    for (let i = 0; i < pos.length; i++) pos[i] = posF[i];
  }
  let uvOut = UV ? uv : null;
  if (opts.uv === "cylinder") {
    const torsoUV = v => { const dx = pos[v * 3] - SPINE.cx, dz = pos[v * 3 + 2] - SPINE.cz; return [Math.atan2(dz, dx) / (2 * Math.PI) * (2 * Math.PI * SPINE.r) / TILE_M, pos[v * 3 + 1] / TILE_M]; };
    const armUV = (v, ax) => { const p = new THREE.Vector3(pos[v * 3], pos[v * 3 + 1], pos[v * 3 + 2]).sub(ax.head), t = p.dot(ax.dir), radial = p.clone().addScaledVector(ax.dir, -t);
      return [Math.atan2(radial.dot(ax.n2), radial.dot(ax.n1)) / (2 * Math.PI) * (2 * Math.PI * 0.05) / TILE_M, t / TILE_M]; };
    const PANEL = { torso: { uv: torsoUV, R: (2 * Math.PI * SPINE.r) / TILE_M }, arm_l: { uv: v => armUV(v, armAxis.upperarm_l), R: (2 * Math.PI * 0.05) / TILE_M }, arm_r: { uv: v => armUV(v, armAxis.upperarm_r), R: (2 * Math.PI * 0.05) / TILE_M } };
    const panelOf = tri => { const t = tri.filter(v => tags[v].torso).length; if (t >= 2) return "torso"; const side = tri.map(v => tags[v].side).find(x => x); return side ? "arm_" + side : "torso"; };
    const P2 = [], N2 = [], S2 = [], W2 = [], U2 = [], I2 = [], T2 = [], seen = new Map();
    const copy = (v, panel) => {
      const key = panel + ":" + v; if (seen.has(key)) return seen.get(key);
      const j = P2.length / 3; seen.set(key, j);
      P2.push(pos[v * 3], pos[v * 3 + 1], pos[v * 3 + 2]); N2.push(nor[v * 3], nor[v * 3 + 1], nor[v * 3 + 2]);
      for (let q = 0; q < 4; q++) { S2.push(si[v * 4 + q]); W2.push(sw[v * 4 + q]); }
      const [u, w] = PANEL[panel].uv(v); U2.push(u, w); T2.push(panel); return j;
    };
    for (let f = 0; f < index.length; f += 3) {
      const tri = [index[f], index[f + 1], index[f + 2]], panel = panelOf(tri);
      I2.push(copy(tri[0], panel), copy(tri[1], panel), copy(tri[2], panel));
    }
    /* within a panel the cylinder still wraps once: the low-u vertices of a straddling triangle
       are duplicated one turn along */
    for (let f = 0; f < I2.length; f += 3) {
      const tri = [I2[f], I2[f + 1], I2[f + 2]], R = PANEL[T2[tri[0]]].R, us = tri.map(v => U2[v * 2]), hi = Math.max(...us);
      for (let k = 0; k < 3; k++) if (hi - us[k] > R / 2) {
        const v = tri[k], j = P2.length / 3;
        P2.push(P2[v * 3], P2[v * 3 + 1], P2[v * 3 + 2]); N2.push(N2[v * 3], N2[v * 3 + 1], N2[v * 3 + 2]);
        for (let q = 0; q < 4; q++) { S2.push(S2[v * 4 + q]); W2.push(W2[v * 4 + q]); }
        U2.push(us[k] + R, U2[v * 2 + 1]); T2.push(T2[v]); I2[f + k] = j;
      }
    }
    pos.length = 0; for (const x of P2) pos.push(x); nor.length = 0; for (const x of N2) nor.push(x);
    si.length = 0; for (const x of S2) si.push(x); sw.length = 0; for (const x of W2) sw.push(x);
    index.length = 0; for (const x of I2) index.push(x); uvOut = U2;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("normal", new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute("skinIndex", new THREE.Uint16BufferAttribute(si, 4));
  g.setAttribute("skinWeight", new THREE.Float32BufferAttribute(sw, 4));
  if (uvOut) g.setAttribute("uv", new THREE.Float32BufferAttribute(uvOut, 2));
  g.setIndex(index);
  if (clamp || opts.relax) g.computeVertexNormals();
  const m = new THREE.SkinnedMesh(g, material);
  m.name = name; m.castShadow = true; m.receiveShadow = true; m.frustumCulled = false;
  body.parent.add(m);
  m.bind(body.skeleton, body.bindMatrix);
  garments.push(m);
  return m;
}
/* A sole: a box the length and width of the foot, skinned to the foot bone so it walks with it.
   The shell over the foot is the upper; this is what puts it on the ground. */
function sole(boneName, material, thick = 0.026) {
  const bi = body.skeleton.bones.findIndex(b => b.name === boneName), side = boneName.slice(-2);
  const min = new THREE.Vector3(Infinity, Infinity, Infinity), max = new THREE.Vector3(-Infinity, -Infinity, -Infinity);
  for (let v = 0; v < P.count; v++) {
    const t = vTag[v]; if (!(t.bone === boneName || t.bone === "ball" + side || t.bone === "ball_leaf" + side)) continue;
    min.x = Math.min(min.x, P.getX(v)); max.x = Math.max(max.x, P.getX(v)); min.z = Math.min(min.z, P.getZ(v)); max.z = Math.max(max.z, P.getZ(v));
  }
  min.x -= 0.014; max.x += 0.014; min.z -= 0.012; max.z += 0.022;
  const g = new THREE.BoxGeometry(max.x - min.x, thick, max.z - min.z);
  g.translate((min.x + max.x) / 2, thick / 2, (min.z + max.z) / 2);
  const n = g.attributes.position.count, si = new Uint16Array(n * 4), sw = new Float32Array(n * 4);
  for (let i = 0; i < n; i++) { si[i * 4] = bi; sw[i * 4] = 1; }
  g.setAttribute("skinIndex", new THREE.BufferAttribute(si, 4)); g.setAttribute("skinWeight", new THREE.BufferAttribute(sw, 4));
  const m = new THREE.SkinnedMesh(g, material); m.name = "sole" + side; m.castShadow = true; m.frustumCulled = false;
  body.parent.add(m); m.bind(body.skeleton, body.bindMatrix); garments.push(m); return m;
}
const cloth = (hex, rough = 0.92) => new THREE.MeshStandardMaterial({ color: hex, roughness: rough, metalness: 0, side: THREE.DoubleSide });

/* the cuts */
const TORSO = new Set(["spine_01", "spine_02", "spine_03", "clavicle_l", "clavicle_r"]);
const ARM_U = new Set(["upperarm_l", "upperarm_r"]), ARM_L = new Set(["lowerarm_l", "lowerarm_r"]);
const THIGH = new Set(["thigh_l", "thigh_r"]), CALF = new Set(["calf_l", "calf_r"]);
const FOOT = new Set(["foot_l", "foot_r", "ball_l", "ball_r", "ball_leaf_l", "ball_leaf_r"]);
/* A hem is a height, not a bone: cutting by bone alone gave a V at the crotch, because the pelvis
   vertices at the front centre sit lower than those at the hip. Cuts that matter to the eye are
   horizontal lines; bones only say which limb a vertex belongs to. */
const WAIST = Y.pelvis + 0.045, HEM = WAIST - 0.045, ANKLE = Y.foot + 0.05, KNEE = Y.thigh - 0.30, BAND = 0.03, COLLAR = Y.neck - 0.018;
/* the neck opening is a cylinder round the neck, not a height: a height shaved the whole shoulder
   line off and left a boat neck with the sleeves standing apart from it */
const collar = v => v.bone === "Head" || (v.r < 0.11 && v.y > COLLAR + BAND);
/* the neckline: whatever sits above the collar line inside the neck is pulled down onto it */
const neckline = v => { if (v.r >= 0.11) return null; const dip = COLLAR - 0.045 * Math.max(0, Math.min(1, (v.z - SPINE.cz) / 0.08)); return v.y > dip ? dip : null; };
const torsoish = v => TORSO.has(v.bone) || v.bone === "pelvis" || THIGH.has(v.bone);
const LEGS = v => v.bone === "pelvis" || THIGH.has(v.bone) || CALF.has(v.bone) || FOOT.has(v.bone) || (v.bone === "spine_01" && v.y <= WAIST + BAND);
const RULES = {
  tee:      v => !collar(v) && ((torsoish(v) && v.y > HEM - BAND) || (ARM_U.has(v.bone) && v.t < 0.5)),
  tank:     v => !collar(v) && torsoish(v) && v.y > HEM - BAND && !(v.bone.startsWith("clavicle") && Math.abs(v.x) > 0.12) && !(v.y > Y.neck - 0.07 && v.r < 0.11),
  long:     v => !collar(v) && ((torsoish(v) && v.y > HEM - 0.02 - BAND) || ARM_U.has(v.bone) || (ARM_L.has(v.bone) && v.t < 0.92)),
  trousers: v => LEGS(v) && v.y <= WAIST + BAND && v.y > ANKLE - BAND,
  shorts:   v => LEGS(v) && v.y <= WAIST + BAND && v.y > KNEE - BAND,
  shoes:    v => (FOOT.has(v.bone) || CALF.has(v.bone)) && v.y < ANKLE + 0.012,
  boots:    v => (FOOT.has(v.bone) || CALF.has(v.bone)) && v.y < Y.foot + 0.22,
};
/* the planes each garment is pulled flat to */
const CLAMP = {
  tee:      v => torsoish(v) && v.y < HEM ? HEM : neckline(v),
  tank:     v => torsoish(v) && v.y < HEM ? HEM : neckline(v),
  long:     v => torsoish(v) && v.y < HEM - 0.02 ? HEM - 0.02 : neckline(v),
  trousers: v => v.y > WAIST ? WAIST : v.y < ANKLE ? ANKLE : null,
  shorts:   v => v.y > WAIST ? WAIST : v.y < KNEE ? KNEE : null,
  shoes:    null, boots: null,
};

/* ---------- what he is wearing ----------
   The lab reads the app's own saved state from this origin's storage, so the mannequin wears
   what the Inventory tab has equipped. With nothing saved it wears a plain default. */
function readWardrobe() {
  for (const k of Object.keys(localStorage)) {
    try { const s = JSON.parse(localStorage.getItem(k)); if (s && s.wardrobe && Array.isArray(s.wardrobe.items)) return s.wardrobe; } catch (e) {}
  }
  return null;
}
const hex = c => /^#[0-9a-f]{6}$/i.test(c || "") ? parseInt(c.slice(1), 16) : null;
const TOP_RULE = { tee: "tee", polo: "tee", printed: "tee", tank: "tank", shirt: "long" };
const LEG_RULE = { jeans: "trousers", chinos: "trousers", joggers: "trousers", cargo: "trousers", shorts: "shorts" };
const FEET_RULE = { sneakers: "shoes", lowtop: "shoes", loafers: "shoes", boots: "boots", hightop: "boots", flipflops: null };

function undress() { for (const g of garments) { g.parent && g.parent.remove(g); g.geometry.dispose(); } garments = []; }
function dress(w) {
  undress();
  const worn = {}; if (w) for (const k of Object.keys(w.worn || {})) worn[k] = (w.items || []).find(x => x.id === w.worn[k]);
  const words = [];
  const top = worn.top, outer = worn.outer, legs = worn.legs, feet = worn.feet;
  const legKind = legs ? legs.kind : "chinos", legRule = LEG_RULE[legKind] || "trousers";
  derive("legs", RULES[legRule], legKind === "cargo" ? 0.03 : legKind === "joggers" ? 0.024 : 0.019, cloth(hex(legs && legs.color) ?? 0x3a3835), CLAMP[legRule]); words.push(legs ? legs.name : "chinos");
  if (feet !== undefined ? FEET_RULE[feet.kind] !== null : true) {
    const fr = feet ? (FEET_RULE[feet.kind] || "shoes") : "shoes";
    const shoeC = hex(feet && feet.color) ?? 0x1b1a17, star = feet && (feet.kind === "lowtop" || feet.kind === "hightop");
    derive("feet", RULES[fr], 0.022, cloth(shoeC, 0.6), CLAMP[fr]); words.push(feet ? feet.name : "shoes");
    const soleM = cloth(star ? 0xe9e4d8 : feet && feet.kind === "sneakers" ? new THREE.Color(shoeC).multiplyScalar(0.7).getHex() : 0x1a1714, 0.8);
    sole("foot_l", soleM); sole("foot_r", soleM);
  }
  const topKind = top ? top.kind : "tee", topRule = TOP_RULE[topKind] || "tee";
  const soft = { relax: true, hang: true, iters: 6 };
  if (top && topKind === "printed") {
    const m = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.92, metalness: 0, side: THREE.DoubleSide });
    derive("top", RULES[topRule], 0.03, m, CLAMP[topRule], { ...soft, uv: "cylinder" });
    patternTexture(top).then(tex => { m.map = tex; m.needsUpdate = true; });
  } else derive("top", RULES[topRule], 0.03, cloth(hex(top && top.color) ?? 0xf2efe6), CLAMP[topRule], soft);
  words.push(top ? top.name : "tee");
  if (outer) { derive("outer", RULES.long, 0.044, cloth(hex(outer.color) ?? 0x303d43), CLAMP.long, soft); words.push(outer.name); }
  document.getElementById("worn").textContent = words.join(" · ");
  return garments.map(g => ({ name: g.name, tris: g.geometry.index.count / 3 }));
}

relax();
const summary = dress(readWardrobe());
setState("ready · " + body.geometry.index.count / 3 + " tris body · " + garments.length + " garments");

/* ---------- turning him ---------- */
let angle = 0, spinning = false;
function setAngle(deg) {
  angle = deg; const a = deg * Math.PI / 180;
  camera.position.set(Math.sin(a) * DIST, HEIGHT, Math.cos(a) * DIST); camera.lookAt(LOOK); controls.update();
  document.querySelectorAll(".bar [data-angle]").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.angle === deg)));
}
document.querySelectorAll(".bar [data-angle]").forEach(b => b.addEventListener("click", () => { spinning = false; document.getElementById("spin").setAttribute("aria-pressed", "false"); setAngle(+b.dataset.angle); }));
document.getElementById("spin").addEventListener("click", e => { spinning = !spinning; e.currentTarget.setAttribute("aria-pressed", String(spinning)); });
document.getElementById("refresh").addEventListener("click", () => dress(readWardrobe()));
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
setAngle(0);

const clock = new THREE.Clock();
function frame() {
  const dt = clock.getDelta();
  if (spinning) setAngle((angle + dt * 30) % 360);
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();

window.__lab = { ready: true, settle: () => new Promise(r => setTimeout(r, 400)), setAngle, dress, readWardrobe, scene, body, bones, get garments() { return garments; }, summary, render: () => renderer.render(scene, camera), Y };
</script>
</body>
</html>
