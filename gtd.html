<!-- ============= GTD-SCOPED STYLES =============
     All notebook tokens and rules are scoped under `.gtd-stage` so they
     don't leak into the rest of the portfolio. The global --paper/--ink
     from styles.css stay untouched for the nav and footer; the cream
     notebook palette lives only inside the stage. -->
<style>
body[data-page="gtd"] { overflow: hidden; }
body[data-page="gtd"] .foot { display: none; }

.gtd-main {
  position: relative;
  width: 100%;
  /* nav height ~ 50px; subtract so the stage fills the rest exactly */
  height: calc(100dvh - 50px);
  background: radial-gradient(ellipse at center, #3b3122 0%, #1c1610 80%);
  overflow: hidden;
}

.gtd-stage {
  /* notebook palette — cream paper + blue ink */
  --paper: #f1e8d0;
  --paper-2: #ece2c4;
  --paper-edge: #d9cda7;

  --ink: #16161b;
  --ink-soft: rgba(22, 22, 27, 0.72);
  --ink-faint: rgba(22, 22, 27, 0.38);
  --rule: rgba(80, 124, 168, 0.32);
  --rule-strong: rgba(80, 124, 168, 0.5);
  --margin: #c98a8a;
  --margin-soft: rgba(201, 138, 138, 0.7);

  --partial: #b3812a;
  --expected: #16161b;
  --excellent: #c8901c;
  --red-ink: #9b2828;
  --wine: #7a2128;

  --line-h: 28px;
  --pad-x: 56px;

  --font-hand: "Caveat", "Bradley Hand", cursive;
  --font-serif-n: "Crimson Pro", "Iowan Old Style", Georgia, serif;
  --font-mono-n: "IBM Plex Mono", ui-monospace, monospace;

  position: absolute;
  inset: 0;
  overflow: hidden;
  color: var(--ink);
  font-family: var(--font-serif-n);
}

/* paper variants */
.gtd-stage[data-paper="cream"] { --paper:#f1e8d0; --paper-2:#ece2c4; --paper-edge:#d9cda7; }
.gtd-stage[data-paper="bone"]  { --paper:#faf6ea; --paper-2:#f5efde; --paper-edge:#e6dec6; }
.gtd-stage[data-paper="sepia"] { --paper:#e8dcba; --paper-2:#e0d2a8; --paper-edge:#c8b683; --rule:rgba(102,128,90,.35); --rule-strong:rgba(102,128,90,.55); --margin:#b27a7a; }
.gtd-stage[data-paper="white"] { --paper:#ffffff; --paper-2:#fafaf6; --paper-edge:#e8e6df; --rule:rgba(120,150,180,.32); }

/* font pairings */
.gtd-stage[data-font="caveat-crimson"]      { --font-hand:"Caveat",cursive; --font-serif-n:"Crimson Pro",Georgia,serif; }
.gtd-stage[data-font="kalam-lora"]          { --font-hand:"Kalam",cursive; --font-serif-n:"Lora",Georgia,serif; }
.gtd-stage[data-font="shadows-source"]      { --font-hand:"Shadows Into Light",cursive; --font-serif-n:"Source Serif 4",Georgia,serif; }
.gtd-stage[data-font="architects-playfair"] { --font-hand:"Architects Daughter",cursive; --font-serif-n:"Playfair Display",Georgia,serif; }
.gtd-stage[data-font="patrick-newsreader"]  { --font-hand:"Patrick Hand",cursive; --font-serif-n:"Newsreader",Georgia,serif; }

/* density */
.gtd-stage[data-density="compact"]  { --line-h:24px; --pad-x:44px; }
.gtd-stage[data-density="regular"]  { --line-h:28px; --pad-x:56px; }
.gtd-stage[data-density="spacious"] { --line-h:32px; --pad-x:64px; }

/* ─────────────────────── stage / scaling ─────────────────────── */
.gtd-stage .spread-wrap {
  width: 1680px;
  height: 1080px;
  position: absolute;
  left: 50%;
  top: 50%;
  transform-origin: 0 0;
}

.gtd-stage .spread {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  background: var(--paper);
  border-radius: 4px 4px 8px 8px;
  box-shadow:
    0 30px 60px rgba(0,0,0,.6),
    0 8px 20px rgba(0,0,0,.4),
    inset 0 0 80px rgba(120,90,40,.08);
  overflow: hidden;
}
.gtd-stage .spread::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(ellipse at top left, rgba(0,0,0,.05), transparent 60%),
    radial-gradient(ellipse at bottom right, rgba(0,0,0,.04), transparent 60%);
  mix-blend-mode: multiply;
}
.gtd-stage .spread::after {
  content: ""; position: absolute; top:0; bottom:0; left:50%;
  width: 64px; transform: translateX(-50%);
  background: linear-gradient(to right, transparent 0%, rgba(60,40,10,.12) 30%, rgba(80,50,10,.32) 50%, rgba(60,40,10,.12) 70%, transparent 100%);
  pointer-events: none; z-index: 2;
}

.gtd-stage .page {
  position: relative;
  padding: 60px var(--pad-x) 36px 88px;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.gtd-stage .page.right { padding-right: 56px; }
.gtd-stage .page::before {
  content: ""; position: absolute; left: 64px; top: 0; bottom: 0;
  border-left: 1px solid var(--margin-soft); opacity: .7;
}

/* ─────────────────────── section labels ─────────────────────── */
.gtd-stage .label {
  font-family: var(--font-serif-n); font-weight: 600;
  letter-spacing: .06em; text-transform: uppercase;
  font-size: 13px; color: var(--ink);
  position: relative; display: inline-block; padding-bottom: 1px;
}
.gtd-stage .label::after {
  content: ""; position: absolute; left:-2px; right:-2px; bottom:-2px;
  height: 1px; background: var(--ink); opacity: .85;
}
.gtd-stage .label-row { display: flex; align-items: baseline; gap: 12px; }
.gtd-stage .label-row .small { font-size: 12px; color: var(--ink-soft); letter-spacing:.04em; }

/* ─────────────────────── header ─────────────────────── */
.gtd-stage .spread-header {
  position: relative; display: flex; align-items: center;
  gap: 14px; padding-bottom: 6px; margin-bottom: 8px;
  line-height: 1; flex-wrap: nowrap; min-height: 36px;
}
.gtd-stage .spread-header .nav {
  display: inline-flex; align-items: center; gap: 4px;
  font-family: var(--font-mono-n); font-size: 11px;
  color: var(--ink-soft); flex-shrink: 0;
}
.gtd-stage .spread-header .nav button {
  appearance: none; border: 1px solid var(--ink-faint);
  background: transparent; color: var(--ink); font: inherit;
  width: 22px; height: 22px; border-radius: 3px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  padding: 0;
}
.gtd-stage .spread-header .nav button.today {
  width: auto; padding: 0 8px; font-size: 10px;
  letter-spacing: .1em; text-transform: uppercase;
  font-family: var(--font-serif-n); font-weight: 600;
}
.gtd-stage .spread-header .nav button:hover { background: rgba(22,22,27,.08); }
.gtd-stage .spread-header .date {
  font-family: var(--font-hand); font-size: 28px;
  color: var(--ink); letter-spacing: .01em; line-height: 1; flex-shrink: 0;
}
.gtd-stage .spread-header .title {
  font-family: var(--font-hand); font-size: 32px; color: var(--ink);
  flex: 1; outline: none; min-width: 0; line-height: 1;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.gtd-stage .spread-header .title:focus { background: rgba(255,230,150,.25); border-radius: 2px; }
.gtd-stage .spread-header .now-chip {
  font-family: var(--font-mono-n); font-size: 9px;
  letter-spacing: .12em; text-transform: uppercase;
  color: var(--red-ink); padding: 2px 6px 2px 4px;
  border: 1px solid rgba(155,40,40,.35); border-radius: 3px;
  display: inline-flex; align-items: center; gap: 4px;
  position: relative; top: -3px; flex-shrink: 0; line-height: 1;
}
.gtd-stage .spread-header .now-chip::before {
  content: ""; width: 5px; height: 5px;
  background: var(--red-ink); border-radius: 50%;
  display: inline-block;
}
.gtd-stage .spread-header .week-tag {
  font-family: var(--font-mono-n); font-size: 9px;
  letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-faint); flex-shrink: 0;
  position: relative; top: -3px;
}
.gtd-stage .squiggle {
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='6'><path d='M0 3 Q5 0 10 3 T20 3 T30 3 T40 3' fill='none' stroke='%2316161b' stroke-width='1' opacity='0.7'/></svg>");
  background-repeat: repeat-x; background-position: 0 100%; padding-bottom: 4px;
}

/* ─────────────────────── entries ─────────────────────── */
.gtd-stage .entries {
  display: flex; flex-direction: column;
  /* Reserve at least 4 item-lines of vertical space in Notes,
     Reminders, and Bucket so the sections keep a stable rhythm even
     when they have one or two entries. Add-row affordance sits inside
     this minimum so an empty section still feels claimable, not
     vestigial. */
  min-height: calc(var(--line-h) * 4);
}
.gtd-stage .entry {
  position: relative; font-family: var(--font-hand); font-size: 24px;
  line-height: var(--line-h); color: var(--ink);
  padding: 0 4px 0 24px; outline: none; cursor: text;
  border-radius: 2px; min-height: var(--line-h);
  white-space: pre-wrap; word-break: break-word;
}
.gtd-stage .entry .editable:focus, .gtd-stage [contenteditable]:focus { outline: none; }
.gtd-stage .entry .editable:focus { background: rgba(255,230,150,.25); }
.gtd-stage .entry .editable.empty::before {
  content: attr(data-placeholder); color: var(--ink-faint);
  font-style: italic; font-size: 20px; pointer-events: none;
}
.gtd-stage .entry .bullet { position: absolute; left: 4px; top: 0; font-size: 26px; color: var(--ink); }
.gtd-stage .entry .delete {
  position: absolute; right: -4px; top: 2px;
  width: 18px; height: 18px; border-radius: 4px; border: 0;
  background: transparent; color: var(--ink-faint); cursor: pointer;
  font-size: 12px; font-family: var(--font-mono-n);
  display: none; align-items: center; justify-content: center;
}
.gtd-stage .entry:hover .delete { display: flex; }
.gtd-stage .entry .delete:hover { color: var(--red-ink); background: rgba(155,40,40,.08); }
.gtd-stage .entry .meta {
  display: inline-flex; align-items: baseline; gap: 6px; margin-left: 8px;
  font-family: var(--font-mono-n); font-size: 11px; color: var(--ink-soft);
  vertical-align: middle; position: relative; top: -3px;
}
.gtd-stage .entry .meta .pill {
  border: 0; background: transparent; padding: 0;
  font-family: var(--font-mono-n); font-size: 11px;
  letter-spacing: .02em; color: var(--ink-soft);
}
.gtd-stage .entry .meta .pill + .pill::before { content: "·"; margin-right: 6px; opacity: .5; }
.gtd-stage .entry .meta a.pill { text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 2px; color: var(--ink); }

.gtd-stage .entry .hover-actions {
  display: none; position: absolute; right: -2px; top: 50%;
  transform: translateY(-50%); align-items: center; gap: 2px;
  background: linear-gradient(to right, transparent, var(--paper) 30%);
  padding: 0 4px 0 14px;
}
.gtd-stage .entry:hover .hover-actions { display: inline-flex; }
.gtd-stage .entry .hover-actions .edit {
  appearance: none; border: 0; background: transparent;
  color: var(--ink-faint); width: 20px; height: 20px;
  border-radius: 4px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
}
.gtd-stage .entry .hover-actions .edit:hover { color: var(--ink); background: rgba(22,22,27,.08); }
.gtd-stage .entry .hover-actions .delete { position: static; display: inline-flex; }

.gtd-stage .add-row {
  display: flex; align-items: center; gap: 6px;
  padding: 0 4px 0 24px; font-family: var(--font-hand);
  font-size: 22px; color: var(--ink-faint); cursor: text;
  height: var(--line-h); line-height: var(--line-h);
  border-radius: 2px; opacity: 0; transition: opacity .18s ease;
}
.gtd-stage .add-row:hover { color: var(--ink-soft); }
.gtd-stage .add-row .plus { font-family: var(--font-mono-n); font-size: 12px; width: 18px; text-align: center; }
.gtd-stage .entries:hover .add-row,
.gtd-stage .reminders-col:hover .add-row,
.gtd-stage .bucket-col:hover .add-row,
.gtd-stage .add-row:focus-within { opacity: 1; }

/* ─────────────────────── bucket ─────────────────────── */
.gtd-stage .tabs {
  display: flex; gap: 14px; font-family: var(--font-mono-n);
  font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink-soft); margin-bottom: 4px;
}
.gtd-stage .tabs button {
  appearance: none; border: 0; background: transparent; font: inherit;
  color: inherit; cursor: pointer; padding: 2px 0;
}
.gtd-stage .tabs button.active { color: var(--ink); border-bottom: 1.5px solid var(--ink); }
.gtd-stage .tabs button:hover { color: var(--ink); }
.gtd-stage .tabs .count { opacity: .55; margin-left: 4px; font-size: 10px; }

/* Bucket: same en-dash bullet as the other lists; strike-through alone
   marks "done." The bullet stays clickable to toggle, with a soft hover. */
.gtd-stage .bucket-entry .bullet { cursor: pointer; transition: color .12s ease; }
.gtd-stage .bucket-entry .bullet:hover { color: var(--red-ink); }
.gtd-stage .bucket-entry.checked .editable {
  text-decoration: line-through; text-decoration-thickness: 1px; opacity: .5;
}
.gtd-stage .bucket-entry.checked .bullet { opacity: .5; }
.gtd-stage .bucket-cat-icon {
  display: inline-block; vertical-align: middle;
  margin: 0 6px 0 2px; position: relative; top: -3px; color: var(--ink);
}
.gtd-stage .bucket-entry.checked .bucket-cat-icon { opacity: .4; }

.gtd-stage .two-col {
  display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
  margin-top: 4px; padding-top: 6px; border-top: 1px solid var(--margin-soft);
}
.gtd-stage .two-col > div { min-width: 0; }
.gtd-stage .two-col > div + div { border-left: 1px solid var(--margin-soft); padding-left: 14px; }

/* ─────────────────────── habits ─────────────────────── */
.gtd-stage .habits-wrap {
  margin-top: 6px; padding-top: 6px;
  border-top: 1px solid var(--margin-soft);
  flex: 1; display: flex; flex-direction: column; min-height: 0;
}
.gtd-stage .habits {
  width: 100%; border-collapse: collapse;
  font-family: var(--font-hand); font-size: 22px; color: var(--ink);
  table-layout: fixed;
}
.gtd-stage .habits th, .gtd-stage .habits td {
  border: 1px solid var(--rule-strong);
  height: var(--line-h); vertical-align: middle;
  text-align: center; padding: 0;
}
.gtd-stage .habits th {
  font-family: var(--font-serif-n); font-weight: 600;
  font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink); background: rgba(255,255,255,.18);
  height: calc(var(--line-h) + 2px);
}
.gtd-stage .habits th.habit-name { text-align: left; padding-left: 8px; }
.gtd-stage .habits td.habit-name {
  font-family: var(--font-hand); font-size: 22px;
  text-align: left; padding-left: 8px; position: relative;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.gtd-stage .habits td.habit-name .editable {
  outline: none; cursor: text; display: inline-block;
  min-width: 40px; max-width: calc(100% - 24px);
  overflow: hidden; text-overflow: ellipsis; vertical-align: middle;
}
.gtd-stage .habits td.habit-name .row-del {
  display: none; position: absolute; right: 4px; top: 50%;
  transform: translateY(-50%); width: 18px; height: 18px;
  border-radius: 4px; border: 0; background: transparent;
  color: var(--ink-faint); cursor: pointer;
  font-family: var(--font-mono-n); font-size: 12px;
}
.gtd-stage .habits tr:hover td.habit-name .row-del { display: inline-flex; align-items: center; justify-content: center; }
.gtd-stage .habits td.habit-name .row-del:hover { color: var(--red-ink); background: rgba(155,40,40,.08); }
.gtd-stage .habits td.cell { cursor: pointer; position: relative; }
.gtd-stage .habits th.habit-icon, .gtd-stage .habits td.habit-icon {
  text-align: center; vertical-align: middle; padding: 0;
}
.gtd-stage .habits td.habit-icon { cursor: pointer; }
.gtd-stage .habits td.habit-icon:hover { background: rgba(255,230,150,.3); }
.gtd-stage .habit-icon-svg { width: 18px; height: 18px; display: inline-block; vertical-align: middle; }
.gtd-stage .habit-icon-text { font-family: var(--font-hand); font-size: 20px; color: var(--ink); display: inline-block; line-height: 1; }
.gtd-stage .habits td.cell.scheduled {
  background: repeating-linear-gradient(135deg, transparent 0 6px, rgba(22,22,27,.05) 6px 7px);
}
.gtd-stage .habits td.cell:hover { background: rgba(255,230,150,.3); }
.gtd-stage .habits tr.totals td {
  border: 0; border-top: 1.5px solid var(--ink);
  font-family: var(--font-hand); font-size: 26px;
  color: var(--ink); font-weight: 600;
  height: calc(var(--line-h) + 4px);
}
.gtd-stage .habits tr.totals td.totals-label {
  text-align: left; padding-left: 8px;
  font-family: var(--font-serif-n); font-weight: 600;
  font-size: 13px; letter-spacing: .06em; text-transform: uppercase;
}
.gtd-stage .habits tr.add-habit td {
  border-style: dashed; color: var(--ink-faint);
  font-family: var(--font-hand); font-size: 22px;
  text-align: left; padding-left: 8px; cursor: pointer;
  opacity: 0; transition: opacity .18s ease;
}
.gtd-stage .habits-wrap:hover tr.add-habit td { opacity: 1; }
.gtd-stage .habits tr.add-habit td:hover { background: rgba(255,230,150,.2); color: var(--ink-soft); }

/* ─────────────────────── marks (SVG) ─────────────────────── */
.gtd-stage .mark-wrap { width: 100%; height: 100%; display: grid; place-items: center; pointer-events: none; }
.gtd-stage .mark-wrap svg { width: 55%; height: 55%; }
.gtd-stage .mark-wrap.partial path { stroke: var(--partial); }
.gtd-stage .mark-wrap.expected path { stroke: var(--expected); }
.gtd-stage .mark-wrap.excellent path { stroke: var(--excellent); fill: none; }

/* ─────────────────────── days (right page) ─────────────────────── */
.gtd-stage .day-list { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.gtd-stage .day {
  position: relative; padding: 4px;
  flex: 1 1 0; display: flex; flex-direction: column; min-height: 0;
}
.gtd-stage .day + .day { border-top: 1px solid var(--margin-soft); }
.gtd-stage .day.weekend-row {
  flex: 1.1 1 0; display: grid;
  grid-template-columns: 1fr 1px 1fr; padding: 0;
}
.gtd-stage .day.weekend-row .weekend-sep { background: var(--margin-soft); }
.gtd-stage .day.weekend-row .weekend-half {
  display: flex; flex-direction: column; padding: 4px 8px; min-height: 0;
}
.gtd-stage .day-head {
  display: flex; align-items: baseline; gap: 8px;
  font-family: var(--font-hand); font-size: 22px;
  line-height: var(--line-h); color: var(--ink); white-space: nowrap;
}
.gtd-stage .day-head .dow {
  font-family: var(--font-serif-n); font-weight: 600;
  font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
  position: relative; top: -2px;
}
.gtd-stage .day-head .dow::after {
  content: ""; display: inline-block; width: 16px; height: 1px;
  margin: 0 6px 4px 6px; vertical-align: middle;
  background: var(--ink); opacity: .8;
}
.gtd-stage .day-head .date { font-family: var(--font-hand); font-size: 22px; }
.gtd-stage .day-head.today .dow, .gtd-stage .day-head.today .date { color: var(--red-ink); }
.gtd-stage .today-marker {
  position: absolute; left: -52px; top: 0; bottom: 0;
  width: 28px; display: flex; align-items: center; justify-content: center;
  pointer-events: none; z-index: 1;
}
.gtd-stage .today-marker span {
  font-family: var(--font-serif-n); font-weight: 800; font-size: 16px;
  letter-spacing: .14em; color: var(--wine); text-transform: uppercase;
  white-space: nowrap; transform: rotate(-90deg); transform-origin: center;
}

/* Bookmark ribbon — wine-colored vertical strip that hangs through the
   spread when the displayed week is the current ISO week. Positioned
   slightly off-center past the spine on the right-page side; protrudes
   above and below the spread edges with a V-notched tail so it reads as
   a real ribbon, not a colored bar. */
.gtd-stage .page-ribbon {
  position: absolute;
  top: -8px;
  bottom: -42px;
  /* Centered on the spine with a subtle 4 px lean to the right —
     reads as a ribbon dangling between the two pages, off-axis just
     enough to feel hand-placed rather than mechanical. */
  left: calc(50% + 4px);
  width: 8px;
  background: var(--wine);
  z-index: 4;
  pointer-events: none;
  display: none;
  clip-path: polygon(0 0, 100% 0, 100% 96%, 50% 100%, 0 96%);
  box-shadow: 1px 0 3px rgba(0, 0, 0, 0.18);
}
.gtd-stage.is-current-week .page-ribbon { display: block; }
.gtd-stage .day-events {
  display: flex; flex-direction: column; flex-wrap: wrap; align-content: flex-start;
  margin-left: 8px; min-height: 0; overflow: hidden; max-height: 100%;
  flex: 1;
}
.gtd-stage .event {
  display: inline-flex; align-items: baseline; gap: 4px;
  font-family: var(--font-hand); font-size: 22px; color: var(--ink);
  line-height: var(--line-h); padding: 0 4px 0 0; margin-right: 18px;
  position: relative; max-width: 100%;
}
.gtd-stage .event .src {
  display: inline-block; width: 12px; font-family: var(--font-mono-n);
  font-size: 11px; color: var(--ink-soft); text-align: center;
}
.gtd-stage .event.calendar .src { color: var(--ink-faint); }
.gtd-stage .event.calendar .text {
  border-bottom: 1px dashed var(--ink-faint); padding-bottom: 1px;
}
.gtd-stage .event .text {
  outline: none; cursor: text;
  overflow-wrap: anywhere; word-break: break-word; white-space: pre-wrap;
}
.gtd-stage .event .text:focus { background: rgba(255,230,150,.25); border-radius: 2px; }
.gtd-stage .event .delete {
  display: none; width: 16px; height: 16px;
  border: 0; background: transparent; color: var(--ink-faint);
  cursor: pointer; font-family: var(--font-mono-n); font-size: 10px;
}
.gtd-stage .event:hover .delete { display: inline-flex; align-items: center; justify-content: center; }
.gtd-stage .day-add {
  display: inline-flex; align-items: center; gap: 4px;
  margin-left: 8px; font-family: var(--font-hand); font-size: 20px;
  color: var(--ink-faint); cursor: text; line-height: var(--line-h);
  opacity: 0; transition: opacity .18s ease;
}
.gtd-stage .day:hover .day-add, .gtd-stage .weekend-row:hover .day-add { opacity: 1; }
.gtd-stage .day-add:hover { color: var(--ink-soft); }
.gtd-stage .day-add .plus { font-family: var(--font-mono-n); font-size: 11px; }

/* ─────────────────────── left-page week nav (mirror of .right-head) ─────────────────────── */
/* Sits in the top-left corner of the left page so it visually mirrors
   the notebook/calendar/fullcal.js toggle on the right. Pulled out of
   the inline spread-header so the date underneath can render large
   and centered like the FullCalendar title. */
.gtd-stage .left-head {
  position: absolute; top: 16px; left: 24px; z-index: 3;
  display: inline-flex; align-items: center; gap: 4px;
  font-family: var(--font-mono-n); font-size: 11px;
  color: var(--ink-soft);
}
.gtd-stage .left-head button {
  appearance: none; border: 1px solid var(--ink-faint);
  background: transparent; color: var(--ink); font: inherit;
  width: 22px; height: 22px; border-radius: 3px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  padding: 0;
}
.gtd-stage .left-head button.today {
  width: auto; padding: 0 8px; font-size: 10px;
  letter-spacing: .1em; text-transform: uppercase;
  font-family: var(--font-serif-n); font-weight: 600;
}
.gtd-stage .left-head button:hover { background: rgba(22,22,27,.08); }

/* ─────────────────────── right-page view toggle + calendar ─────────────────────── */
/* Toggle as two serif-uppercase labels with a margin-toned underline on
   the active one — matches the section labels (NOTES, BUCKET, HABITS)
   instead of looking like a SaaS segmented control. */
.gtd-stage .right-head {
  position: absolute; top: 16px; right: 24px; z-index: 3;
  display: inline-flex; gap: 20px;
  font-family: var(--font-serif-n); font-weight: 600;
  font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
}
.gtd-stage .right-head button {
  appearance: none; background: transparent; border: 0;
  padding: 0 0 3px; color: var(--ink-faint);
  cursor: pointer; font: inherit;
  border-bottom: 1.5px solid transparent;
}
.gtd-stage .right-head button.on {
  color: var(--ink); border-bottom-color: var(--ink);
}
.gtd-stage .right-head button:not(.on):hover { color: var(--ink-soft); }

.gtd-stage .calendar-view {
  position: relative;
  flex: 1; display: flex; flex-direction: column;
  min-height: 0;
  padding: 0;
  background: var(--paper);
  isolation: isolate;
}
.gtd-stage .calendar-view iframe {
  flex: 1; width: 100%; border: 0;
  background: transparent;
  border-radius: 12px;
  /* darken = min(iframe, paper) per channel. Any pixel in the embed
     brighter than the paper backdrop (Google's white chrome, the
     near-white cell bg, faint borders) gets clamped down to --paper.
     Pixels darker than paper (text, dark event chips) pass through
     unchanged. No filter chain needed. */
  mix-blend-mode: darken;
}
/* Disconnect → small icon button at the iframe's top-right corner. */
.gtd-stage .cal-disconnect {
  position: absolute; top: 44px; right: 6px; z-index: 4;
  appearance: none; width: 22px; height: 22px;
  border: 1px solid var(--ink-faint); border-radius: 50%;
  background: color-mix(in oklch, var(--paper) 92%, transparent);
  color: var(--ink-soft);
  font-family: var(--font-mono-n); font-size: 14px; line-height: 1;
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer; padding: 0;
}
.gtd-stage .cal-disconnect:hover {
  color: var(--red-ink); border-color: rgba(155,40,40,.45);
  background: var(--paper);
}
.gtd-stage .calendar-empty {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 14px; text-align: center; padding: 20px;
  font-family: var(--font-serif-n); color: var(--ink-soft);
  border: 1px dashed var(--margin-soft); border-radius: 4px;
}
.gtd-stage .calendar-empty h4 {
  margin: 0; font-family: var(--font-hand);
  font-size: 32px; color: var(--ink); font-weight: 600;
}
.gtd-stage .calendar-empty p {
  margin: 0; font-size: 13px; max-width: 360px; line-height: 1.5;
}
.gtd-stage .calendar-empty .connect-btn {
  appearance: none; font: inherit; font-family: var(--font-serif-n);
  font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
  background: var(--ink); color: var(--paper);
  border: 1px solid var(--ink); padding: 8px 16px;
  border-radius: 4px; cursor: pointer;
}
.gtd-stage .calendar-empty .connect-btn:hover { opacity: .9; }
.gtd-stage .calendar-empty .small {
  font-family: var(--font-mono-n); font-size: 10px;
  letter-spacing: .08em; text-transform: uppercase;
  color: var(--ink-faint); margin-top: 4px;
}

/* ─────────────────────── fullcal.js tab (sandbox) ─────────────────────── */
.gtd-stage .fc-toolbar-row {
  display: flex; align-items: center; gap: 14px;
  font-family: var(--font-mono-n); font-size: 10px;
  letter-spacing: .08em; text-transform: uppercase;
  color: var(--ink-soft); margin: 36px 2px 8px;
}
.gtd-stage .fc-toolbar-row button {
  appearance: none; border: 0; background: transparent;
  font: inherit; color: var(--ink-soft); cursor: pointer;
  padding: 3px 0; border-bottom: 1px dashed transparent;
}
.gtd-stage .fc-toolbar-row button:hover {
  color: var(--ink); border-bottom-color: var(--ink-faint);
}
.gtd-stage .fc-toolbar-row .fc-cal-id {
  margin-left: auto; text-transform: none; letter-spacing: 0;
  font-style: italic; color: var(--ink-faint);
  font-family: var(--font-serif-n); font-size: 11px;
}
.gtd-stage .fc-toolbar-row .cal-readonly {
  color: var(--ink-faint);
}

.gtd-stage .fc-stage {
  flex: 1; min-height: 0; display: flex; flex-direction: column;
  /* FullCalendar v6 CSS-variable overrides — map FC's tokens to the
     notebook palette so the widget reads as part of the page rather
     than a third-party drop-in. */
  --fc-border-color: var(--rule);
  --fc-page-bg-color: var(--paper);
  --fc-neutral-bg-color: var(--paper-2);
  --fc-list-event-hover-bg-color: rgba(22,22,27,.06);
  --fc-today-bg-color: rgba(155,40,40,.05);
  --fc-now-indicator-color: var(--red-ink);
  --fc-event-bg-color: rgba(22,22,27,.08);
  --fc-event-border-color: var(--ink);
  --fc-event-text-color: var(--ink);
  --fc-event-selected-overlay-color: rgba(22,22,27,.12);
  --fc-button-bg-color: transparent;
  --fc-button-border-color: var(--ink-faint);
  --fc-button-text-color: var(--ink);
  --fc-button-hover-bg-color: rgba(22,22,27,.06);
  --fc-button-hover-border-color: var(--ink-faint);
  --fc-button-active-bg-color: var(--ink);
  --fc-button-active-border-color: var(--ink);
  --fc-button-active-text-color: var(--paper);
}
.gtd-stage .fc-stage .fc {
  font-family: var(--font-serif-n);
  flex: 1; min-height: 0;
  color: var(--ink);
}
.gtd-stage .fc-stage .fc-scrollgrid {
  border: 1px solid var(--margin-soft);
  border-radius: 3px;
}
/* FC v6 sizes its table columns to content width by default — on a
   wider container the 7 day columns cluster on the left and the rest
   reads as empty paper. Pin every FC table to 100% width with
   table-layout: fixed so each day gets an equal slice and the grid
   fills the .fc-stage. */
.gtd-stage .fc-stage .fc,
.gtd-stage .fc-stage .fc-view-harness,
.gtd-stage .fc-stage .fc-scrollgrid {
  width: 100% !important;
}
.gtd-stage .fc-stage table {
  width: 100% !important;
}
.gtd-stage .fc-stage .fc-col-header,
.gtd-stage .fc-stage .fc-timegrid-cols > table {
  table-layout: fixed !important;
}
.gtd-stage .fc-stage .fc-toolbar.fc-header-toolbar {
  margin: 0 0 8px;
}
.gtd-stage .fc-stage .fc-toolbar-title {
  font-family: var(--font-hand); font-size: 24px;
  font-weight: 600; line-height: 1; color: var(--ink);
}
.gtd-stage .fc-stage .fc-col-header-cell-cushion {
  font-family: var(--font-serif-n); font-weight: 600;
  font-size: 11px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-soft);
  padding: 6px 4px; text-decoration: none;
}
.gtd-stage .fc-stage .fc-day-today .fc-col-header-cell-cushion { color: var(--red-ink); }
.gtd-stage .fc-stage .fc-timegrid-slot-label-cushion,
.gtd-stage .fc-stage .fc-timegrid-axis-cushion {
  font-family: var(--font-mono-n); font-size: 9px;
  color: var(--ink-faint); letter-spacing: .04em;
}
.gtd-stage .fc-stage .fc-event {
  border-radius: 2px; border-left-width: 2px;
  cursor: pointer;
}
.gtd-stage .fc-stage .fc-event-title { font-family: var(--font-hand); font-size: 13px; font-weight: 500; }
.gtd-stage .fc-stage .fc-event-time  { font-family: var(--font-mono-n); font-size: 9px; letter-spacing: .04em; }
.gtd-stage .fc-stage .fc-button {
  font-family: var(--font-mono-n); font-size: 10px;
  letter-spacing: .08em; text-transform: uppercase;
  padding: 4px 10px; border-radius: 3px; font-weight: 600;
  box-shadow: none !important;
  color: var(--ink);
}
/* FC v6 keeps `color` pointing at --fc-button-text-color when active,
   so without this override the active button reads dark-ink-on-dark-ink
   and the label disappears. Force cream text on the dark state. */
.gtd-stage .fc-stage .fc-button-primary:not(:disabled).fc-button-active,
.gtd-stage .fc-stage .fc-button-primary:not(:disabled):active {
  background-color: var(--ink);
  border-color: var(--ink);
  color: var(--paper);
}
.gtd-stage .fc-stage .fc-button:focus,
.gtd-stage .fc-stage .fc-button:focus-visible {
  outline: 1px solid var(--ink-faint); box-shadow: none !important;
}

/* Slot rows pinned compact so the day fits the right-page pane
   without FC's internal scroller kicking in. expandRows on the
   FC instance then stretches them to fill any leftover space. */
.gtd-stage .fc-stage .fc-timegrid-slot { height: 20px; }
.gtd-stage .fc-stage .fc-timegrid-slot-minor { border-top-style: none; }

/* Thin scrollbars for any FC scroller that still appears (Chromium
   + Firefox). The default ones add visible bulk on the right edge
   and break the column rhythm. */
.gtd-stage .fc-stage .fc-scroller {
  scrollbar-width: thin;
  scrollbar-color: var(--ink-faint) transparent;
}
.gtd-stage .fc-stage .fc-scroller::-webkit-scrollbar { width: 6px; height: 6px; }
.gtd-stage .fc-stage .fc-scroller::-webkit-scrollbar-thumb { background: var(--ink-faint); border-radius: 3px; }
.gtd-stage .fc-stage .fc-scroller::-webkit-scrollbar-track { background: transparent; }

/* Today highlight — the default red tint felt heavy at column scale;
   pull it back so it reads as a wash, not an alert. */
.gtd-stage .fc-stage .fc-day-today { background-color: rgba(155,40,40,.035) !important; }

/* Compact day header — mono date below the weekday so the column
   doesn't wrap onto three lines at 7-column width. */
.gtd-stage .fc-stage .fc-col-header-cell {
  padding: 4px 2px;
}
.gtd-stage .fc-stage .fc-col-header-cell-cushion {
  padding: 4px 2px;
  line-height: 1.2;
}

.gtd-stage .fc-stage .fc-list-event-title a,
.gtd-stage .fc-stage .fc-list-day-cushion a { color: var(--ink); }

/* ─────────────────────── legend (bottom-left) ─────────────────────── */
.gtd-stage .legend {
  margin-top: auto; padding-top: 14px;
  border-top: 1px dashed var(--ink-faint);
  font-family: var(--font-mono-n); font-size: 10px;
  color: var(--ink-soft); display: flex; flex-wrap: wrap; gap: 14px;
  align-items: center; text-transform: uppercase; letter-spacing: .06em;
}
.gtd-stage .legend .li { display: inline-flex; align-items: center; gap: 4px; }
.gtd-stage .legend .swatch { width: 18px; height: 18px; }

/* ─────────────────────── modal (popover) ─────────────────────── */
.gtd-stage .popover-backdrop {
  position: fixed; inset: 0; background: rgba(20,14,4,.4);
  z-index: 1000; display: grid; place-items: center;
  -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
}
.gtd-stage .popover {
  width: 420px; max-width: 90vw; background: var(--paper);
  border-radius: 6px; padding: 22px 26px;
  box-shadow: 0 30px 80px rgba(0,0,0,.5);
  position: relative; font-family: var(--font-serif-n);
  color: var(--ink); border: 1px solid var(--paper-edge);
}
.gtd-stage .popover h3 {
  margin: 0 0 14px; font-family: var(--font-hand);
  font-size: 32px; font-weight: 600; line-height: 1;
}
.gtd-stage .popover label {
  display: block; font-size: 11px; letter-spacing: .06em;
  text-transform: uppercase; color: var(--ink-soft); margin: 12px 0 4px;
}
.gtd-stage .popover input, .gtd-stage .popover select, .gtd-stage .popover textarea {
  width: 100%; font-family: var(--font-hand); font-size: 22px;
  background: transparent; border: 0; border-bottom: 1px solid var(--ink-faint);
  color: var(--ink); padding: 2px 0; outline: none;
}
.gtd-stage .popover input:focus { border-bottom-color: var(--ink); }
.gtd-stage .popover .dow-pick { display: flex; gap: 6px; }
.gtd-stage .popover .dow-pick button {
  appearance: none; width: 34px; height: 34px; border-radius: 50%;
  border: 1px solid var(--ink-faint); background: transparent; color: var(--ink);
  font-family: var(--font-serif-n); font-size: 11px; font-weight: 600;
  letter-spacing: .04em; cursor: pointer; text-transform: uppercase;
}
.gtd-stage .popover .dow-pick button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.gtd-stage .popover .actions { display: flex; justify-content: space-between; margin-top: 18px; }
.gtd-stage .popover .actions .right { display: flex; gap: 10px; }
.gtd-stage .popover .btn {
  appearance: none; font: inherit; font-family: var(--font-serif-n);
  font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
  background: transparent; border: 1px solid var(--ink-faint); color: var(--ink);
  padding: 7px 14px; border-radius: 4px; cursor: pointer;
}
.gtd-stage .popover .btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.gtd-stage .popover .btn.danger { color: var(--red-ink); border-color: rgba(155,40,40,.4); }
.gtd-stage .popover .btn:hover { background: rgba(22,22,27,.08); }
.gtd-stage .popover .btn.primary:hover { opacity: .9; }
.gtd-stage .popover .seg {
  display: inline-flex; border: 1px solid var(--ink-faint); border-radius: 4px;
  overflow: hidden; font-family: var(--font-serif-n); font-size: 12px;
  letter-spacing: .04em; text-transform: uppercase;
}
.gtd-stage .popover .seg button {
  appearance: none; background: transparent; color: var(--ink);
  border: 0; padding: 6px 10px; cursor: pointer; font: inherit;
}
.gtd-stage .popover .seg button + button { border-left: 1px solid var(--ink-faint); }
.gtd-stage .popover .seg button.on { background: var(--ink); color: var(--paper); }

</style>
</head>
