<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <!-- KFC bucket — Medium (4 pieces). Wider tapered bucket. -->
  <ellipse cx="120" cy="222" rx="42" ry="3.5" fill="currentColor" opacity="0.18" stroke="none"/>
  <!-- Bucket body -->
  <path d="M 80 122 L 88 216 L 152 216 L 160 122 Z" fill="var(--paper, #f6ecd5)" stroke="currentColor" stroke-width="1.8"/>
  <!-- Rim -->
  <ellipse cx="120" cy="122" rx="40" ry="8" fill="var(--paper, #f6ecd5)" stroke="currentColor" stroke-width="1.6"/>
  <!-- Stripes (4) -->
  <line x1="82" y1="146" x2="158" y2="146" stroke="currentColor" stroke-width="2"/>
  <line x1="83" y1="168" x2="157" y2="168" stroke="currentColor" stroke-width="2"/>
  <line x1="84" y1="190" x2="156" y2="190" stroke="currentColor" stroke-width="2"/>
  <line x1="85" y1="210" x2="155" y2="210" stroke="currentColor" stroke-width="1.5" opacity="0.6"/>
  <!-- 4 chicken pieces (3 front row, 1 peek behind) -->
  <ellipse cx="98"  cy="118" rx="10" ry="7" fill="currentColor" opacity="0.92"/>
  <ellipse cx="120" cy="114" rx="11" ry="8" fill="currentColor" opacity="0.95"/>
  <ellipse cx="142" cy="118" rx="10" ry="7" fill="currentColor" opacity="0.92"/>
  <ellipse cx="110" cy="120" rx="8"  ry="6" fill="currentColor" opacity="0.75"/>
  <!-- Crispy texture -->
  <circle cx="95"  cy="117" r="0.9" fill="var(--paper, #f6ecd5)"/>
  <circle cx="101" cy="119" r="0.9" fill="var(--paper, #f6ecd5)"/>
  <circle cx="117" cy="112" r="0.9" fill="var(--paper, #f6ecd5)"/>
  <circle cx="124" cy="114" r="0.9" fill="var(--paper, #f6ecd5)"/>
  <circle cx="139" cy="117" r="0.9" fill="var(--paper, #f6ecd5)"/>
  <circle cx="145" cy="119" r="0.9" fill="var(--paper, #f6ecd5)"/>
</svg>
