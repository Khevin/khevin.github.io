<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <!-- KFC bucket — Large (8 pieces). The iconic round bucket. -->
  <ellipse cx="120" cy="226" rx="58" ry="4" fill="currentColor" opacity="0.18" stroke="none"/>
  <!-- Bucket body — fuller bucket shape -->
  <path d="M 64 102 L 76 218 L 164 218 L 176 102 Z" fill="var(--paper, #f6ecd5)" stroke="currentColor" stroke-width="2"/>
  <!-- Rim -->
  <ellipse cx="120" cy="102" rx="56" ry="10" fill="var(--paper, #f6ecd5)" stroke="currentColor" stroke-width="2"/>
  <!-- Stripes (5) -->
  <line x1="66" y1="128" x2="174" y2="128" stroke="currentColor" stroke-width="2.2"/>
  <line x1="68" y1="152" x2="172" y2="152" stroke="currentColor" stroke-width="2.2"/>
  <line x1="70" y1="176" x2="170" y2="176" stroke="currentColor" stroke-width="2.2"/>
  <line x1="72" y1="200" x2="168" y2="200" stroke="currentColor" stroke-width="2.2"/>
  <line x1="74" y1="214" x2="166" y2="214" stroke="currentColor" stroke-width="1.5" opacity="0.6"/>
  <!-- Chicken pieces overflowing the rim — 8 visible -->
  <ellipse cx="80"  cy="100" rx="10" ry="7"  fill="currentColor" opacity="0.85"/>
  <ellipse cx="98"  cy="92"  rx="11" ry="8"  fill="currentColor" opacity="0.95"/>
  <ellipse cx="120" cy="86"  rx="12" ry="9"  fill="currentColor" opacity="0.98"/>
  <ellipse cx="142" cy="92"  rx="11" ry="8"  fill="currentColor" opacity="0.95"/>
  <ellipse cx="160" cy="100" rx="10" ry="7"  fill="currentColor" opacity="0.85"/>
  <ellipse cx="108" cy="100" rx="9"  ry="6"  fill="currentColor" opacity="0.75"/>
  <ellipse cx="130" cy="100" rx="9"  ry="6"  fill="currentColor" opacity="0.75"/>
  <ellipse cx="118" cy="102" rx="7"  ry="5"  fill="currentColor" opacity="0.6"/>
  <!-- Crispy texture dots -->
  <g fill="var(--paper, #f6ecd5)">
    <circle cx="77"  cy="99"  r="1"/>
    <circle cx="83"  cy="101" r="1"/>
    <circle cx="95"  cy="91"  r="1"/>
    <circle cx="101" cy="93"  r="1"/>
    <circle cx="116" cy="85"  r="1"/>
    <circle cx="124" cy="87"  r="1"/>
    <circle cx="139" cy="91"  r="1"/>
    <circle cx="145" cy="93"  r="1"/>
    <circle cx="157" cy="99"  r="1"/>
    <circle cx="163" cy="101" r="1"/>
  </g>
</svg>
