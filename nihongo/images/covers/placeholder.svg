<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 360" aria-hidden="true">
  <!-- Cover placeholder: deliberately short (1600×360, ~4.4:1) so it
       can't fill a tall frame. Lets us verify the card stays full-height
       and the actions stay pinned to the bottom even when the image
       itself is smaller than the available space. -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9efd1"/>
      <stop offset="100%" stop-color="#ead9b2"/>
    </linearGradient>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="24" height="24" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="24" stroke="rgba(141,102,48,0.06)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="360" fill="url(#bg)"/>
  <rect width="1600" height="360" fill="url(#hatch)"/>
  <!-- Centered illustration mark, scaled to the shorter canvas -->
  <g transform="translate(800,170)" opacity="0.20">
    <circle r="70" fill="none" stroke="#8d6630" stroke-width="3"/>
    <text text-anchor="middle" dominant-baseline="central" font-family="serif" font-size="78" fill="#8d6630">食</text>
  </g>
  <text x="800" y="298" text-anchor="middle" font-family="serif" font-style="italic" font-size="18" fill="rgba(141,102,48,0.45)">
    cover image placeholder
  </text>
</svg>
