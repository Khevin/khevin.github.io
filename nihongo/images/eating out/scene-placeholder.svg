<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" aria-hidden="true">
  <!-- 16:9 scene placeholder used by konbini cashier + change steps
       until real images land. Drop a konbini-cashier.png or
       konbini-change.png next to this file and the onerror chain
       picks it up automatically. -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbf5e6"/>
      <stop offset="100%" stop-color="#f1e3c2"/>
    </linearGradient>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="32" height="32" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="32" stroke="rgba(141,102,48,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#hatch)"/>
  <!-- Suggestion of a register counter -->
  <g transform="translate(800,500)" opacity="0.18">
    <line x1="-340" y1="80" x2="340" y2="80" stroke="#8d6630" stroke-width="3"/>
    <rect x="-220" y="20" width="440" height="60" fill="#8d6630" rx="4"/>
  </g>
  <text x="800" y="700" text-anchor="middle" font-family="serif" font-style="italic" font-size="26" fill="rgba(141,102,48,0.45)">
    konbini scene placeholder · 16:9
  </text>
</svg>
