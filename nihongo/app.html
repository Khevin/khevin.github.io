<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>nihongo — 日本語</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:        #f6ecd5;
    --paper-2:      #fbf5e6;
    --paper-edge:   #ead9b2;
    --paper-shadow: rgba(100,72,30,0.10);

    --ink:    #3a2818;
    --ink-2:  #6b5740;
    --ink-3:  #9a8869;
    --ink-4:  #c2b294;

    --gold:       #b48a4a;
    --gold-dark:  #8d6630;
    --gold-soft:  #d9c191;
    --sage:       #7a8f6e;
    --sage-soft:  #b9c4a6;
    --rose:       #c08a8a;

    --accent:      var(--gold);
    --accent-soft: var(--gold-soft);

    --serif-jp:   'Shippori Mincho', 'Noto Serif JP', 'Hiragino Mincho Pro', serif;
    --sans-jp:    'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif;
    --serif:      'EB Garamond', Georgia, serif;
    --hand:       'Caveat', cursive;

    --pad-page: 56px;
    --content-max: 980px;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--serif);
    font-size: 16px;
    line-height: 1.5;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(180,138,74,0.06), transparent 60%),
      radial-gradient(circle at 80% 80%, rgba(122,143,110,0.05), transparent 60%);
    background-attachment: fixed;
  }
  body {
    background-image:
      radial-gradient(circle at 20% 20%, rgba(180,138,74,0.06), transparent 60%),
      radial-gradient(circle at 80% 80%, rgba(122,143,110,0.05), transparent 60%);
  }
  img { display: block; max-width: 100%; }

  /* ─── layout shell ──────────────────────────────────────────────────── */
  .app {
    display: grid;
    grid-template-columns: 232px 1fr;
    min-height: 100vh;
    position: relative; z-index: 1;
  }
  .main {
    padding: var(--pad-page);
    min-width: 0;
    overflow-x: hidden;
  }
  .main-inner {
    max-width: var(--content-max);
    margin: 0 auto;
  }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { position: sticky; top: 0; width: 100%; min-height: 0; padding: 12px; z-index: 20; }
    .sidebar-inner { flex-direction: row !important; align-items: center; gap: 8px !important; }
    .brand { display: none; }
    .nav-list { display: flex !important; flex-direction: row !important; gap: 6px !important; flex: 1; overflow-x: auto; }
    .nav-list .bookmark { min-width: 96px; flex: 0 0 auto; }
    .sidebar-foot { display: none; }
    :root { --pad-page: 24px; }
  }

  /* ─── sidebar ───────────────────────────────────────────────────────── */
  .sidebar {
    background: linear-gradient(180deg, var(--paper-edge) 0%, color-mix(in srgb, var(--paper-edge) 80%, var(--paper) 20%) 100%);
    border-right: 1px solid rgba(141,102,48,0.22);
    box-shadow: inset -10px 0 24px -16px rgba(100,72,30,0.18);
    padding: 24px 14px 24px 18px;
    position: sticky; top: 0; height: 100vh;
    overflow-y: auto;
  }
  .sidebar-inner { display: flex; flex-direction: column; height: 100%; gap: 24px; }
  .brand {
    display: flex; align-items: baseline; gap: 10px;
    padding: 0 6px 14px;
    border-bottom: 1px dashed rgba(141,102,48,0.3);
  }
  .brand-mark {
    font-family: var(--serif-jp); font-weight: 800; font-size: 38px;
    color: var(--gold-dark); letter-spacing: -0.02em; line-height: 1;
  }
  .brand-name {
    font-family: var(--serif); font-style: italic; font-size: 18px;
    color: var(--ink-2);
  }
  .brand-sub {
    font-family: var(--hand); font-size: 15px; color: var(--ink-3);
    margin-top: 2px;
  }

  .nav-list { display: flex; flex-direction: column; gap: 4px; list-style: none; padding: 0; margin: 0; }
  .nav-section-label {
    font-family: var(--serif); font-style: italic; font-size: 12px;
    color: var(--ink-3); letter-spacing: 0.06em; text-transform: lowercase;
    padding: 6px 8px 4px;
  }
  .bookmark {
    position: relative; display: flex; align-items: center; gap: 12px;
    padding: 10px 12px 10px 14px;
    border: none; background: transparent; cursor: pointer;
    color: var(--ink-2); width: 100%; text-align: left;
    font-family: var(--serif); font-size: 15px; line-height: 1.1;
    border-radius: 0 8px 8px 0;
    transition: background .15s, color .15s, transform .15s;
  }
  .bookmark .glyph {
    font-family: var(--serif-jp); font-weight: 600; font-size: 18px;
    width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
    color: var(--gold-dark);
    background: var(--paper-2);
    border-radius: 4px;
    border: 1px solid rgba(141,102,48,0.22);
    flex: 0 0 auto;
  }
  .bookmark .label {
    display: flex; flex-direction: column; gap: 2px;
    flex: 1; min-width: 0;
  }
  .bookmark .label .ja {
    font-family: var(--serif-jp); font-size: 14px; color: var(--ink-2); line-height: 1.1;
  }
  .bookmark .label .en {
    font-family: var(--serif); font-size: 13px; color: var(--ink-3);
    font-style: italic;
  }
  .bookmark:hover { background: rgba(180,138,74,0.10); color: var(--ink); }
  .bookmark.active {
    background: var(--paper-2);
    color: var(--ink);
    box-shadow:
      inset 4px 0 0 var(--gold),
      0 1px 0 rgba(141,102,48,0.18),
      0 -1px 0 rgba(141,102,48,0.18);
  }
  .bookmark.active .glyph { background: var(--gold); color: white; border-color: var(--gold-dark); }
  .bookmark.active .label .en { color: var(--gold-dark); font-style: normal; }

  .sidebar-foot {
    margin-top: auto;
    padding: 12px 10px;
    border-top: 1px dashed rgba(141,102,48,0.3);
    font-family: var(--serif); font-style: italic; font-size: 12px; color: var(--ink-3);
  }
  .streak {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 6px;
  }
  .streak-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--gold);
    box-shadow: 0 0 0 3px rgba(180,138,74,0.20);
  }

  /* ─── shared page chrome ────────────────────────────────────────────── */
  .page-head { margin-bottom: 28px; }
  .page-eyebrow {
    font-family: var(--serif); font-style: italic; font-size: 13px;
    color: var(--ink-3); letter-spacing: 0.04em;
  }
  .page-title-jp {
    font-family: var(--serif-jp); font-weight: 600;
    font-size: clamp(28px, 4vw, 40px);
    color: var(--ink);
    letter-spacing: 0.02em;
    margin: 4px 0 6px;
    line-height: 1.1;
    word-break: keep-all;
    overflow-wrap: break-word;
    line-break: strict;
  }
  .page-title-en {
    font-family: var(--serif); font-style: italic; font-size: 16px;
    color: var(--ink-2);
  }
  .rule {
    height: 0; margin: 16px 0 24px;
    border-top: 1px solid var(--paper-edge);
    position: relative;
  }
  .rule::after {
    content: ""; position: absolute; left: 0; top: -1px; width: 36px;
    border-top: 2px solid var(--gold);
  }

  /* ─── small ui ──────────────────────────────────────────────────────── */
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px;
    background: var(--paper-2);
    border: 1px solid rgba(141,102,48,0.25);
    font-family: var(--serif); font-size: 12px; color: var(--ink-2);
    cursor: pointer;
    transition: all .15s;
  }
  .pill:hover { background: var(--gold-soft); color: var(--ink); }
  .pill.active {
    background: var(--gold); color: white; border-color: var(--gold-dark);
  }
  .pill .ja { font-family: var(--serif-jp); }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 16px; border-radius: 8px;
    background: var(--paper-2); color: var(--ink);
    border: 1px solid rgba(141,102,48,0.25);
    font-family: var(--serif); font-size: 14px;
    cursor: pointer; transition: all .15s;
  }
  .btn:hover { background: var(--gold-soft); border-color: var(--gold); }
  .btn.primary { background: var(--gold); color: white; border-color: var(--gold-dark); }
  .btn.primary:hover { background: var(--gold-dark); }
  .btn.ghost { background: transparent; border-style: dashed; color: var(--ink-2); }

  .icon-btn {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--paper-2); border: 1px solid rgba(141,102,48,0.25);
    color: var(--ink-2); cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  .icon-btn:hover { background: var(--gold-soft); color: var(--ink); }
  .icon-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  /* ─── card / panel ──────────────────────────────────────────────────── */
  .panel {
    background: var(--paper-2);
    border: 1px solid rgba(141,102,48,0.22);
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.4) inset, 0 4px 14px var(--paper-shadow);
  }

  /* ─── book / cheatsheet frame ───────────────────────────────────────── */
  .book-frame {
    background: var(--paper-2);
    border: 2px solid var(--gold-soft);
    box-shadow:
      0 0 0 6px var(--paper-2),
      0 0 0 7px var(--gold-soft),
      0 8px 24px rgba(100,72,30,0.18);
    border-radius: 4px;
    padding: 36px clamp(20px, 4vw, 56px) 40px;
    position: relative;
  }
  .book-frame::before, .book-frame::after,
  .book-frame > .corner-tl, .book-frame > .corner-tr {
    content: ""; position: absolute; width: 14px; height: 14px;
    border: 2px solid var(--gold);
    background: var(--paper-2);
    border-radius: 50%;
  }
  .book-frame::before { top: -8px; left: -8px; }
  .book-frame::after  { bottom: -8px; right: -8px; }
  .book-frame > .corner-tl { top: -8px; right: -8px; }
  .book-frame > .corner-tr { bottom: -8px; left: -8px; }

  .book-title {
    text-align: center;
    font-family: var(--serif-jp); font-weight: 700;
    font-size: clamp(22px, 3vw, 32px);
    color: var(--ink); letter-spacing: 0.06em;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--gold-soft);
    margin-bottom: 24px;
    position: relative;
    word-break: keep-all;
    overflow-wrap: break-word;
    line-break: strict;
  }
  .book-title .particle { color: var(--ink-3); font-weight: 400; font-size: 0.8em; margin: 0 6px; }

  .sheet-image {
    width: 100%;
    margin: 0 auto 24px;
    border-radius: 4px;
    border: 1px solid var(--paper-edge);
    background: var(--paper-2);
    position: relative;
    overflow: hidden;
  }
  image-slot {
    border-radius: 4px;
  }

  .vocab-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px 32px;
  }
  @media (max-width: 640px) { .vocab-grid { grid-template-columns: 1fr; } }
  .vocab-row {
    display: grid;
    grid-template-columns: 28px 1fr;
    align-items: baseline;
    gap: 4px 10px;
    padding: 8px 4px;
    border-bottom: 1px dashed rgba(141,102,48,0.18);
    cursor: pointer;
    border-radius: 4px;
    transition: background .12s;
  }
  .vocab-row .body {
    display: flex; flex-wrap: wrap; align-items: baseline;
    gap: 2px 8px;
    min-width: 0;
  }
  .vocab-row:hover { background: rgba(180,138,74,0.10); }
  .vocab-row .num {
    font-family: var(--serif); font-size: 14px; color: var(--ink-3);
    font-weight: 600;
  }
  .vocab-row .kanji {
    font-family: var(--serif-jp); font-size: 18px; color: var(--ink);
    font-weight: 500;
  }
  .vocab-row .kana {
    font-family: var(--serif-jp); font-size: 13px; color: var(--ink-2);
  }
  .vocab-row .en {
    font-family: var(--serif); font-style: italic; font-size: 12px;
    color: var(--ink-3);
    width: 100%;
    margin-top: -2px;
  }
  body.no-english .vocab-row .en { visibility: hidden; }
  body.no-english .flash-en { visibility: hidden; }
  body.no-english .sentence .en { visibility: hidden; }
  body.no-english .reveal-en::after { content: "(tap to reveal)"; visibility: visible !important; opacity: .5; font-family: var(--serif); font-size: 11px; }

  /* ─── pager / book navigation ───────────────────────────────────────── */
  .pager {
    margin-top: 32px;
    display: flex; align-items: center; justify-content: center; gap: 16px;
  }
  .pager .dots { display: flex; gap: 8px; }
  .pager .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--paper-edge); border: 1px solid var(--gold-soft);
    cursor: pointer; transition: all .15s;
  }
  .pager .dot.active { background: var(--gold); border-color: var(--gold-dark); transform: scale(1.3); }
  .pager .dot:hover { background: var(--gold-soft); }

  /* ─── usage list ────────────────────────────────────────────────────── */
  .usage-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
  }
  .usage-card {
    background: var(--paper-2);
    border: 1px solid rgba(141,102,48,0.22);
    border-radius: 8px;
    padding: 14px 16px;
    transition: all .15s;
    cursor: pointer;
  }
  .usage-card:hover { border-color: var(--gold); background: var(--paper); transform: translateY(-1px); }
  .usage-card .ja {
    font-family: var(--serif-jp); font-size: 19px; color: var(--ink);
    font-weight: 500;
  }
  .usage-card .kana {
    font-family: var(--serif-jp); font-size: 12px; color: var(--ink-3);
    margin-top: 2px;
  }
  .usage-card .en {
    font-family: var(--serif); font-style: italic; font-size: 13px;
    color: var(--ink-2); margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed rgba(141,102,48,0.18);
  }

  /* ─── sentences ─────────────────────────────────────────────────────── */
  .sentence {
    padding: 18px 0;
    border-bottom: 1px solid var(--paper-edge);
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 16px;
    align-items: center;
  }
  .sentence:last-child { border-bottom: none; }
  .sentence .level-tag {
    font-family: var(--serif); font-size: 11px; color: var(--gold-dark);
    background: var(--gold-soft);
    padding: 2px 8px; border-radius: 4px;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  .sentence .body { min-width: 0; }
  .sentence .ja {
    font-family: var(--serif-jp); font-size: 20px; color: var(--ink);
    line-height: 1.6;
    font-weight: 400;
  }
  .sentence .en {
    font-family: var(--serif); font-style: italic; font-size: 14px;
    color: var(--ink-3);
    margin-top: 6px;
    line-height: 1.4;
  }
  .sentence .audio { color: var(--ink-3); }

  /* ─── flashcards ────────────────────────────────────────────────────── */
  .flash-deck {
    display: grid; grid-template-columns: 1fr; gap: 24px;
    max-width: 580px; margin: 0 auto;
  }
  .flash-stage {
    display: flex; align-items: center; gap: 14px;
    perspective: 1200px;
    position: relative;
  }
  .flash-stage > .flash-card { flex: 1; min-width: 0; }
  .flash-nav {
    flex: 0 0 auto;
    width: 52px; height: 52px;
    background: transparent;
    border-color: transparent;
    color: var(--ink-3);
  }
  .flash-nav svg { width: 22px; height: 22px; }
  .flash-nav:hover {
    background: var(--paper-2);
    color: var(--ink);
    border-color: rgba(141,102,48,0.25);
  }
  @media (max-width: 520px) {
    .flash-stage { gap: 6px; }
    .flash-nav { width: 40px; height: 40px; }
    .flash-nav svg { width: 18px; height: 18px; }
  }
  .flash-card {
    background: var(--paper-2);
    border: 1px solid var(--paper-edge);
    box-shadow:
      0 0 0 4px var(--paper-2),
      0 0 0 5px var(--gold-soft),
      0 12px 32px rgba(100,72,30,0.18);
    border-radius: 6px;
    padding: 32px;
    display: flex; flex-direction: column;
    transition: transform .35s cubic-bezier(.4,.0,.2,1);
  }
  .flash-image {
    width: 100%;
    margin-bottom: 24px;
    border-radius: 4px;
    overflow: hidden;
  }
  .flash-kanji {
    font-family: var(--serif-jp); font-weight: 700;
    font-size: clamp(56px, 10vw, 88px);
    color: var(--ink);
    text-align: center;
    line-height: 1;
    letter-spacing: 0.02em;
  }
  .flash-reading {
    display: flex; justify-content: center; gap: 14px;
    margin-top: 12px;
    font-family: var(--serif-jp); font-size: 18px;
  }
  .flash-reading > span { white-space: nowrap; }
  .flash-reading .label {
    font-family: var(--serif); font-style: italic; font-size: 11px;
    color: var(--ink-3); margin-right: 4px; vertical-align: 4px;
  }
  .flash-reading .kun { color: var(--ink); }
  .flash-reading .on  { color: var(--ink-2); }
  .flash-en {
    text-align: center;
    margin-top: 22px;
    padding-top: 16px;
    border-top: 1px dashed rgba(141,102,48,0.25);
    font-family: var(--serif); font-style: italic; font-size: 13px;
    color: var(--ink-3);
    letter-spacing: 0.04em;
  }
  .flash-en .eyebrow {
    display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--ink-4); margin-bottom: 4px; font-style: normal;
  }
  .flash-controls {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
  }
  .flash-progress {
    flex: 1; height: 4px; border-radius: 2px;
    background: var(--paper-edge); position: relative;
    margin: 0 12px;
  }
  .flash-progress > div {
    position: absolute; left: 0; top: 0; bottom: 0;
    background: var(--gold); border-radius: 2px;
    transition: width .25s;
  }

  /* ─── dictionary ────────────────────────────────────────────────────── */
  .search-bar {
    display: flex; align-items: center; gap: 10px;
    background: var(--paper-2);
    border: 1px solid rgba(141,102,48,0.25);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 16px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.4) inset;
  }
  .search-bar input {
    flex: 1; border: none; outline: none; background: transparent;
    font-family: var(--serif-jp); font-size: 18px; color: var(--ink);
  }
  .search-bar input::placeholder { color: var(--ink-3); font-family: var(--serif); font-style: italic; }
  .filters {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-bottom: 28px;
  }
  .dict-list { display: flex; flex-direction: column; gap: 0; }
  .dict-row {
    display: grid;
    grid-template-columns: 130px 1fr auto auto;
    column-gap: 32px;
    padding: 16px 8px;
    border-bottom: 1px solid var(--paper-edge);
    align-items: center;
    cursor: pointer;
    transition: background .12s;
  }
  .dict-row:hover { background: rgba(180,138,74,0.08); }
  .dict-row .kanji-cell {
    display: flex; flex-direction: column; align-items: center;
    text-align: center; line-height: 1.1;
    font-family: var(--serif-jp);
  }
  .dict-row .kanji-cell .furigana {
    font-size: 22px;
    color: var(--ink-2);
    margin-bottom: 6px;
    letter-spacing: 0.02em;
  }
  .dict-row .kanji-cell .kanji {
    font-weight: 600; font-size: 32px;
    color: var(--ink); line-height: 1;
  }
  .dict-row .en {
    font-family: var(--serif); font-style: italic;
    font-size: 16px; color: var(--ink);
    padding-left: 96px;
  }
  .dict-row .meta {
    font-family: var(--serif); font-size: 11px; color: var(--ink-3); text-align: right;
  }
  .dict-row .meta .level {
    background: var(--gold-soft); color: var(--gold-dark);
    padding: 2px 6px; border-radius: 4px;
    font-weight: 600; letter-spacing: 0.04em;
  }
  @media (max-width: 640px) {
    .dict-row { grid-template-columns: 90px 1fr auto; column-gap: 16px; }
    .dict-row .kanji-cell .furigana { font-size: 16px; }
    .dict-row .kanji-cell .kanji { font-size: 26px; }
    .dict-row .en { padding-left: 0; font-size: 14px; }
    .dict-row .meta:last-child { display: none; }
  }
  .empty-state {
    padding: 60px 20px; text-align: center;
    color: var(--ink-3); font-style: italic; font-family: var(--serif);
  }

  /* ─── class strip (above book picker) ───────────────────────────────── */
  .class-strip {
    display: flex; gap: 6px; flex-wrap: wrap;
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px dashed rgba(141,102,48,0.20);
  }
  .class-tab {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 6px 14px 6px 10px;
    background: transparent;
    border: 1px solid transparent;

<body>

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main">
    <div class="main-inner" id="main-inner"></div>
  </main>
</div>

<div id="word-pop-backdrop" class="word-pop-backdrop" style="display:none"></div>
<div id="word-pop" class="word-pop is-hidden"></div>

<button id="settings-btn" class="settings-btn" aria-label="Settings" title="Settings">⚙</button>
<div id="settings-panel" class="settings-panel" hidden></div>

<script src="image-slot.js"></script>
<script src="data.js"></script>
<script>
'use strict';

// ── Persistence helpers ─────────────────────────────────────────────────
function lsGet(key, def) {
  try { const r = localStorage.getItem(key); return r == null ? def : JSON.parse(r); }
  catch { return def; }
}
function lsSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}

// ── Sections ────────────────────────────────────────────────────────────
const SECTIONS = [
  { id: 'vocab',      glyph: '語', ja: '語彙',  en: 'Vocabulary' },
  { id: 'flashcards', glyph: '札', ja: '単語札', en: 'Flashcards' },
  { id: 'dictionary', glyph: '辞', ja: '辞書',   en: 'Dictionary' },
];

function hashSection() {
  const h = (location.hash || '').replace('#', '');
  return ['vocab','flashcards','dictionary'].includes(h) ? h : lsGet('jp:section', 'vocab');
}

const APP = {
  section:      hashSection(),
  showEnglish:  lsGet('jp:showEnglish', true),
  density:      lsGet('jp:density', 'comfortable'),
  particlesOn:  lsGet('jp:particles', true),
  vocabClassId: lsGet('jp:vocabClass', 'home'),
  vocabBookId:  lsGet('jp:vocabBook', 'bathroom'),
  vocabPageIdx: 0,
  flashIdx:     0,
  flashShowEn:  true,
  dictQ:        '',
  dictKind:     'all',
  dictLevel:    'all',
  dictTag:      'all',
  popoverItem:  null,
  popoverRect:  null,
  pendingDictQ: null,
  _flashKeyHandler: null,
};

function setSection(s) {
  APP.section = s;
  location.hash = s;
  lsSet('jp:section', s);
  renderMain();
  updateSidebar();
}

// ── Body classes ────────────────────────────────────────────────────────
function applyBodyClasses() {
  document.body.classList.toggle('no-english', !APP.showEnglish);
  document.body.classList.toggle('no-particles', !APP.particlesOn);
  const pad = APP.density === 'compact' ? '32px' : APP.density === 'roomy' ? '72px' : '56px';
  document.documentElement.style.setProperty('--pad-page', pad);
}

// ── Utilities ───────────────────────────────────────────────────────────
function escHTML(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escAttr(s) {
  return String(s).replace(/"/g,'&quot;');
}

// Particle colors are keyed to grammatical role so the same color travels
// with the same function across every sentence. に joins で in the green
// family because both mark place/time — slightly different shades so the
// two stay distinguishable side-by-side.
const PARTICLE_COLORS = {
  'は':'#8a2538', // topic        — wine
  'を':'#5a2e8a', // direct object — purple
  'が':'#c97a2c', // subject       — orange
  'と':'#2a5b94', // with/and      — blue
  'の':'#c43a4a', // possessive    — red
  'で':'#2e7a3f', // place of action / means — forest green
  'に':'#1f7a5e', // destination / time / indirect object — teal green
};
const PARTICLE_CHARS = ['は','を','が','と','の','で','に'];

function _isHiragana(c) { return !!c && /[぀-ゟ]/.test(c); }

function colorParticles(ja) {
  if (!ja) return '';
  let html = '';
  for (let i = 0; i < ja.length; i++) {
    const c = ja[i];
    const next = ja[i + 1] || '';
    if (PARTICLE_COLORS[c] && !_isHiragana(next)) {
      html += `<span class="ja-particle" style="color:${PARTICLE_COLORS[c]};margin:0 0.18em;font-weight:500">${c}</span>`;
    } else {
      html += c;
    }
  }
  return html;
}

function kanjiReading(c) {
  const readings = window.KANJI_READINGS || {};
  if (readings[c]) return readings[c];
  // Fall back to a dictionary kanji entry's kana (convert katakana → hiragana,
  // drop the okurigana marker after `.`).
  const dictEntry = (window.DICTIONARY || []).find(e => e.kind === 'kanji' && e.kanji === c);
  if (dictEntry && dictEntry.kana) {
    return dictEntry.kana.split('.')[0]
      .replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60));
  }
  return '';
}

function splitKanjiBreakdown(word, kana) {
  if (!word) return null;
  const meanings = window.KANJI_MEANINGS || {};
  const chars = [...word];
  const kanji = chars.filter(c => /[㐀-鿿]/.test(c));
  const hiragana = chars.filter(c => /[぀-ゟ]/.test(c));
  if (kanji.length === 0) return null;
  if (kanji.length === 1 && hiragana.length === 0) return null;
  const aligned = alignReadings(word, kana);
  const out = [];
  for (let i = 0; i < word.length; i++) {
    const c = word[i];
    if (/[㐀-鿿]/.test(c)) {
      out.push({
        char: c,
        reading: (aligned && aligned.get(i)) || kanjiReading(c),
        meaning: meanings[c] || '?'
      });
    }
  }
  return out;
}

// Align a word's per-kanji reading against the supplied kana, so context-
// dependent readings come out right. The hiragana runs in the word are
// matched literally in the kana; everything else is attributed to the
// surrounding kanji. Adjacent kanji are split by walking each one's default
// reading from KANJI_READINGS. Returns a Map(index → reading) or null on
// mismatch.
function alignReadings(word, kana) {
  if (!word || !kana) return null;
  const ka = kana.replace(/[\s　]/g, '');
  const toHira = s => s.replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60));

  // Tokenize word into kanji singletons + literal (non-kanji) runs.
  const tokens = [];
  for (let i = 0; i < word.length; i++) {
    const c = word[i];
    if (/[㐀-鿿]/.test(c)) {
      tokens.push({ type: 'k', char: c, idx: i });
    } else {
      const last = tokens[tokens.length - 1];
      if (last && last.type === 'lit') last.text += c;
      else tokens.push({ type: 'lit', text: c });
    }
  }

  // Locate each literal in the kana; the gaps between them are kanji.
  let kPos = 0;
  for (const tok of tokens) {
    if (tok.type !== 'lit') continue;
    const hira = toHira(tok.text);
    const idx = ka.indexOf(hira, kPos);
    if (idx < 0) return null;
    tok.kanaStart = idx;
    tok.kanaEnd = idx + hira.length;
    kPos = tok.kanaEnd;
  }

  // Fill in kanji readings from the gaps.
  const out = new Map();
  let prevEnd = 0;
  for (let t = 0; t < tokens.length; t++) {
    const tok = tokens[t];
    if (tok.type === 'lit') { prevEnd = tok.kanaEnd; continue; }
    const nextLit = tokens.slice(t + 1).find(x => x.type === 'lit');
    const endPos = nextLit ? nextLit.kanaStart : ka.length;
    const cluster = [tok];
    while (t + 1 < tokens.length && tokens[t + 1].type === 'k') {
      cluster.push(tokens[t + 1]); t++;
    }
    const total = ka.slice(prevEnd, endPos);
    if (cluster.length === 1) {
      out.set(cluster[0].idx, total);
    } else {
      // First pass: match each kanji's default reading sequentially. If every
      // default lines up, great. If any default fails, split the cluster's
      // total kana proportionally by the default *lengths* instead — this
      // catches rendaku and other one-mora shifts (e.g. お風呂: defaults よく
      // /ろ don't match, but lengths 2/1 → wrong; the actual ふ/ろ wants 1/1).
      const defs = cluster.map(k => (window.KANJI_READINGS || {})[k.char] || '');
      let pos = 0;
      let ok = true;
      for (let i = 0; i < cluster.length; i++) {
        if (defs[i] && total.slice(pos).startsWith(defs[i])) pos += defs[i].length;
        else { ok = false; break; }
      }
      if (ok && pos === total.length) {
        for (let i = 0, p = 0; i < cluster.length; i++) {
          out.set(cluster[i].idx, defs[i]); p += defs[i].length;
        }
      } else {
        // Proportional fallback: distribute `total` across the cluster using
        // the ratio of each kanji's default-reading length. Kanji with no
        // default reading get an equal share.
        const lens = defs.map(d => d.length || 1);
        const lensSum = lens.reduce((a, b) => a + b, 0);
        let p = 0;
        for (let i = 0; i < cluster.length; i++) {
          const share = i === cluster.length - 1
            ? total.length - p
            : Math.round(total.length * lens[i] / lensSum);
          out.set(cluster[i].idx, total.slice(p, p + share));
          p += share;
        }
      }
    }
    prevEnd = endPos;
  }
  return out;
}

// Wrap each kanji in a word with <ruby>k<rt>reading</rt></ruby>. Non-kanji
// characters pass through unchanged so シャワーを浴びる only annotates 浴.
// When `kana` is provided, the per-kanji reading is aligned against it
// (so 浴 reads あ in 浴びる but よく in 浴室).
function withFurigana(word, kana) {
  if (!word) return '';
  const aligned = alignReadings(word, kana);
  let html = '';
  for (let i = 0; i < word.length; i++) {
    const c = word[i];
    if (/[㐀-鿿]/.test(c)) {
      const r = (aligned && aligned.get(i)) || kanjiReading(c);
      html += r
        ? `<ruby>${escHTML(c)}<rt>${escHTML(r)}</rt></ruby>`
        : escHTML(c);
    } else {
      html += escHTML(c);
    }
  }
  return html;
}

function parseChunk(text) {
  if (!text) return { stem: '', particles: [], punct: '' };
  let rest = text;
  const punctMatch = rest.match(/([。、！？!?,\.…]+)$/);
  const punct = punctMatch ? punctMatch[0] : '';
  if (punct) rest = rest.slice(0, -punct.length);
  const particles = [];
  while (rest.length > 1 && PARTICLE_CHARS.includes(rest[rest.length - 1])) {
    particles.unshift(rest[rest.length - 1]);
    rest = rest.slice(0, -1);
  }
  return { stem: rest, particles, punct };
}

function lookupWord(text) {
  if (!text) return null;
  for (const book of (window.VOCAB_BOOKS || [])) {
    for (const page of (book.pages || [])) {
      for (const item of (page.items || [])) {
        const k = item.kanji || item.ja;
        if (k === text || item.kana === text || item.ja === text)
          return { kanji: k || text, kana: item.kana || '', en: item.en || '' };
      }
    }
  }
  const d = (window.DICTIONARY || []).find(e => e.kanji === text || e.kana === text);
  if (d) return { kanji: d.kanji, kana: d.kana, en: d.en };
  return { kanji: text, kana: '', en: '' };
}

function wordChunkHTML(text) {
  const { stem, particles, punct } = parseChunk(text);
  if (!stem) return escHTML(text);
  const particleSpans = particles.map(p =>
    `<span class="ja-particle" style="color:${PARTICLE_COLORS[p]||'inherit'};font-weight:500;margin:0">${p}</span>`
  ).join('');
  return `<span class="word-chunk" data-stem="${escAttr(stem)}" title="click to look up · double-click for dictionary"><span class="wc-stem">${escHTML(stem)}</span>${particleSpans}</span>${escHTML(punct)}`;
}

// Split a Japanese line into clickable chunks. A chunk boundary is either
// whitespace OR the position right after a punctuation mark — so "前に、手を"
// becomes ["前に、", "手を"] and the に particle separates cleanly from the
// 手 that follows it.
function splitJaChunks(text) {
  const chunks = [];
  let cur = '';
  for (const c of text) {
    if (/[\s　]/.test(c)) {
      if (cur) { chunks.push(cur); cur = ''; }
    } else {
      cur += c;
      if (/[、。！？!?,…]/.test(c)) { chunks.push(cur); cur = ''; }
    }
  }
  if (cur) chunks.push(cur);
  return chunks;
}

function jaSentenceHTML(text) {
  if (!text) return '';
  return splitJaChunks(text).map(wordChunkHTML).join('');
}

// ── Popover ─────────────────────────────────────────────────────────────
function initPopover() {
  const backdrop = document.getElementById('word-pop-backdrop');

  backdrop.addEventListener('click', closePopover);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closePopover(); });

  document.getElementById('main').addEventListener('click', e => {
    const chunk = e.target.closest('.word-chunk');
    if (!chunk) return;
    e.stopPropagation();
    openPopover(lookupWord(chunk.dataset.stem), chunk.getBoundingClientRect());
  });
  document.getElementById('main').addEventListener('dblclick', e => {
    const chunk = e.target.closest('.word-chunk');
    if (!chunk) return;
    e.preventDefault(); e.stopPropagation();
    jumpToDictionary(chunk.dataset.stem);
  });

  document.getElementById('main').addEventListener('click', e => {
    const row = e.target.closest('.vocab-row[data-kanji]');
    if (!row) return;
    openPopover({ kanji: row.dataset.kanji, kana: row.dataset.kana, en: row.dataset.en }, row.getBoundingClientRect());
  });
  document.getElementById('main').addEventListener('dblclick', e => {
    const row = e.target.closest('.vocab-row[data-kanji]');
    if (!row) return;
    e.preventDefault();
    jumpToDictionary(row.dataset.kanji);
  });

  // Usage cards: the whole card is the click target, not its contents.
  document.getElementById('main').addEventListener('click', e => {
    const card = e.target.closest('.usage-card[data-kanji]');
    if (!card) return;
    openPopover({ kanji: card.dataset.kanji, kana: card.dataset.kana, en: card.dataset.en }, card.getBoundingClientRect());
  });
  document.getElementById('main').addEventListener('dblclick', e => {
    const card = e.target.closest('.usage-card[data-kanji]');
    if (!card) return;
    e.preventDefault();
    jumpToDictionary(card.dataset.kanji);
  });
}

function jumpToDictionary(q) {
  APP.pendingDictQ = q;
  setSection('dictionary');
}

function openPopover(item, anchorRect) {
  const pop = document.getElementById('word-pop');
  const backdrop = document.getElementById('word-pop-backdrop');
  const breakdown = splitKanjiBreakdown(item.kanji, item.kana);
  const bdHTML = breakdown ? `
    <div class="word-pop-breakdown">
      ${breakdown.map((b, i) => `
        ${i > 0 ? '<span class="bk-sep">·</span>' : ''}
        <span class="bk-pair">
          <span class="bk-stack">
            <span class="bk-reading">${escHTML(b.reading)}</span>
            <span class="bk-kanji">${escHTML(b.char)}</span>
          </span>
          <span class="bk-eq">=</span>
          <span class="bk-meaning">${escHTML(b.meaning)}</span>
        </span>
      `).join('')}
    </div>` : '';

  // Glyph font scales down with length so a single kanji stays imposing but
  // a six-character phrase still fits the popover without wrapping.
  const glyphLen = [...(item.kanji || '')].length;
  const glyphSize = glyphLen <= 2 ? 52 : glyphLen <= 4 ? 34 : glyphLen <= 6 ? 26 : 22;

  pop.innerHTML = `
    <button class="word-pop-close" id="pop-close" aria-label="close">×</button>
    <div class="word-pop-glyph" style="font-size:${glyphSize}px;line-height:1.35">${withFurigana(item.kanji || '', item.kana || '')}</div>
    <div class="word-pop-kana">${escHTML(item.kana || '')}</div>
    <div class="word-pop-en">${escHTML(item.en || '')}</div>
    ${bdHTML}`;

  document.getElementById('pop-close').addEventListener('click', closePopover);
  pop.querySelector('.word-pop-glyph').addEventListener('dblclick', e => {
    e.preventDefault(); jumpToDictionary(item.kanji || item.kana);
  });

  pop.classList.remove('is-hidden');
  backdrop.style.display = 'block';

  const popW = pop.offsetWidth || 304;
  const popH = pop.offsetHeight || 200;
  const gap = 14, margin = 16;
  const vw = window.innerWidth, vh = window.innerHeight;
  const r = anchorRect;
  let left = r.right + gap;
  let top = r.top - 8;
  if (left + popW > vw - margin) {
    left = r.left - popW - gap;
    if (left < margin) { left = Math.max(margin, Math.min(vw - popW - margin, r.left)); top = r.bottom + gap; }
  }
  if (top + popH > vh - margin) top = vh - popH - margin;
  if (top < margin) top = margin;
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
}

function closePopover() {
  document.getElementById('word-pop').classList.add('is-hidden');
  document.getElementById('word-pop-backdrop').style.display = 'none';
}

// ── Vocab ────────────────────────────────────────────────────────────────
function renderVocab(container) {
  const cls = VOCAB_CLASSES.find(c => c.id === APP.vocabClassId) || VOCAB_CLASSES[0];
  // If the stored book doesn't belong to this class (e.g. user switched
  // classes), drop to the first book in the class.
  if (!cls.books.some(b => b.id === APP.vocabBookId)) {
    APP.vocabBookId = cls.books[0] ? cls.books[0].id : null;
    APP.vocabPageIdx = 0;
  }
  const book = cls.books.find(b => b.id === APP.vocabBookId) || cls.books[0];
  const hasPages = !!(book && book.pages && book.pages.length);
  if (hasPages && APP.vocabPageIdx >= book.pages.length) APP.vocabPageIdx = 0;
  const page = hasPages ? book.pages[APP.vocabPageIdx] : null;

  const pagerHTML = hasPages ? `
    <div class="pager">
      <button class="icon-btn" id="pager-prev" ${APP.vocabPageIdx === 0 ? 'disabled' : ''} title="previous page">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="dots">
        ${book.pages.map((p, i) => `
          <button class="dot ${i === APP.vocabPageIdx ? 'active' : ''}" data-page="${i}" title="${escAttr(p.title)}"></button>
        `).join('')}
      </div>
      <button class="icon-btn" id="pager-next" ${APP.vocabPageIdx === book.pages.length - 1 ? 'disabled' : ''} title="next page">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
      </button>
      <span class="small-label" style="margin-left:12px">page ${APP.vocabPageIdx + 1} / ${book.pages.length}</span>
    </div>` : '';

  container.innerHTML = `
    <div class="page-head">
      <div class="page-eyebrow">vocabulary · 語彙</div>
      <h1 class="page-title-jp">${escHTML(cls.pageTitleJa)}</h1>
      <div class="rule"></div>
    </div>

    <div class="class-strip">
      ${VOCAB_CLASSES.map(c => `
        <button class="class-tab ${c.id === APP.vocabClassId ? 'active' : ''}" data-class="${c.id}">
          <span class="glyph">${c.glyph}</span>
          <span class="label">
            <span class="ja">${escHTML(c.titleJa)}</span>
            <span class="en">${escHTML(c.titleEn)}</span>
          </span>
        </button>
      `).join('')}
    </div>

    <div class="book-strip">
      ${cls.books.map(b => `
        <button class="book-card ${b.id === APP.vocabBookId ? 'active' : ''}" data-book="${b.id}">
          <div class="glyph">${b.glyph}</div>
          <div class="ja">${escHTML(b.titleJa)}</div>
          <div class="en">${escHTML(b.titleEn)}</div>
        </button>
      `).join('')}
    </div>

    <div id="vocab-page-content"></div>
    ${pagerHTML}`;

  if (hasPages) {
    renderVocabPage(book, page);
  } else {
    document.getElementById('vocab-page-content').innerHTML =
      `<div class="empty-state">${escHTML(book ? book.titleEn : 'This category')} — coming soon.</div>`;
  }

  container.querySelectorAll('[data-class]').forEach(btn => {
    btn.addEventListener('click', () => {
      APP.vocabClassId = btn.dataset.class;
      APP.vocabBookId = null;
      APP.vocabPageIdx = 0;
      lsSet('jp:vocabClass', APP.vocabClassId);
      renderVocab(container);
    });
  });
  container.querySelectorAll('[data-book]').forEach(btn => {
    btn.addEventListener('click', () => {
      APP.vocabBookId = btn.dataset.book;
      APP.vocabPageIdx = 0;
      lsSet('jp:vocabBook', APP.vocabBookId);
      renderVocab(container);
    });
  });
  const prev = container.querySelector('#pager-prev');
  const next = container.querySelector('#pager-next');
  if (prev) prev.addEventListener('click', () => {
    APP.vocabPageIdx = Math.max(0, APP.vocabPageIdx - 1);
    renderVocab(container);
  });
  if (next) next.addEventListener('click', () => {
    APP.vocabPageIdx = Math.min(book.pages.length - 1, APP.vocabPageIdx + 1);
    renderVocab(container);
  });
  container.querySelectorAll('.dot[data-page]').forEach(btn => {
    btn.addEventListener('click', () => {
      APP.vocabPageIdx = parseInt(btn.dataset.page, 10);
      renderVocab(container);
    });
  });
}

function renderVocabPage(book, page) {
  const el = document.getElementById('vocab-page-content');
  if (page.type === 'cheatsheet')  el.innerHTML = cheatsheetHTML(book, page);
  else if (page.type === 'usage')  el.innerHTML = usageHTML(page);
  else if (page.type === 'sentences') {
    el.innerHTML = sentencesHTML(page, 'ALL', false);
    attachSentencesEvents(el, page);
  }
}

function cheatsheetHTML(book, page) {
  // Only treat の / と as particles when they're standalone tokens — the
  // `と` inside ことば (kotoba) is part of the word, not a particle.
  const titleHTML = page.title.replace(/(^|[\s　])(の|と)(?=[\s　]|$)/g,
    '$1<span class="particle">$2</span>');
  const items = page.items.map(item => `
    <div class="vocab-row" data-kanji="${escAttr(item.kanji)}" data-kana="${escAttr(item.kana)}" data-en="${escAttr(item.en)}">
      <span class="num">${item.num}.</span>
      <div class="body">
        <span class="kanji">${escHTML(item.kanji)}</span>
        <span class="kana">（${escHTML(item.kana)}）</span>
        <span class="en">${escHTML(item.en)}</span>
      </div>
    </div>`).join('');

  return `
    <div class="book-frame">
      <span class="corner-tl"></span><span class="corner-tr"></span>
      <h2 class="book-title">${titleHTML}</h2>
      <div class="sheet-image">
        <image-slot
          id="vocab-${book.id}-${page.imageSlotId}"
          shape="rounded" radius="4" fit="natural"
          placeholder="Drop an illustration"></image-slot>
      </div>
      <div class="vocab-grid">${items}</div>
    </div>`;
}

function usageHTML(page) {
  const cards = page.items.map(u => `
    <div class="usage-card" data-kanji="${escAttr(u.ja)}" data-kana="${escAttr(u.kana||'')}" data-en="${escAttr(u.en||'')}">
      <div class="ja">${colorParticles(u.ja)}</div>
      <div class="kana">${escHTML(u.kana)}</div>
      <div class="en">${escHTML(u.en)}</div>
    </div>`).join('');
  return `
    <div class="panel">
      <div style="margin-bottom:18px">
        <h2 style="font-family:var(--serif-jp);font-size:26px;color:var(--ink);margin:0;font-weight:600">${escHTML(page.title)}</h2>
        <div style="font-family:var(--serif);font-style:italic;font-size:14px;color:var(--ink-3);margin-top:4px">${escHTML(page.subtitle)}</div>
      </div>
      <div class="usage-grid">${cards}</div>
    </div>`;
}

function sentencesHTML(page, level, showAll) {
  const LEVELS = ['ALL', ...(window.JLPT_LEVELS || ['N5','N4','N3','N2','N1'])];
  const filtered = page.items.filter(s => level === 'ALL' || s.level === level);
  const INITIAL = 5;
  const visible = showAll ? filtered : filtered.slice(0, INITIAL);
  const hidden = filtered.length - visible.length;

  const levelPills = LEVELS.map(L => `
    <button class="pill ${level === L ? 'active' : ''}" data-level="${L}">${L === 'ALL' ? 'all' : L}</button>`
  ).join('');

  const rows = visible.map(s => `
    <div class="sentence">
      <span class="level-tag">${s.level}</span>
      <div class="body">
        <div class="ja">${jaSentenceHTML(s.ja)}</div>
        <div class="en">${escHTML(s.en)}</div>
      </div>
      <button class="icon-btn audio" title="play audio">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      </button>
    </div>`).join('');

  const emptyState = visible.length === 0
    ? `<div class="empty-state">no sentences at ${escHTML(level)} yet — try another level</div>` : '';
  const showMoreBtn = hidden > 0 && !showAll
    ? `<div style="text-align:center;margin-top:20px"><button class="btn ghost" data-show-more>see ${hidden} more ↓</button></div>` : '';
  const collapseBtn = showAll && filtered.length > INITIAL
    ? `<div style="text-align:center;margin-top:20px"><button class="btn ghost" data-collapse>collapse ↑</button></div>` : '';

  return `
    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;margin-bottom:18px">
        <div>
          <h2 style="font-family:var(--serif-jp);font-size:26px;color:var(--ink);margin:0;font-weight:600">${escHTML(page.title)}</h2>
          <div style="font-family:var(--serif);font-style:italic;font-size:14px;color:var(--ink-3);margin-top:4px">${escHTML(page.subtitle)}</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <span class="small-label">level:</span>
          ${levelPills}
        </div>
      </div>
      <div class="sentences">${emptyState}${rows}</div>
      ${showMoreBtn}${collapseBtn}
    </div>`;
}

function attachSentencesEvents(container, page) {
  let level = 'ALL', showAll = false;
  function rerender() {
    container.innerHTML = sentencesHTML(page, level, showAll);
    attachSentencesEvents(container, page);
  }
  container.querySelectorAll('[data-level]').forEach(btn => {
    btn.addEventListener('click', () => { level = btn.dataset.level; showAll = false; rerender(); });
  });
  const more = container.querySelector('[data-show-more]');
  if (more) more.addEventListener('click', () => { showAll = true; rerender(); });
  const collapse = container.querySelector('[data-collapse]');
  if (collapse) collapse.addEventListener('click', () => { showAll = false; rerender(); });
}

              placeholder="Drop image for &quot;${escAttr(card.en)}&quot;"></image-slot>
          </div>
          <div class="flash-kanji">${escHTML(card.kanji)}</div>
          <div class="flash-reading">
            <span class="kun"><span class="label">kun</span>${escHTML(card.kun)}</span>
            <span style="color:var(--ink-4)">·</span>
            <span class="on"><span class="label">on</span>${escHTML(card.on)}</span>
          </div>
          <div class="flash-en" style="opacity:${APP.flashShowEn ? 1 : 0.3};font-style:${APP.flashShowEn ? 'italic' : 'normal'}">
            <span class="eyebrow">meaning</span>

          </div>

          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
        </button>
      </div>

      <div class="flash-controls">
        <div class="flash-progress">
          <div style="width:${((APP.flashIdx + 1) / deck.length) * 100}%"></div>
        </div>
      </div>

      <div style="text-align:center;font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink-3)">

      </div>

    btn.addEventListener('click', () => {
      APP.flashShowEn = btn.dataset.flashEn === 'true';
      renderFlashcards(container);
    });
  });
  container.querySelector('#flash-prev').addEventListener('click', () => {
    APP.flashIdx = (APP.flashIdx - 1 + deck.length) % deck.length;
    renderFlashcards(container);
  });
  container.querySelector('#flash-next').addEventListener('click', () => {
    APP.flashIdx = (APP.flashIdx + 1) % deck.length;
    renderFlashcards(container);
  });

  APP._flashKeyHandler = e => {
    if (e.key === 'ArrowLeft')  { APP.flashIdx = (APP.flashIdx - 1 + deck.length) % deck.length; renderFlashcards(container); }
    if (e.key === 'ArrowRight') { APP.flashIdx = (APP.flashIdx + 1) % deck.length; renderFlashcards(container); }
    if (e.key === ' ')          { e.preventDefault(); APP.flashShowEn = !APP.flashShowEn; renderFlashcards(container); }
  };
  window.addEventListener('keydown', APP._flashKeyHandler);
}

// ── Dictionary ───────────────────────────────────────────────────────────
function renderDictionary(container) {
  if (APP.pendingDictQ) {
    APP.dictQ = APP.pendingDictQ;
    APP.dictKind = 'all'; APP.dictLevel = 'all'; APP.dictTag = 'all';
    APP.pendingDictQ = null;
  }

  const allTags = [...new Set((window.DICTIONARY || []).flatMap(e => e.tags || []))].sort();
  const norm = s => (s || '').toLowerCase().normalize('NFC');
  const query = norm(APP.dictQ);
  const filtered = (window.DICTIONARY || []).filter(e => {
    if (APP.dictKind  !== 'all' && e.kind  !== APP.dictKind)  return false;
    if (APP.dictLevel !== 'all' && e.level !== APP.dictLevel) return false;
    if (APP.dictTag   !== 'all' && !(e.tags||[]).includes(APP.dictTag)) return false;
    if (!query) return true;
    return (e.kanji||'').includes(APP.dictQ) || norm(e.kana).includes(query) || norm(e.en).includes(query);
  });
  const kanjiHits = filtered.filter(e => e.kind === 'kanji');
  const wordHits  = filtered.filter(e => e.kind === 'word');

  const pill = (val, cur, key) =>
    `<button class="pill ${val === APP[key] ? 'active' : ''}" data-filter-key="${key}" data-filter-val="${escAttr(val)}">${escHTML(val === 'all' ? (key === 'dictTag' ? 'any' : 'all') : val)}</button>`;

  const clearBtnHTML = APP.dictQ
    ? `<button class="icon-btn" id="dict-clear" title="clear">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>` : '';

  const groupHTML = (label, entries) => entries.length === 0 ? '' : `
    <section style="margin-bottom:36px">
      <div style="font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink-3);
                  letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;padding-bottom:6px;
                  border-bottom:1px dashed rgba(141,102,48,.25)">${escHTML(label)} · ${entries.length}</div>
      <div class="dict-list">
        ${entries.map(e => `
          <div class="dict-row">
            <div class="kanji-cell">
              <div class="furigana">${escHTML(e.kana)}</div>
              <div class="kanji">${escHTML(e.kanji)}</div>
            </div>
            <div class="en">${escHTML(e.en)}</div>
            <div class="meta"><span class="level">${escHTML(e.level)}</span></div>
            <div class="meta" style="min-width:80px">${escHTML((e.tags||[]).slice(0,2).join(' · '))}</div>
          </div>`).join('')}
      </div>
    </section>`;

  container.innerHTML = `
    <div class="page-head">
      <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap">
        <div>
          <div class="page-eyebrow">dictionary · 辞書</div>
          <h1 class="page-title-jp">さがす</h1>
          <div class="page-title-en">Browse and search — kanji, words, and what they mean</div>
        </div>
        <div class="small-label">${filtered.length} entries</div>
      </div>
      <div class="rule"></div>
    </div>

    <div class="search-bar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ink-3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="dict-input" value="${escAttr(APP.dictQ)}" placeholder="kanji, kana, or english… (e.g. 風, kaze, mirror)" />
      ${clearBtnHTML}
    </div>

    <div class="filters">
      <span class="small-label">kind:</span>
      ${['all','kanji','word'].map(v => pill(v, APP.dictKind, 'dictKind')).join('')}
      <span class="floating-controls" style="margin:0"><span class="sep"></span></span>
      <span class="small-label">level:</span>
      ${['all',...(window.JLPT_LEVELS||['N5','N4','N3','N2','N1'])].map(v => pill(v, APP.dictLevel, 'dictLevel')).join('')}
      <span class="floating-controls" style="margin:0"><span class="sep"></span></span>
      <span class="small-label">tag:</span>
      ${['all',...allTags].map(v => pill(v, APP.dictTag, 'dictTag')).join('')}
    </div>

    ${filtered.length === 0 ? '<div class="empty-state">nothing matches yet — try clearing some filters</div>' : ''}
    ${groupHTML('Kanji', kanjiHits)}
    ${groupHTML('Words', wordHits)}`;

  const input = container.querySelector('#dict-input');
  let debTimer;
  input.addEventListener('input', () => {
    clearTimeout(debTimer);
    debTimer = setTimeout(() => { APP.dictQ = input.value; renderDictionary(container); }, 120);
  });
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);

  const clearBtn2 = container.querySelector('#dict-clear');
  if (clearBtn2) clearBtn2.addEventListener('click', () => { APP.dictQ = ''; renderDictionary(container); });

  container.querySelectorAll('[data-filter-key]').forEach(btn => {
    btn.addEventListener('click', () => {
      APP[btn.dataset.filterKey] = btn.dataset.filterVal;
      renderDictionary(container);
    });
  });
}

// ── Hash change ──────────────────────────────────────────────────────────
window.addEventListener('hashchange', () => {
  const s = hashSection();
  if (s !== APP.section) { APP.section = s; renderMain(); updateSidebar(); }
});

// ── Init ─────────────────────────────────────────────────────────────────
function init() {
  applyBodyClasses();
  renderSidebar();
  renderMain();
  initSettings();
  initPopover();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
