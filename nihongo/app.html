<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>nihongo — 日本語</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Caveat:wght@400;600&family=Klee+One:wght@400;600&family=Yuji+Syuku&family=Yuji+Mai&family=Kaisei+Decol:wght@400;700&family=Hina+Mincho&family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=1">
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <aside class="vocab-sidebar" id="vocab-sidebar"></aside>
  <aside class="vocab-books-sidebar" id="vocab-books-sidebar"></aside>
  <aside class="flash-sidebar" id="flash-sidebar"></aside>
  <aside class="writing-sidebar" id="writing-sidebar"></aside>
  <aside class="particles-sidebar" id="particles-sidebar"></aside>
  <!-- Speaking sub-system: second-rail sidebar showing categories (Food first;
       later Greetings, Travel, Work). Phrases live in the bottom Up Next
       filmstrip inside the main column, not in a third sidebar — per the
       spread-with-bottom-rail layout decision in 2026-05-28-speaking.PRODUCT.md. -->
  <aside class="speaking-sidebar" id="speaking-sidebar"></aside>
  <!-- Library hub: nested sidebar listing Search · Dictionary · Books. -->
  <aside class="library-sidebar" id="library-sidebar"></aside>
  <main class="main" id="main">
    <!-- Stepper slot — lives OUTSIDE main-inner so vocab pages can place
         the step nav flush to the top while keeping the card content
         inset below. Empty for every other section. -->
    <div class="main-stepper" id="main-stepper"></div>
    <div class="main-inner" id="main-inner"></div>
  </main>
</div>

<!-- Mobile drawer for vocab cheatsheet items. Hidden on desktop; opens via FAB. -->
<div class="vocab-drawer-backdrop" id="vocab-drawer-backdrop"></div>
<div class="vocab-drawer" id="vocab-drawer" aria-hidden="true">
  <div class="vocab-drawer-handle" id="vocab-drawer-handle"></div>
  <div class="vocab-drawer-head">
    <span class="title" id="vocab-drawer-title">ことば</span>
    <button class="vocab-drawer-close" id="vocab-drawer-close" aria-label="Close">close</button>
  </div>
  <div class="vocab-drawer-body" id="vocab-drawer-body"></div>
</div>
<button class="vocab-fab" id="vocab-fab" aria-label="Open word list">
  <span>札</span>
  <span class="vocab-fab-count" id="vocab-fab-count" hidden></span>
</button>

<!-- Card modal — opens when a writing/colors tile is clicked, shows the
     deck flashcard for that color. Centered modal on desktop, fullscreen
     dialog on mobile. Click backdrop / X / Escape to close. -->
<div class="card-modal-backdrop" id="card-modal-backdrop"></div>
<div class="card-modal" id="card-modal" role="dialog" aria-modal="true" aria-hidden="true">
  <button class="card-modal-close" id="card-modal-close" aria-label="Close">×</button>
  <div class="card-modal-body" id="card-modal-body"></div>
</div>

<div id="word-pop-backdrop" class="word-pop-backdrop" style="display:none"></div>
<div id="word-pop" class="word-pop is-hidden"></div>

<!-- Settings FAB removed — the floating ⚙ in the bottom-right was
     more visual noise than function. If we want global toggles back,
     they should land in the top-right of the sidebar instead of as
     a floating overlay. initSettings() now no-ops safely. -->


<script src="image-slot.js?v=vocabfood1"></script>
<script src="data.js?v=readonly132"></script>
<!-- Stroke-order format index — kanji → 'gif' | 'svg'. Regenerated by
     scripts/download-stroke-gifs.mjs on every run so it stays in sync
     with what's on disk. The flashcard back-face renderer reads
     window.STROKE_FORMATS to construct the right URL directly. -->
<script src="images/stroke/manifest.js?v=1"></script>
<script src="heisig-data.js?v=1"></script>
<script src="particle-quiz-data.js?v=readonly1"></script>
<script src="particle-lessons-data.js?v=readonly3"></script>
<script src="particle-articles-data.js?v=readonly1"></script>
<script src="app.js?v=1"></script>
</body>
</html>
