<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>nihongo — 日本語</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Caveat:wght@400;600&family=Klee+One:wght@400;600&family=Yuji+Syuku&family=Kaisei+Decol:wght@400;700&family=Hina+Mincho&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:        #f6ecd5;
    --paper-2:      #fbf5e6;
    --paper-edge:   #ead9b2;
    --paper-shadow: rgba(100,72,30,0.10);

    --ink:    #3a2818;
    --ink-2:  #6b5740;
    --ink-3:  #9a8869;
    --ink-4:  #c2b294;

    --gold:       #b48a4a;
    --gold-dark:  #8d6630;
    --gold-soft:  #d9c191;
    --sage:       #7a8f6e;
    --sage-soft:  #b9c4a6;
    --rose:       #c08a8a;

    --accent:      var(--gold);
    --accent-soft: var(--gold-soft);

    --serif-jp:   'Shippori Mincho', 'Noto Serif JP', 'Hiragino Mincho Pro', serif;
    --sans-jp:    'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif;
    --serif:      'EB Garamond', Georgia, serif;
    --hand:       'Caveat', cursive;

    --pad-page: 56px;
    --content-max: 980px;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--serif);
    font-size: 16px;
    line-height: 1.5;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(180,138,74,0.06), transparent 60%),
      radial-gradient(circle at 80% 80%, rgba(122,143,110,0.05), transparent 60%);
    background-attachment: fixed;
  }
  body {
    background-image:
      radial-gradient(circle at 20% 20%, rgba(180,138,74,0.06), transparent 60%),
      radial-gradient(circle at 80% 80%, rgba(122,143,110,0.05), transparent 60%);
  }
  img { display: block; max-width: 100%; }

  /* ─── layout shell ──────────────────────────────────────────────────── */
  .app {
    display: grid;
    grid-template-columns: 232px 1fr;
    min-height: 100vh;
    position: relative; z-index: 1;
  }
  .main {
    padding: var(--pad-page);
    min-width: 0;
    overflow-x: hidden;
  }
  .main-inner {
    max-width: var(--content-max);
    margin: 0 auto;
  }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { position: sticky; top: 0; width: 100%; min-height: 0; padding: 12px; z-index: 20; }
    .sidebar-inner { flex-direction: row !important; align-items: center; gap: 8px !important; }
    .brand { display: none; }
    .nav-list { display: flex !important; flex-direction: row !important; gap: 6px !important; flex: 1; overflow-x: auto; }
    .nav-list .bookmark { min-width: 96px; flex: 0 0 auto; }
    .sidebar-foot { display: none; }
    :root { --pad-page: 24px; }
  }

  /* ─── sidebar ───────────────────────────────────────────────────────── */
  .sidebar {
    background: linear-gradient(180deg, var(--paper-edge) 0%, color-mix(in srgb, var(--paper-edge) 80%, var(--paper) 20%) 100%);
    border-right: 1px solid rgba(141,102,48,0.22);
    box-shadow: inset -10px 0 24px -16px rgba(100,72,30,0.18);
    padding: 24px 14px 24px 18px;
    position: sticky; top: 0; height: 100vh;
    overflow-y: auto;
  }
  .sidebar-inner { display: flex; flex-direction: column; height: 100%; gap: 24px; }
  .brand {
    display: flex; align-items: baseline; gap: 10px;
    padding: 0 6px 14px;
    border-bottom: 1px dashed rgba(141,102,48,0.3);
  }
  .brand-mark {
    font-family: var(--serif-jp); font-weight: 800; font-size: 38px;
    color: var(--gold-dark); letter-spacing: -0.02em; line-height: 1;
  }
  .brand-name {
    font-family: var(--serif); font-style: italic; font-size: 18px;
    color: var(--ink-2);
  }
  .brand-sub {
    font-family: var(--hand); font-size: 15px; color: var(--ink-3);
    margin-top: 2px;
  }

  .nav-list { display: flex; flex-direction: column; gap: 4px; list-style: none; padding: 0; margin: 0; }
  .nav-section-label {
    font-family: var(--serif); font-style: italic; font-size: 12px;
    color: var(--ink-3); letter-spacing: 0.06em; text-transform: lowercase;
    padding: 6px 8px 4px;
  }
  .bookmark {
    position: relative; display: flex; align-items: center; gap: 12px;
    padding: 10px 12px 10px 14px;
    border: none; background: transparent; cursor: pointer;
    color: var(--ink-2); width: 100%; text-align: left;
    font-family: var(--serif); font-size: 15px; line-height: 1.1;
    border-radius: 0 8px 8px 0;
    transition: background .15s, color .15s, transform .15s;
  }
  .bookmark .glyph {
    font-family: var(--serif-jp); font-weight: 600; font-size: 18px;
    width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
    color: var(--gold-dark);
    background: var(--paper-2);
    border-radius: 4px;
    border: 1px solid rgba(141,102,48,0.22);
    flex: 0 0 auto;
  }
  .bookmark .label {
    display: flex; flex-direction: column; gap: 2px;
    flex: 1; min-width: 0;
  }
  .bookmark .label .ja {
    font-family: var(--serif-jp); font-size: 14px; color: var(--ink-2); line-height: 1.1;
  }
  .bookmark .label .en {
    font-family: var(--serif); font-size: 13px; color: var(--ink-3);
    font-style: italic;
  }
  .bookmark:hover { background: rgba(180,138,74,0.10); color: var(--ink); }
  .bookmark.active {
    background: var(--paper-2);
    color: var(--ink);
    box-shadow:
      inset 4px 0 0 var(--gold),
      0 1px 0 rgba(141,102,48,0.18),
      0 -1px 0 rgba(141,102,48,0.18);
  }
  .bookmark.active .glyph { background: var(--gold); color: white; border-color: var(--gold-dark); }
  .bookmark.active .label .en { color: var(--gold-dark); font-style: normal; }

  .sidebar-foot {
    margin-top: auto;
    padding: 12px 10px;
    border-top: 1px dashed rgba(141,102,48,0.3);
    font-family: var(--serif); font-style: italic; font-size: 12px; color: var(--ink-3);
  }
  .streak {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 6px;
  }
  .streak-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--gold);
    box-shadow: 0 0 0 3px rgba(180,138,74,0.20);
  }

  /* ─── shared page chrome ────────────────────────────────────────────── */
  .page-head { margin-bottom: 28px; }
  .page-eyebrow {
    font-family: var(--serif); font-style: italic; font-size: 13px;
    color: var(--ink-3); letter-spacing: 0.04em;
  }
  .page-title-jp {
    font-family: var(--serif-jp); font-weight: 600;
    font-size: clamp(28px, 4vw, 40px);
    color: var(--ink);
    letter-spacing: 0.02em;
    margin: 4px 0 6px;
    line-height: 1.1;
    word-break: keep-all;
    overflow-wrap: break-word;
    line-break: strict;
  }
  .page-title-en {
    font-family: var(--serif); font-style: italic; font-size: 16px;
    color: var(--ink-2);
  }
  .rule {
    height: 0; margin: 16px 0 24px;
    border-top: 1px solid var(--paper-edge);
    position: relative;
  }
  .rule::after {
    content: ""; position: absolute; left: 0; top: -1px; width: 36px;
    border-top: 2px solid var(--gold);
  }

  /* ─── small ui ──────────────────────────────────────────────────────── */
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px;
    background: var(--paper-2);
    border: 1px solid rgba(141,102,48,0.25);
    font-family: var(--serif); font-size: 12px; color: var(--ink-2);
    cursor: pointer;
    transition: all .15s;
  }
  .pill:hover { background: var(--gold-soft); color: var(--ink); }
  .pill.active {
    background: var(--gold); color: white; border-color: var(--gold-dark);
  }
  .pill .ja { font-family: var(--serif-jp); }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 16px; border-radius: 8px;
    background: var(--paper-2); color: var(--ink);
    border: 1px solid rgba(141,102,48,0.25);
    font-family: var(--serif); font-size: 14px;
    cursor: pointer; transition: all .15s;
  }
  .btn:hover { background: var(--gold-soft); border-color: var(--gold); }
  .btn.primary { background: var(--gold); color: white; border-color: var(--gold-dark); }
  .btn.primary:hover { background: var(--gold-dark); }
  .btn.ghost { background: transparent; border-style: dashed; color: var(--ink-2); }

  .icon-btn {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--paper-2); border: 1px solid rgba(141,102,48,0.25);
    color: var(--ink-2); cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  .icon-btn:hover { background: var(--gold-soft); color: var(--ink); }
  .icon-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  /* ─── card / panel ──────────────────────────────────────────────────── */
  .panel {
    background: var(--paper-2);
    border: 1px solid rgba(141,102,48,0.22);
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.4) inset, 0 4px 14px var(--paper-shadow);
  }

  /* ─── book / cheatsheet frame ───────────────────────────────────────── */
  .book-frame {
    background: var(--paper-2);
    border: 2px solid var(--gold-soft);
    box-shadow:
      0 0 0 6px var(--paper-2),
      0 0 0 7px var(--gold-soft),
      0 8px 24px rgba(100,72,30,0.18);
    border-radius: 4px;
    padding: 36px clamp(20px, 4vw, 56px) 40px;
    position: relative;
  }
  .book-frame::before, .book-frame::after,
  .book-frame > .corner-tl, .book-frame > .corner-tr {
    content: ""; position: absolute; width: 14px; height: 14px;
    border: 2px solid var(--gold);
    background: var(--paper-2);
    border-radius: 50%;
  }
  .book-frame::before { top: -8px; left: -8px; }
  .book-frame::after  { bottom: -8px; right: -8px; }
  .book-frame > .corner-tl { top: -8px; right: -8px; }
  .book-frame > .corner-tr { bottom: -8px; left: -8px; }

  .book-title {
    text-align: center;
    font-family: var(--serif-jp); font-weight: 700;
    font-size: clamp(22px, 3vw, 32px);
    color: var(--ink); letter-spacing: 0.06em;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--gold-soft);
    margin-bottom: 24px;
    position: relative;
    word-break: keep-all;
    overflow-wrap: break-word;
    line-break: strict;
  }
  .book-title .particle { color: var(--ink-3); font-weight: 400; font-size: 0.8em; margin: 0 6px; }

  .sheet-image {
    width: 100%;
    margin: 0 auto 24px;
    border-radius: 4px;
    border: 1px solid var(--paper-edge);
    background: var(--paper-2);
    position: relative;
    overflow: hidden;
  }
  image-slot {
    border-radius: 4px;
  }

  .vocab-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px 32px;
  }
  @media (max-width: 640px) { .vocab-grid { grid-template-columns: 1fr; } }
  .vocab-row {
    display: grid;
    grid-template-columns: 28px 1fr;
    align-items: baseline;
    gap: 4px 10px;
    padding: 8px 4px;
    border-bottom: 1px dashed rgba(141,102,48,0.18);
    cursor: pointer;
    border-radius: 4px;
    transition: background .12s;
  }
  .vocab-row .body {
    display: flex; flex-wrap: wrap; align-items: baseline;
    gap: 2px 8px;
    min-width: 0;
  }
  .vocab-row:hover { background: rgba(180,138,74,0.10); }
  .vocab-row .num {
    font-family: var(--serif); font-size: 14px; color: var(--ink-3);
    font-weight: 600;
  }
  .vocab-row .kanji {
    font-family: var(--serif-jp); font-size: 18px; color: var(--ink);
    font-weight: 500;
  }
  .vocab-row .kana {
    font-family: var(--serif-jp); font-size: 13px; color: var(--ink-2);
  }
  .vocab-row .en {
    font-family: var(--serif); font-style: italic; font-size: 12px;
    color: var(--ink-3);
    width: 100%;
    margin-top: -2px;
  }
  body.no-english .vocab-row .en { visibility: hidden; }
  body.no-english .flash-en { visibility: hidden; }
  body.no-english .sentence .en { visibility: hidden; }
  body.no-english .reveal-en::after { content: "(tap to reveal)"; visibility: visible !important; opacity: .5; font-family: var(--serif); font-size: 11px; }

  /* ─── pager / book navigation ───────────────────────────────────────── */
  .pager {
    margin-top: 32px;
    display: flex; align-items: center; justify-content: center; gap: 16px;
  }
  .pager .dots { display: flex; gap: 8px; }
  .pager .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--paper-edge); border: 1px solid var(--gold-soft);
    cursor: pointer; transition: all .15s;
  }
  .pager .dot.active { background: var(--gold); border-color: var(--gold-dark); transform: scale(1.3); }
  .pager .dot:hover { background: var(--gold-soft); }

  /* ─── usage list ────────────────────────────────────────────────────── */
  .usage-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
  }
  .usage-card {
    background: var(--paper-2);
    border: 1px solid rgba(141,102,48,0.22);
    border-radius: 8px;
    padding: 14px 16px;
    transition: all .15s;
    cursor: pointer;
  }
  .usage-card:hover { border-color: var(--gold); background: var(--paper); transform: translateY(-1px); }
  .usage-card .ja {
    font-family: var(--serif-jp); font-size: 19px; color: var(--ink);
    font-weight: 500;
  }
  .usage-card .kana {
    font-family: var(--serif-jp); font-size: 12px; color: var(--ink-3);
    margin-top: 2px;
  }
  .usage-card .en {
    font-family: var(--serif); font-style: italic; font-size: 13px;
    color: var(--ink-2); margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed rgba(141,102,48,0.18);
  }

  /* ─── sentences ─────────────────────────────────────────────────────── */
  .sentence {
    padding: 18px 0;
    border-bottom: 1px solid var(--paper-edge);
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 16px;
    align-items: center;
  }
  .sentence:last-child { border-bottom: none; }
  .sentence .level-tag {
    font-family: var(--serif); font-size: 11px; color: var(--gold-dark);
    background: var(--gold-soft);
    padding: 2px 8px; border-radius: 4px;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  .sentence .body { min-width: 0; }
  .sentence .ja {
    font-family: var(--serif-jp); font-size: 20px; color: var(--ink);
    line-height: 1.6;
    font-weight: 400;
  }
  .sentence .en {
    font-family: var(--serif); font-style: italic; font-size: 14px;
    color: var(--ink-3);
    margin-top: 6px;
    line-height: 1.4;
  }
  .sentence .audio { color: var(--ink-3); }

  /* ─── flashcards ────────────────────────────────────────────────────── */
  .flash-deck {
    display: grid; grid-template-columns: 1fr; gap: 24px;
    max-width: 580px; margin: 0 auto;
  }
  .flash-stage {
    display: flex; align-items: center; gap: 14px;
    perspective: 1200px;
    position: relative;
  }
  .flash-stage > .flash-card { flex: 1; min-width: 0; }
  .flash-nav {
    flex: 0 0 auto;
    width: 52px; height: 52px;
    background: transparent;
    border-color: transparent;
    color: var(--ink-3);
  }
  .flash-nav svg { width: 22px; height: 22px; }
  .flash-nav:hover {
    background: var(--paper-2);
    color: var(--ink);
    border-color: rgba(141,102,48,0.25);
  }
  @media (max-width: 520px) {
    .flash-stage { gap: 6px; }
    .flash-nav { width: 40px; height: 40px; }
    .flash-nav svg { width: 18px; height: 18px; }
  }
  .flash-card {
    background: var(--paper-2);
    border: 1px solid var(--paper-edge);
    box-shadow:
      0 0 0 4px var(--paper-2),
      0 0 0 5px var(--gold-soft),
      0 12px 32px rgba(100,72,30,0.18);
    border-radius: 6px;
    padding: 32px;
    display: flex; flex-direction: column;
    transition: transform .35s cubic-bezier(.4,.0,.2,1);
  }
  .flash-image {
    width: 100%;
    margin-bottom: 24px;
    border-radius: 4px;
    overflow: hidden;
  }
  /* When the inner image-slot is readonly and not yet filled (no shipped
     file), drop the container so the card doesn't carry an empty 24px
     placeholder gap above the kanji. */
  .flash-image:has(image-slot[readonly]:not([data-filled])) {
    display: none;
  }
  .flash-kanji {
    font-family: var(--serif-jp); font-weight: 700;
    font-size: clamp(56px, 10vw, 88px);
    color: var(--ink);
    text-align: center;
    line-height: 1;
    letter-spacing: 0.02em;
  }
  .flash-reading {
    display: flex; justify-content: center; gap: 14px;
    margin-top: 12px;
    font-family: var(--serif-jp); font-size: 18px;
  }
  .flash-reading > span { white-space: nowrap; }
  .flash-reading .label {
    font-family: var(--serif); font-style: italic; font-size: 11px;
    color: var(--ink-3); margin-right: 4px; vertical-align: 4px;
  }
  .flash-reading .kun { color: var(--ink); }
  .flash-reading .on  { color: var(--ink-2); }
  .flash-en {
    text-align: center;
    margin-top: 22px;
    padding-top: 16px;
    border-top: 1px dashed rgba(141,102,48,0.25);
    font-family: var(--serif); font-style: italic; font-size: 13px;
    color: var(--ink-3);
    letter-spacing: 0.04em;
  }
  .flash-en .eyebrow {
    display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--ink-4); margin-bottom: 4px; font-style: normal;
  }
  /* The bottom area of a flashcard. When the current card has no
     homophone peers, it's a single-column block holding just .flash-en
     (centered). When peers exist, it becomes a two-column grid with the
     meaning on the left and a small "also reads X" chip cluster on the
     right. The dashed divider moves from .flash-en up to .flash-bottom
     so both columns sit under one rule. */
  .flash-bottom {
    margin-top: 22px;
    padding-top: 16px;
    border-top: 1px dashed rgba(141,102,48,0.25);
    display: grid;
    grid-template-columns: 1fr;
  }
  .flash-bottom.has-right {
    grid-template-columns: 1fr auto;
    gap: 18px;
    align-items: start;
  }
  .flash-bottom .flash-en {
    margin-top: 0;
    padding-top: 0;
    border-top: none;
  }
  .flash-bottom.has-right .flash-en {
    text-align: left;
  }
  .flash-right {
    display: flex; flex-direction: column;
    gap: 14px;
    min-width: 130px;
  }
  .flash-usage {
    display: flex; flex-direction: column; gap: 2px;
  }
  .flash-usage .eyebrow {
    font-family: var(--serif);
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--ink-4); font-style: normal;
    margin-bottom: 2px;
  }
  .flash-usage .usage-ja {
    font-family: var(--serif-jp);
    font-size: 18px; color: var(--ink);
    letter-spacing: 0.02em; line-height: 1.15;
  }
  .flash-usage .usage-kana {
    font-family: var(--serif-jp);
    font-size: 12px; color: var(--ink-3);
    letter-spacing: 0.04em;
  }
  .flash-related {
    display: flex; flex-direction: column;
    gap: 6px;
  }
  .flash-related .eyebrow {
    font-family: var(--serif);
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--ink-4); font-style: normal;
  }
  .flash-related .chips {
    display: flex; flex-wrap: wrap; gap: 6px;
  }
  .related-chip {
    display: inline-flex; align-items: baseline; gap: 6px;
    padding: 5px 10px;
    border-radius: 6px;
    background: var(--paper);
    border: 1px solid var(--paper-edge);
    cursor: pointer;
    font-family: var(--serif);
    transition: background .12s, border-color .12s, transform .12s;
  }
  .related-chip:hover {
    background: var(--gold-soft);
    border-color: var(--gold);
    transform: translateY(-1px);
  }
  .related-chip .rk {
    font-family: var(--serif-jp);
    font-size: 20px; line-height: 1;
    color: var(--ink);
  }
  .related-chip .re {
    font-style: italic; font-size: 11px;
    color: var(--ink-3);
  }
  @media (max-width: 480px) {
    .flash-bottom.has-right { grid-template-columns: 1fr; }
    .flash-bottom.has-right .flash-en { text-align: center; }
    .flash-right { align-items: center; }
    .flash-usage { align-items: center; text-align: center; }
    .flash-related { align-items: center; }
    .flash-related .chips { justify-content: center; }
  }
  .flash-controls {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
  }
  .flash-progress {
    flex: 1; height: 4px; border-radius: 2px;
    background: var(--paper-edge); position: relative;
    margin: 0 12px;
  }
  .flash-progress > div {
    position: absolute; left: 0; top: 0; bottom: 0;
    background: var(--gold); border-radius: 2px;
    transition: width .25s;
  }

  /* ─── dictionary ────────────────────────────────────────────────────── */
  .search-bar {
    display: flex; align-items: center; gap: 10px;
    background: var(--paper-2);
    border: 1px solid rgba(141,102,48,0.25);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 16px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.4) inset;
  }
  .search-bar input {
    flex: 1; border: none; outline: none; background: transparent;
    font-family: var(--serif-jp); font-size: 18px; color: var(--ink);
  }
  .search-bar input::placeholder { color: var(--ink-3); font-family: var(--serif); font-style: italic; }
  .filters {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-bottom: 28px;
  }
  .dict-list { display: flex; flex-direction: column; gap: 0; }
  .dict-row {
    display: grid;
    grid-template-columns: 130px 1fr auto auto;
    column-gap: 32px;
    padding: 16px 8px;
    border-bottom: 1px solid var(--paper-edge);
    align-items: center;
    cursor: pointer;
    transition: background .12s;
  }
  .dict-row:hover { background: rgba(180,138,74,0.08); }
  .dict-row .kanji-cell {
    display: flex; flex-direction: column; align-items: center;
    text-align: center; line-height: 1.1;
    font-family: var(--serif-jp);
  }
  .dict-row .kanji-cell .furigana {
    font-size: 22px;
    color: var(--ink-2);
    margin-bottom: 6px;
    letter-spacing: 0.02em;
  }
  .dict-row .kanji-cell .kanji {
    font-weight: 600; font-size: 32px;
    color: var(--ink); line-height: 1;
  }
  .dict-row .en {
    font-family: var(--serif); font-style: italic;
    font-size: 16px; color: var(--ink);
    padding-left: 96px;
  }
  .dict-row .meta {
    font-family: var(--serif); font-size: 11px; color: var(--ink-3); text-align: right;
  }
  .dict-row .meta .level {
    background: var(--gold-soft); color: var(--gold-dark);
    padding: 2px 6px; border-radius: 4px;
    font-weight: 600; letter-spacing: 0.04em;
  }
  @media (max-width: 640px) {
    .dict-row { grid-template-columns: 90px 1fr auto; column-gap: 16px; }
    .dict-row .kanji-cell .furigana { font-size: 16px; }
    .dict-row .kanji-cell .kanji { font-size: 26px; }
    .dict-row .en { padding-left: 0; font-size: 14px; }
    .dict-row .meta:last-child { display: none; }
  }
  .empty-state {
    padding: 60px 20px; text-align: center;
    color: var(--ink-3); font-style: italic; font-family: var(--serif);
  }

  /* ─── class strip (above book picker) ───────────────────────────────── */
  .class-strip {
    display: flex; gap: 6px; flex-wrap: wrap;
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px dashed rgba(141,102,48,0.20);
  }
  .class-tab {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 6px 14px 6px 10px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 999px;
    color: var(--ink-3);
    cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  .class-tab:hover { background: rgba(180,138,74,0.08); color: var(--ink-2); }
  .class-tab.active {
    background: var(--paper-2);
    border-color: rgba(141,102,48,0.30);
    color: var(--ink);
  }
  .class-tab .glyph {
    font-family: var(--serif-jp); font-weight: 700; font-size: 20px;
    color: var(--gold-dark);
    line-height: 1; width: 22px; text-align: center;
  }
  .class-tab.active .glyph { color: var(--ink); }
  .class-tab .label {
    display: flex; flex-direction: column; gap: 1px; line-height: 1.1;
  }
  .class-tab .label .ja {
    font-family: var(--serif-jp); font-size: 13px;
  }
  .class-tab .label .en {
    font-family: var(--serif); font-style: italic; font-size: 11px;
    color: var(--ink-3);
  }
  .class-tab.active .label .en { color: var(--ink-2); }

  /* ─── book picker ───────────────────────────────────────────────────── */
  .book-strip {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
  }
  .book-card {
    background: var(--paper-2);
    border: 1px solid rgba(141,102,48,0.22);
    border-radius: 6px;
    padding: 16px 14px;
    cursor: pointer;
    transition: all .15s;
    display: flex; flex-direction: column; gap: 8px;
    position: relative;
    overflow: hidden;
  }
  .book-card::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
    background: var(--sage-soft);
    transition: background .15s;
  }
  .book-card:hover { transform: translateY(-2px); border-color: var(--gold); }
  .book-card:hover::before { background: var(--gold); }
  .book-card.active { border-color: var(--gold-dark); background: var(--paper); }
  .book-card.active::before { background: var(--gold); }
  .book-card .glyph {
    font-family: var(--serif-jp); font-weight: 700; font-size: 26px;
    color: var(--gold-dark);
  }
  .book-card .ja {
    font-family: var(--serif-jp); font-size: 15px; color: var(--ink);
  }
  .book-card .en {
    font-family: var(--serif); font-style: italic; font-size: 12px;
    color: var(--ink-3);
  }

  /* ─── misc ──────────────────────────────────────────────────────────── */
  .floating-controls {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 22px; flex-wrap: wrap;
  }
  .floating-controls .sep {
    width: 1px; height: 22px; background: var(--paper-edge);
    margin: 0 4px;
  }
  .small-label {
    font-family: var(--serif); font-style: italic; font-size: 12px;
    color: var(--ink-3); margin-right: 4px;
  }

  /* ─── word popover ──────────────────────────────────────────────────── */
  .vocab-row.is-open { background: rgba(180,138,74,0.15); }
  .vocab-row.is-open .num { color: var(--gold-dark); }

  .word-pop-backdrop {
    position: fixed; inset: 0; z-index: 80;
  }
  .word-pop {
    position: fixed; z-index: 81;
    width: 304px;
    background: var(--paper-2);
    border: 1px solid var(--gold-soft);
    border-radius: 6px;
    box-shadow:
      0 0 0 4px var(--paper-2),
      0 0 0 5px var(--gold-soft),
      0 14px 38px rgba(60,40,20,0.22);
    padding: 22px 22px 18px;
  }
  .word-pop.is-hidden { visibility: hidden; }

  .word-pop-close {
    position: absolute; top: 10px; right: 10px;
    width: 22px; height: 22px; border-radius: 50%;
    border: none; background: transparent;
    color: var(--ink-3); cursor: pointer;
    font-family: var(--serif); font-size: 18px; line-height: 1;
    transition: color .12s, background .12s;
  }
  .word-pop-close:hover { color: var(--ink); background: rgba(141,102,48,0.10); }

  .word-pop-glyph {
    font-family: var(--serif-jp); font-weight: 700;
    font-size: 52px; line-height: 1;
    color: var(--ink); letter-spacing: 0.01em;
    margin: 0;
  }
  .word-pop-kana {
    font-family: var(--serif-jp); font-size: 14px;
    color: var(--ink-2);
    margin-top: 6px;
    letter-spacing: 0.04em;
  }
  .word-pop-en {
    font-family: var(--serif); font-style: italic; font-size: 13px;
    color: var(--ink-3);
    margin-top: 2px;
  }

  .word-pop-breakdown {
    display: flex; flex-wrap: wrap; align-items: center;
    gap: 6px 10px;
    margin-top: 12px;
    padding: 10px 10px 8px;
    background: rgba(180,138,74,0.08);
    border-left: 2px solid var(--gold-soft);
    border-radius: 0 4px 4px 0;
    font-family: var(--serif);
    font-size: 12px;
  }
  .word-pop-breakdown .bk-pair {
    display: inline-flex; align-items: center; gap: 5px;
    white-space: nowrap;
  }
  .word-pop-breakdown .bk-stack {
    display: inline-flex; flex-direction: column; align-items: center;
    line-height: 1; gap: 1px;
  }
  .word-pop-breakdown .bk-reading {
    font-family: var(--serif-jp); font-size: 9px;
    color: var(--ink-3); letter-spacing: 0.02em;
    min-height: 11px;
  }
  .word-pop-breakdown .bk-kanji {
    font-family: var(--serif-jp); font-size: 16px;
    color: var(--ink); font-weight: 600;
  }
  .word-pop-breakdown .bk-eq {
    color: var(--ink-3); font-size: 11px;
  }
  .word-pop-breakdown .bk-meaning {
    color: var(--ink-2); font-style: italic;
  }
  .word-pop-breakdown .bk-sep {
    color: var(--ink-4);
  }

  /* Furigana on the big popover glyph. ruby spacing kept tight so the
     stacked kanji+reading still reads as one block. */
  .word-pop-glyph ruby {
    ruby-position: over;
    ruby-align: center;
  }
  .word-pop-glyph rt {
    font-family: var(--serif-jp);
    font-size: 0.32em;
    font-weight: 500;
    color: var(--ink-3);
    line-height: 1;
    letter-spacing: 0.02em;
  }

  body.no-particles .ja-particle {
    color: inherit !important;
    margin: 0 !important;
    font-weight: inherit !important;
  }

  /* ─── word chunks ───────────────────────────────────────────────────── */
  .word-chunk {
    display: inline-block;
    padding: 1px 4px;
    margin: 0 2px;
    border-radius: 4px;
    cursor: pointer;
    transition: background .12s, box-shadow .12s;
  }
  .word-chunk:hover {
    background: rgba(180,138,74,0.18);
    box-shadow: 0 0 0 1px rgba(141,102,48,0.15);
  }
  .word-chunk:active { background: rgba(180,138,74,0.28); }
  .word-chunk .wc-stem { }

  .word-pop-glyph, .word-pop-kana {
    cursor: pointer;
    user-select: none;
  }
  .word-pop-glyph:hover { color: var(--gold-dark); }
  .word-pop-kana:hover { color: var(--ink); }

  .word-pop-divider {
    height: 0; border-top: 1px dashed var(--gold-soft);
    margin: 16px 0 12px;
  }

  .word-pop-section-label {
    font-family: var(--serif); font-style: italic; font-size: 11px;
    color: var(--ink-3); letter-spacing: 0.06em;
    text-transform: lowercase;
    margin-bottom: 6px;
  }

  .word-pop-quote {
    font-family: var(--serif-jp); font-size: 15px;
    color: var(--ink); line-height: 1.55;
  }
  .word-pop-quote-en {
    font-family: var(--serif); font-style: italic; font-size: 12px;
    color: var(--ink-3); line-height: 1.4;
    margin-top: 4px;
  }
  .word-pop-quote .mark {
    background: linear-gradient(transparent 60%, var(--gold-soft) 60%);
    padding: 0 1px;
  }
  .word-pop-empty {
    font-family: var(--serif); font-style: italic; font-size: 12px;
    color: var(--ink-3); line-height: 1.5;
  }

  .word-pop-link {
    display: inline-flex; align-items: center; gap: 4px;
    margin-top: 14px;
    background: none; border: none; padding: 0; cursor: pointer;
    font-family: var(--serif); font-style: italic; font-size: 13px;
    color: var(--gold-dark);
    text-decoration: underline;
    text-decoration-color: var(--gold-soft);
    text-underline-offset: 3px;
    transition: color .12s;
  }
  .word-pop-link:hover { color: var(--ink); }

  .fade-enter { animation: fadeIn .28s ease both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  .sidebar::-webkit-scrollbar { width: 6px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--gold-soft); border-radius: 3px; }

  /* ─── writing / kana page ───────────────────────────────────────────── */
  .kana-controls {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    margin-bottom: 24px;
  }
  .kana-card {
    background: var(--paper-2);
    border: 1px solid rgba(141,102,48,0.22);
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 28px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.4) inset, 0 4px 14px var(--paper-shadow);
  }
  .kana-section-h {
    font-family: var(--serif-jp); font-size: 18px; font-weight: 600;
    color: var(--ink-2);
    margin: 0 0 12px;
    letter-spacing: 0.04em;
  }
  .kana-grid { display: flex; flex-direction: column; gap: 16px; }
  .kana-row {
    display: grid;
    grid-template-columns: 28px repeat(5, 1fr);
    gap: 6px;
    align-items: stretch;
    padding-bottom: 12px;
    border-bottom: 1px dashed rgba(141,102,48,0.18);
  }
  .kana-row:last-child { border-bottom: none; padding-bottom: 0; }
  .kana-row.kana-header { padding-bottom: 6px; border-bottom: 1px dashed var(--paper-edge); margin-bottom: 4px; }
  .kana-col-label {
    font-family: var(--serif); font-style: italic; font-size: 13px;
    color: var(--ink-3); text-align: center;
  }
  .kana-cell-label {
    font-family: var(--serif); font-style: italic; font-size: 13px;
    color: var(--ink-3); text-align: center; align-self: center;
  }
  .kana-cell {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto auto;
    column-gap: 6px; row-gap: 2px;
    align-items: center; justify-items: center;
    padding: 10px 6px;
    border-radius: 6px;
    border-right: 1px dashed rgba(141,102,48,0.18);
    min-height: 64px;
    transition: background .12s;
    line-height: 1.05;
  }
  .kana-row > .kana-cell:last-child,
  .kana-row > .kana-cell:nth-child(6) { border-right: none; }
  .kana-row.kana-header > .kana-cell { border-right: none; }
  .kana-cell.kana-only-one { grid-template-columns: 1fr; }
  .kana-cell .kana-r { grid-column: 1 / -1; }
  .kana-cell:hover:not(.kana-empty) { background: rgba(180,138,74,0.12); }
  .kana-empty {
    background: repeating-linear-gradient(135deg, transparent 0 4px, var(--paper-edge) 4px 5px);
    opacity: 0.4; min-height: 64px;
  }
  .kana-h { color: var(--ink); line-height: 1; transition: font-size .15s; }
  .kana-k { color: var(--ink-2); line-height: 1; transition: font-size .15s; }
  .kana-r {
    font-family: var(--serif); font-style: italic; font-size: 11px;
    color: var(--ink-3); margin-top: 2px; letter-spacing: 0.04em;
  }

  /* numbers reference */
  .num-twocol {
    display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 18px;
  }
  @media (max-width: 820px) { .num-twocol { grid-template-columns: 1fr; } }

  .num-card {
    background: var(--paper-2);
    border: 1px solid rgba(141,102,48,0.22);
    border-radius: 10px;
    padding: 16px 20px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.4) inset, 0 4px 14px var(--paper-shadow);
    margin-bottom: 18px;
  }
  .num-card-hd {
    display: flex; align-items: center; gap: 10px;
    padding-bottom: 10px; border-bottom: 1px dashed var(--paper-edge); margin-bottom: 12px;
  }
  .num-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--gold-dark); color: white;
    font-family: var(--serif); font-weight: 600; font-size: 13px;
    flex: 0 0 auto;
  }
  .num-card-title {
    font-size: 18px; font-weight: 600; color: var(--ink); letter-spacing: 0.04em;
  }
  .num-card-body { display: grid; grid-template-columns: 1fr; gap: 18px; }
  .num-card.num-card-wide .num-card-body {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr);
  }
  @media (max-width: 820px) {
    .num-card .num-card-body { grid-template-columns: 1fr !important; }
  }
  .num-card-aside { border-left: 1px dashed var(--paper-edge); padding-left: 18px; }
  @media (max-width: 820px) {
    .num-card-aside { border-left: none; padding-left: 0; border-top: 1px dashed var(--paper-edge); padding-top: 14px; }
  }

  .num-table { width: 100%; border-collapse: collapse; }
  .num-table td {
    padding: 6px 4px; vertical-align: middle;
    border-bottom: 1px dashed rgba(141,102,48,0.15);
  }
  .num-table tr:last-child td { border-bottom: none; }
  .num-table-v {
    font-family: var(--serif); font-variant-numeric: tabular-nums;
    color: var(--ink-3); width: 56px; font-size: 14px;
    text-align: right; padding-right: 14px;
  }
  .num-table-k {
    font-family: var(--serif-jp); font-size: 22px; color: var(--ink);
    font-weight: 500; letter-spacing: 0.04em; width: 78px;
  }
  .num-table-r {
    font-family: var(--serif-jp); font-size: 15px; color: var(--ink-2);
  }
  .num-table-r.is-irregular-r { color: var(--rose, #c43a4a); font-weight: 600; }

  .num-callout {
    border: 1.5px solid var(--gold); border-radius: 12px;
    padding: 12px 14px; text-align: center; background: var(--paper);
  }
  .num-callout-hd { font-size: 18px; margin-bottom: 4px; }
  .num-callout-body {
    display: flex; flex-direction: column; gap: 4px;
    font-family: var(--serif); font-size: 14px; color: var(--ink-2);
  }
  .num-callout-jp { font-size: 20px; color: var(--gold-dark); font-weight: 600; }

  .num-formula-area { display: flex; flex-direction: column; gap: 12px; }
  .num-formula {
    text-align: center; padding: 10px 12px;
    background: var(--paper); border: 1px solid var(--paper-edge); border-radius: 6px;
    font-family: var(--serif); color: var(--ink-2); font-size: 14px;
  }
  .num-pill {
    display: inline-block; padding: 2px 10px; border-radius: 4px;
    margin: 0 4px; font-size: 13px; font-weight: 500;
  }
  .num-pill.ten { background: #d9e3f0; color: #2a5b94; }
  .num-plus { color: var(--ink-3); margin: 0 4px; font-size: 14px; }
  .num-construct {
    display: flex; align-items: center; justify-content: center;
    gap: 6px; flex-wrap: wrap;
  }
  .num-construct-pill {
    padding: 6px 12px; border-radius: 6px; text-align: center;
    border: 1px solid currentColor;
    font-family: var(--serif); font-size: 13px; line-height: 1.2;
  }
  .num-construct-pill.tens   { color: #2a5b94; background: rgba(42,91,148,0.06); }
  .num-construct-pill.ones   { color: #c43a4a; background: rgba(196,58,74,0.06); }
  .num-construct-pill.result { color: var(--ink-2); background: var(--paper); border-style: dashed; }
  .num-construct-pill .hint { font-family: var(--serif-jp); font-size: 10px; color: var(--ink-3); }
  .num-arrow { color: var(--ink-3); font-size: 16px; }

  .num-divider {
    text-align: center; border-bottom: 1px dashed var(--paper-edge);
    line-height: 0; margin: 4px 0;
  }
  .num-divider span {
    background: var(--paper-2); padding: 0 10px;
    font-family: var(--serif); font-style: italic; font-size: 12px;
    color: var(--ink-3); letter-spacing: 0.04em;
  }

  .num-examples {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
  }
  @media (max-width: 540px) { .num-examples { grid-template-columns: repeat(2, 1fr); } }
  .num-example {
    text-align: center; padding: 8px 4px; border-radius: 6px;
    background: var(--paper); border: 1px solid var(--paper-edge);
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .num-example-v {
    font-family: var(--serif); font-weight: 600; font-size: 17px;
    color: var(--ink); font-variant-numeric: tabular-nums;
  }
  .num-example-k {
    font-family: var(--serif-jp); font-size: 16px; color: var(--ink);
    letter-spacing: 0.04em;
  }
  .num-example-k .as-tens { color: #2a5b94; }
  .num-example-k .as-ones { color: #c43a4a; }
  .num-example-arrow { color: var(--ink-3); font-size: 11px; }
  .num-example-r {
    font-family: var(--serif-jp); font-size: 12px; color: var(--ink-2);
  }

  .num-irregular-callout {
    border: 1.5px solid var(--gold-soft);
    background: rgba(217,193,145,0.18);
    border-radius: 8px; padding: 12px 14px; margin-bottom: 14px;
  }
  .num-irregular-hd {
    font-family: var(--serif); font-style: italic; font-size: 13px;
    color: var(--gold-dark); margin-bottom: 6px; font-weight: 600;
  }
  .num-irregular-body {
    color: var(--rose, #c43a4a);
    font-size: 15px; font-weight: 600; line-height: 1.6;
  }

  .num-bigex {
    display: flex; flex-direction: column; gap: 4px;
    padding: 12px 14px; border: 1px dashed var(--paper-edge); border-radius: 8px;
  }
  .num-bigex-line {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center;
  }
  .num-bigex-v {
    font-family: var(--serif); font-weight: 600; font-size: 18px;
    color: var(--ink); font-variant-numeric: tabular-nums;
  }
  .num-bigex-k { font-family: var(--serif-jp); font-size: 20px; color: var(--ink); }
  .num-bigex-k .thousands { color: #6a3a92; }

  .kana-note {

  /* ─── settings button ───────────────────────────────────────────────── */
  .settings-btn {
    position: fixed; bottom: 16px; right: 16px; z-index: 90;
    width: 38px; height: 38px; border-radius: 50%;

  .settings-row:last-child { border-bottom: none; }
  .settings-toggle {

  }
  .settings-toggle[aria-checked="true"] { background: var(--gold); }
  .settings-toggle i {
    position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
    border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25);
    transition: transform .15s; pointer-events: none;
  }
  .settings-toggle[aria-checked="true"] i { transform: translateX(14px); }
  .settings-density { display: flex; gap: 4px; }
  .settings-density button {
    padding: 3px 8px; border-radius: 5px; border: 1px solid var(--paper-edge);
    background: var(--paper); font-family: var(--serif); font-size: 12px;

</style>

<body>

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main">
    <div class="main-inner" id="main-inner"></div>
  </main>
</div>

<div id="word-pop-backdrop" class="word-pop-backdrop" style="display:none"></div>
<div id="word-pop" class="word-pop is-hidden"></div>

<button id="settings-btn" class="settings-btn" aria-label="Settings" title="Settings">⚙</button>
<div id="settings-panel" class="settings-panel" hidden></div>

<script src="image-slot.js?v=readonly"></script>
<script src="data.js?v=readonly"></script>
<script>
'use strict';

// ── Persistence helpers ─────────────────────────────────────────────────
function lsGet(key, def) {
  try { const r = localStorage.getItem(key); return r == null ? def : JSON.parse(r); }
  catch { return def; }
}
function lsSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}

// ── Sections ────────────────────────────────────────────────────────────
const SECTIONS = [
  { id: 'vocab',      glyph: '語', ja: '語彙',  en: 'Vocabulary' },
  { id: 'writing',    glyph: '文', ja: '文字',  en: 'Writing' },
  { id: 'flashcards', glyph: '札', ja: '単語札', en: 'Flashcards' },
  { id: 'dictionary', glyph: '辞', ja: '辞書',   en: 'Dictionary' },
];

function hashSection() {
  const h = (location.hash || '').replace('#', '');
  return ['vocab','writing','flashcards','dictionary'].includes(h) ? h : lsGet('jp:section', 'vocab');
}

const APP = {
  section:      hashSection(),
  showEnglish:  lsGet('jp:showEnglish', true),
  density:      lsGet('jp:density', 'comfortable'),
  particlesOn:  lsGet('jp:particles', true),
  vocabClassId: lsGet('jp:vocabClass', 'home'),
  vocabBookId:  lsGet('jp:vocabBook', 'bathroom'),
  vocabPageIdx: 0,
  // Migrate legacy class ids: 'weather' → 'nature', 'doors' → 'rooms'.
  flashClassId: (() => {
    const v = lsGet('jp:flashClass', 'basic');
    if (v === 'weather') return 'nature';
    if (v === 'doors') return 'rooms';
    return v;
  })(),
  flashIdx:     0,
  flashShowEn:  true,
  dictQ:        '',
  dictKind:     'all',
  dictLevel:    'all',
  dictTag:      'all',
  popoverItem:  null,
  popoverRect:  null,
  pendingDictQ: null,
  _flashKeyHandler: null,
  // writing / kana
  kanaShowH:    lsGet('jp:kana-show-h', true),
  kanaShowK:    lsGet('jp:kana-show-k', true),
  kanaRomaji:   lsGet('jp:kana-romaji', true),
  kanaEmphasis: lsGet('jp:kana-emphasis', 'equal'),
  kanaFont:     lsGet('jp:kana-font', 'mincho'),
};

function setSection(s) {
  APP.section = s;
  location.hash = s;
  lsSet('jp:section', s);
  renderMain();
  updateSidebar();
}

// ── Body classes ────────────────────────────────────────────────────────
function applyBodyClasses() {
  document.body.classList.toggle('no-english', !APP.showEnglish);
  document.body.classList.toggle('no-particles', !APP.particlesOn);
  const pad = APP.density === 'compact' ? '32px' : APP.density === 'roomy' ? '72px' : '56px';
  document.documentElement.style.setProperty('--pad-page', pad);
}

// ── Utilities ───────────────────────────────────────────────────────────
function escHTML(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escAttr(s) {
  return String(s).replace(/"/g,'&quot;');
}

// Particle colors are keyed to grammatical role so the same color travels
// with the same function across every sentence. に joins で in the green
// family because both mark place/time — slightly different shades so the
// two stay distinguishable side-by-side.
const PARTICLE_COLORS = {
  'は':'#8a2538', // topic        — wine
  'を':'#5a2e8a', // direct object — purple
  'が':'#c97a2c', // subject       — orange
  'と':'#2a5b94', // with/and      — blue
  'の':'#c43a4a', // possessive    — red
  'で':'#2e7a3f', // place of action / means — forest green
  'に':'#1f7a5e', // destination / time / indirect object — teal green
};
const PARTICLE_CHARS = ['は','を','が','と','の','で','に'];

function _isHiragana(c) { return !!c && /[぀-ゟ]/.test(c); }

function colorParticles(ja) {
  if (!ja) return '';
  let html = '';
  for (let i = 0; i < ja.length; i++) {
    const c = ja[i];
    const next = ja[i + 1] || '';
    if (PARTICLE_COLORS[c] && !_isHiragana(next)) {
      html += `<span class="ja-particle" style="color:${PARTICLE_COLORS[c]};margin:0 0.18em;font-weight:500">${c}</span>`;
    } else {
      html += c;
    }
  }
  return html;
}

function kanjiReading(c) {
  const readings = window.KANJI_READINGS || {};
  if (readings[c]) return readings[c];
  // Fall back to a dictionary kanji entry's kana (convert katakana → hiragana,
  // drop the okurigana marker after `.`).
  const dictEntry = (window.DICTIONARY || []).find(e => e.kind === 'kanji' && e.kanji === c);
  if (dictEntry && dictEntry.kana) {
    return dictEntry.kana.split('.')[0]
      .replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60));
  }
  return '';
}

function splitKanjiBreakdown(word, kana) {
  if (!word) return null;
  const meanings = window.KANJI_MEANINGS || {};
  const chars = [...word];
  const kanji = chars.filter(c => /[㐀-鿿]/.test(c));
  const hiragana = chars.filter(c => /[぀-ゟ]/.test(c));
  if (kanji.length === 0) return null;
  if (kanji.length === 1 && hiragana.length === 0) return null;
  const aligned = alignReadings(word, kana);
  const out = [];
  for (let i = 0; i < word.length; i++) {
    const c = word[i];
    if (/[㐀-鿿]/.test(c)) {
      out.push({
        char: c,
        reading: (aligned && aligned.get(i)) || kanjiReading(c),
        meaning: meanings[c] || '?'
      });
    }
  }
  return out;
}

// Align a word's per-kanji reading against the supplied kana, so context-
// dependent readings come out right. The hiragana runs in the word are
// matched literally in the kana; everything else is attributed to the
// surrounding kanji. Adjacent kanji are split by walking each one's default
// reading from KANJI_READINGS. Returns a Map(index → reading) or null on
// mismatch.
function alignReadings(word, kana) {
  if (!word || !kana) return null;
  const ka = kana.replace(/[\s　]/g, '');
  const toHira = s => s.replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60));

  // Tokenize word into kanji singletons + literal (non-kanji) runs.
  const tokens = [];
  for (let i = 0; i < word.length; i++) {
    const c = word[i];
    if (/[㐀-鿿]/.test(c)) {
      tokens.push({ type: 'k', char: c, idx: i });
    } else {
      const last = tokens[tokens.length - 1];
      if (last && last.type === 'lit') last.text += c;
      else tokens.push({ type: 'lit', text: c });
    }
  }

  // Locate each literal in the kana; the gaps between them are kanji.
  let kPos = 0;
  for (const tok of tokens) {
    if (tok.type !== 'lit') continue;
    const hira = toHira(tok.text);
    const idx = ka.indexOf(hira, kPos);
    if (idx < 0) return null;
    tok.kanaStart = idx;
    tok.kanaEnd = idx + hira.length;
    kPos = tok.kanaEnd;
  }

  // Fill in kanji readings from the gaps.
  const out = new Map();
  let prevEnd = 0;
  for (let t = 0; t < tokens.length; t++) {
    const tok = tokens[t];
    if (tok.type === 'lit') { prevEnd = tok.kanaEnd; continue; }
    const nextLit = tokens.slice(t + 1).find(x => x.type === 'lit');
    const endPos = nextLit ? nextLit.kanaStart : ka.length;
    const cluster = [tok];
    while (t + 1 < tokens.length && tokens[t + 1].type === 'k') {
      cluster.push(tokens[t + 1]); t++;
    }
    const total = ka.slice(prevEnd, endPos);
    if (cluster.length === 1) {
      out.set(cluster[0].idx, total);
    } else {
      // First pass: match each kanji's default reading sequentially. If every
      // default lines up, great. If any default fails, split the cluster's
      // total kana proportionally by the default *lengths* instead — this
      // catches rendaku and other one-mora shifts (e.g. お風呂: defaults よく
      // /ろ don't match, but lengths 2/1 → wrong; the actual ふ/ろ wants 1/1).
      const defs = cluster.map(k => (window.KANJI_READINGS || {})[k.char] || '');
      let pos = 0;
      let ok = true;
      for (let i = 0; i < cluster.length; i++) {
        if (defs[i] && total.slice(pos).startsWith(defs[i])) pos += defs[i].length;
        else { ok = false; break; }
      }
      if (ok && pos === total.length) {
        for (let i = 0, p = 0; i < cluster.length; i++) {
          out.set(cluster[i].idx, defs[i]); p += defs[i].length;
        }
      } else {
        // Proportional fallback: distribute `total` across the cluster using
        // the ratio of each kanji's default-reading length. Kanji with no
        // default reading get an equal share.
        const lens = defs.map(d => d.length || 1);
        const lensSum = lens.reduce((a, b) => a + b, 0);
        let p = 0;
        for (let i = 0; i < cluster.length; i++) {
          const share = i === cluster.length - 1
            ? total.length - p
            : Math.round(total.length * lens[i] / lensSum);
          out.set(cluster[i].idx, total.slice(p, p + share));
          p += share;
        }
      }
    }
    prevEnd = endPos;
  }
  return out;
}

// Wrap each kanji in a word with <ruby>k<rt>reading</rt></ruby>. Non-kanji
// characters pass through unchanged so シャワーを浴びる only annotates 浴.
// When `kana` is provided, the per-kanji reading is aligned against it
// (so 浴 reads あ in 浴びる but よく in 浴室).
function withFurigana(word, kana) {
  if (!word) return '';
  const aligned = alignReadings(word, kana);
  let html = '';
  for (let i = 0; i < word.length; i++) {
    const c = word[i];
    if (/[㐀-鿿]/.test(c)) {
      const r = (aligned && aligned.get(i)) || kanjiReading(c);
      html += r
        ? `<ruby>${escHTML(c)}<rt>${escHTML(r)}</rt></ruby>`
        : escHTML(c);
    } else {
      html += escHTML(c);
    }
  }
  return html;
}

function parseChunk(text) {
  if (!text) return { stem: '', particles: [], punct: '' };
  let rest = text;
  const punctMatch = rest.match(/([。、！？!?,\.…]+)$/);
  const punct = punctMatch ? punctMatch[0] : '';
  if (punct) rest = rest.slice(0, -punct.length);
  const particles = [];
  while (rest.length > 1 && PARTICLE_CHARS.includes(rest[rest.length - 1])) {
    particles.unshift(rest[rest.length - 1]);
    rest = rest.slice(0, -1);
  }
  return { stem: rest, particles, punct };
}

function lookupWord(text) {
  if (!text) return null;
  for (const book of (window.VOCAB_BOOKS || [])) {
    for (const page of (book.pages || [])) {
      for (const item of (page.items || [])) {
        const k = item.kanji || item.ja;
        if (k === text || item.kana === text || item.ja === text)
          return { kanji: k || text, kana: item.kana || '', en: item.en || '' };
      }
    }
  }
  const d = (window.DICTIONARY || []).find(e => e.kanji === text || e.kana === text);
  if (d) return { kanji: d.kanji, kana: d.kana, en: d.en };

  // Character-level fallback: a single kanji that's not in any vocab book
  // or DICTIONARY entry might still have an entry in KANJI_READINGS and
  // KANJI_MEANINGS. Without this, clicking unknown kanji inside a sentence
  // (e.g. 前 inside 食べる 前に) showed an empty popover. The rule now is
  // that every kanji we have any data for surfaces at least its reading
  // and meaning when clicked.
  const chars = [...text];
  if (chars.length === 1) {
    const c = chars[0];
    const meanings = window.KANJI_MEANINGS || {};
    const readings = window.KANJI_READINGS || {};
    if (meanings[c] || readings[c]) {
      return { kanji: c, kana: readings[c] || '', en: meanings[c] || '' };
    }
  }
  return { kanji: text, kana: '', en: '' };
}

function wordChunkHTML(text) {
  const { stem, particles, punct } = parseChunk(text);
  if (!stem) return escHTML(text);
  const particleSpans = particles.map(p =>
    `<span class="ja-particle" style="color:${PARTICLE_COLORS[p]||'inherit'};font-weight:500;margin:0">${p}</span>`
  ).join('');
  return `<span class="word-chunk" data-stem="${escAttr(stem)}" title="click to look up · double-click for dictionary"><span class="wc-stem">${escHTML(stem)}</span>${particleSpans}</span>${escHTML(punct)}`;
}

// Split a Japanese line into clickable chunks. A chunk boundary is either
// whitespace OR the position right after a punctuation mark — so "前に、手を"
// becomes ["前に、", "手を"] and the に particle separates cleanly from the
// 手 that follows it.
function splitJaChunks(text) {
  const chunks = [];
  let cur = '';
  for (const c of text) {
    if (/[\s　]/.test(c)) {
      if (cur) { chunks.push(cur); cur = ''; }
    } else {
      cur += c;
      if (/[、。！？!?,…]/.test(c)) { chunks.push(cur); cur = ''; }
    }
  }
  if (cur) chunks.push(cur);
  return chunks;
}

function jaSentenceHTML(text) {
  if (!text) return '';
  return splitJaChunks(text).map(wordChunkHTML).join('');
}

// ── Popover ─────────────────────────────────────────────────────────────
function initPopover() {
  const backdrop = document.getElementById('word-pop-backdrop');

  backdrop.addEventListener('click', closePopover);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closePopover(); });

  document.getElementById('main').addEventListener('click', e => {
    const chunk = e.target.closest('.word-chunk');
    if (!chunk) return;
    e.stopPropagation();
    openPopover(lookupWord(chunk.dataset.stem), chunk.getBoundingClientRect());
  });
  document.getElementById('main').addEventListener('dblclick', e => {
    const chunk = e.target.closest('.word-chunk');
    if (!chunk) return;
    e.preventDefault(); e.stopPropagation();
    jumpToDictionary(chunk.dataset.stem);
  });

  document.getElementById('main').addEventListener('click', e => {
    const row = e.target.closest('.vocab-row[data-kanji]');
    if (!row) return;
    openPopover({ kanji: row.dataset.kanji, kana: row.dataset.kana, en: row.dataset.en }, row.getBoundingClientRect());
  });
  document.getElementById('main').addEventListener('dblclick', e => {
    const row = e.target.closest('.vocab-row[data-kanji]');
    if (!row) return;
    e.preventDefault();
    jumpToDictionary(row.dataset.kanji);
  });

  // Usage cards: the whole card is the click target, not its contents.
  document.getElementById('main').addEventListener('click', e => {
    const card = e.target.closest('.usage-card[data-kanji]');
    if (!card) return;
    openPopover({ kanji: card.dataset.kanji, kana: card.dataset.kana, en: card.dataset.en }, card.getBoundingClientRect());
  });
  document.getElementById('main').addEventListener('dblclick', e => {
    const card = e.target.closest('.usage-card[data-kanji]');
    if (!card) return;
    e.preventDefault();
    jumpToDictionary(card.dataset.kanji);
  });
}

function jumpToDictionary(q) {
  APP.pendingDictQ = q;
  setSection('dictionary');
}

function openPopover(item, anchorRect) {
  const pop = document.getElementById('word-pop');
  const backdrop = document.getElementById('word-pop-backdrop');
  const breakdown = splitKanjiBreakdown(item.kanji, item.kana);
  const bdHTML = breakdown ? `
    <div class="word-pop-breakdown">
      ${breakdown.map((b, i) => `
        ${i > 0 ? '<span class="bk-sep">·</span>' : ''}
        <span class="bk-pair">
          <span class="bk-stack">
            <span class="bk-reading">${escHTML(b.reading)}</span>
            <span class="bk-kanji">${escHTML(b.char)}</span>
          </span>
          <span class="bk-eq">=</span>
          <span class="bk-meaning">${escHTML(b.meaning)}</span>
        </span>
      `).join('')}
    </div>` : '';

  // Glyph font scales down with length so a single kanji stays imposing but
  // a six-character phrase still fits the popover without wrapping.
  const glyphLen = [...(item.kanji || '')].length;
  const glyphSize = glyphLen <= 2 ? 52 : glyphLen <= 4 ? 34 : glyphLen <= 6 ? 26 : 22;

  pop.innerHTML = `
    <button class="word-pop-close" id="pop-close" aria-label="close">×</button>
    <div class="word-pop-glyph" style="font-size:${glyphSize}px;line-height:1.35">${withFurigana(item.kanji || '', item.kana || '')}</div>
    <div class="word-pop-kana">${escHTML(item.kana || '')}</div>
    <div class="word-pop-en">${escHTML(item.en || '')}</div>
    ${bdHTML}`;

  document.getElementById('pop-close').addEventListener('click', closePopover);
  pop.querySelector('.word-pop-glyph').addEventListener('dblclick', e => {
    e.preventDefault(); jumpToDictionary(item.kanji || item.kana);
  });

  pop.classList.remove('is-hidden');
  backdrop.style.display = 'block';

  const popW = pop.offsetWidth || 304;
  const popH = pop.offsetHeight || 200;
  const gap = 14, margin = 16;
  const vw = window.innerWidth, vh = window.innerHeight;
  const r = anchorRect;
  let left = r.right + gap;
  let top = r.top - 8;
  if (left + popW > vw - margin) {
    left = r.left - popW - gap;
    if (left < margin) { left = Math.max(margin, Math.min(vw - popW - margin, r.left)); top = r.bottom + gap; }
  }
  if (top + popH > vh - margin) top = vh - popH - margin;
  if (top < margin) top = margin;
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
}

function closePopover() {
  document.getElementById('word-pop').classList.add('is-hidden');
  document.getElementById('word-pop-backdrop').style.display = 'none';
}

// ── Sidebar ─────────────────────────────────────────────────────────────
function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = `
    <div class="sidebar-inner">
      <div class="brand">
        <div class="brand-mark">日</div>
        <div>
          <div class="brand-name">nihongo</div>
        </div>
      </div>
      <ul class="nav-list">
        ${SECTIONS.map(s => `
          <li>
            <button class="bookmark ${APP.section === s.id ? 'active' : ''}" data-section="${s.id}">
              <span class="glyph">${s.glyph}</span>
              <span class="label">
                <span class="ja">${s.ja}</span>
                <span class="en">${s.en}</span>
              </span>
            </button>
          </li>
        `).join('')}
      </ul>
    </div>`;
  sidebar.querySelectorAll('[data-section]').forEach(btn => {
    btn.addEventListener('click', () => setSection(btn.dataset.section));
  });
}

function updateSidebar() {
  document.querySelectorAll('.bookmark').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.section === APP.section);
  });
}

// ── Settings ────────────────────────────────────────────────────────────
function renderSettings() {
  const panel = document.getElementById('settings-panel');
  panel.innerHTML = `
    <div class="settings-row">
      <span>Show English</span>
      <button class="settings-toggle" aria-checked="${APP.showEnglish}" data-setting="showEnglish" role="switch"><i></i></button>
    </div>
    <div class="settings-row">
      <span>Particle colors</span>
      <button class="settings-toggle" aria-checked="${APP.particlesOn}" data-setting="particlesOn" role="switch"><i></i></button>
    </div>
    <div class="settings-row">
      <span>Density</span>
      <div class="settings-density">
        ${['compact','comfortable','roomy'].map(d =>
          `<button data-density="${d}" class="${APP.density === d ? 'active' : ''}">${d[0].toUpperCase()}</button>`
        ).join('')}
      </div>
    </div>`;

  panel.querySelectorAll('[data-setting]').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.setting;
      APP[key] = !APP[key];
      lsSet(key === 'showEnglish' ? 'jp:showEnglish' : 'jp:particles', APP[key]);
      applyBodyClasses();
      renderSettings();
    });
  });
  panel.querySelectorAll('[data-density]').forEach(btn => {
    btn.addEventListener('click', () => {
      APP.density = btn.dataset.density;
      lsSet('jp:density', APP.density);
      applyBodyClasses();
      renderSettings();
    });
  });
}

function initSettings() {
  const btn = document.getElementById('settings-btn');
  const panel = document.getElementById('settings-panel');
  btn.addEventListener('click', e => {
    e.stopPropagation();
    if (panel.hasAttribute('hidden')) { renderSettings(); panel.removeAttribute('hidden'); }
    else panel.setAttribute('hidden', '');
  });
  document.addEventListener('click', e => {
    if (!panel.contains(e.target) && e.target !== btn) panel.setAttribute('hidden', '');
  });
}

// ── Main dispatcher ──────────────────────────────────────────────────────
function renderMain() {
  closePopover();
  if (APP._flashKeyHandler) {
    window.removeEventListener('keydown', APP._flashKeyHandler);
    APP._flashKeyHandler = null;
  }
  const el = document.getElementById('main-inner');
  el.className = 'main-inner fade-enter';
  if (APP.section === 'vocab')           renderVocab(el);
  else if (APP.section === 'writing')    renderWriting(el);
  else if (APP.section === 'flashcards') renderFlashcards(el);
  else if (APP.section === 'dictionary') renderDictionary(el);
}

// ── Vocab ────────────────────────────────────────────────────────────────
function renderVocab(container) {
  const cls = VOCAB_CLASSES.find(c => c.id === APP.vocabClassId) || VOCAB_CLASSES[0];
  // If the stored book doesn't belong to this class (e.g. user switched
  // classes), drop to the first book in the class.
  if (!cls.books.some(b => b.id === APP.vocabBookId)) {
    APP.vocabBookId = cls.books[0] ? cls.books[0].id : null;
    APP.vocabPageIdx = 0;
  }
  const book = cls.books.find(b => b.id === APP.vocabBookId) || cls.books[0];
  const hasPages = !!(book && book.pages && book.pages.length);
  if (hasPages && APP.vocabPageIdx >= book.pages.length) APP.vocabPageIdx = 0;
  const page = hasPages ? book.pages[APP.vocabPageIdx] : null;

  const pagerHTML = hasPages ? `
    <div class="pager">
      <button class="icon-btn" id="pager-prev" ${APP.vocabPageIdx === 0 ? 'disabled' : ''} title="previous page">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="dots">
        ${book.pages.map((p, i) => `
          <button class="dot ${i === APP.vocabPageIdx ? 'active' : ''}" data-page="${i}" title="${escAttr(p.title)}"></button>
        `).join('')}
      </div>
      <button class="icon-btn" id="pager-next" ${APP.vocabPageIdx === book.pages.length - 1 ? 'disabled' : ''} title="next page">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
      </button>
      <span class="small-label" style="margin-left:12px">page ${APP.vocabPageIdx + 1} / ${book.pages.length}</span>
    </div>` : '';

  container.innerHTML = `
    <div class="page-head">
      <div class="page-eyebrow">vocabulary · 語彙</div>
      <h1 class="page-title-jp">${escHTML(cls.pageTitleJa)}</h1>
      <div class="rule"></div>
    </div>

    <div class="class-strip">
      ${VOCAB_CLASSES.map(c => `
        <button class="class-tab ${c.id === APP.vocabClassId ? 'active' : ''}" data-class="${c.id}">
          <span class="glyph">${c.glyph}</span>
          <span class="label">
            <span class="ja">${escHTML(c.titleJa)}</span>
            <span class="en">${escHTML(c.titleEn)}</span>
          </span>
        </button>
      `).join('')}
    </div>

    <div class="book-strip">
      ${cls.books.map(b => `
        <button class="book-card ${b.id === APP.vocabBookId ? 'active' : ''}" data-book="${b.id}">
          <div class="glyph">${b.glyph}</div>
          <div class="ja">${escHTML(b.titleJa)}</div>
          <div class="en">${escHTML(b.titleEn)}</div>
        </button>
      `).join('')}
    </div>

    <div id="vocab-page-content"></div>
    ${pagerHTML}`;

  if (hasPages) {
    renderVocabPage(book, page);
  } else {
    document.getElementById('vocab-page-content').innerHTML =
      `<div class="empty-state">${escHTML(book ? book.titleEn : 'This category')} — coming soon.</div>`;
  }

  container.querySelectorAll('[data-class]').forEach(btn => {
    btn.addEventListener('click', () => {
      APP.vocabClassId = btn.dataset.class;
      APP.vocabBookId = null;
      APP.vocabPageIdx = 0;
      lsSet('jp:vocabClass', APP.vocabClassId);
      renderVocab(container);
    });
  });
  container.querySelectorAll('[data-book]').forEach(btn => {
    btn.addEventListener('click', () => {
      APP.vocabBookId = btn.dataset.book;
      APP.vocabPageIdx = 0;
      lsSet('jp:vocabBook', APP.vocabBookId);
      renderVocab(container);
    });
  });
  const prev = container.querySelector('#pager-prev');
  const next = container.querySelector('#pager-next');
  if (prev) prev.addEventListener('click', () => {
    APP.vocabPageIdx = Math.max(0, APP.vocabPageIdx - 1);
    renderVocab(container);
  });
  if (next) next.addEventListener('click', () => {
    APP.vocabPageIdx = Math.min(book.pages.length - 1, APP.vocabPageIdx + 1);
    renderVocab(container);
  });
  container.querySelectorAll('.dot[data-page]').forEach(btn => {
    btn.addEventListener('click', () => {
      APP.vocabPageIdx = parseInt(btn.dataset.page, 10);
      renderVocab(container);
    });
  });
}

function renderVocabPage(book, page) {
  const el = document.getElementById('vocab-page-content');
  if (page.type === 'cheatsheet')  el.innerHTML = cheatsheetHTML(book, page);
  else if (page.type === 'usage')  el.innerHTML = usageHTML(page);
  else if (page.type === 'sentences') {
    el.innerHTML = sentencesHTML(page, 'ALL', false);
    attachSentencesEvents(el, page);
  }
}

function cheatsheetHTML(book, page) {
  // Only treat の / と as particles when they're standalone tokens — the
  // `と` inside ことば (kotoba) is part of the word, not a particle.
  const titleHTML = page.title.replace(/(^|[\s　])(の|と)(?=[\s　]|$)/g,
    '$1<span class="particle">$2</span>');
  const items = page.items.map(item => `
    <div class="vocab-row" data-kanji="${escAttr(item.kanji)}" data-kana="${escAttr(item.kana)}" data-en="${escAttr(item.en)}">
      <span class="num">${item.num}.</span>
      <div class="body">
        <span class="kanji">${escHTML(item.kanji)}</span>
        <span class="kana">（${escHTML(item.kana)}）</span>
        <span class="en">${escHTML(item.en)}</span>
      </div>
    </div>`).join('');

  return `
    <div class="book-frame">
      <span class="corner-tl"></span><span class="corner-tr"></span>
      <h2 class="book-title">${titleHTML}</h2>
      <div class="sheet-image">
        <image-slot
          id="vocab-${book.id}-${page.imageSlotId}"
          image-key="vocab/${escAttr(book.id)}-${escAttr(page.imageSlotId)}"
          shape="rounded" radius="4" fit="natural"
          placeholder="Drop an illustration"></image-slot>
      </div>
      <div class="vocab-grid">${items}</div>
    </div>`;
}

function usageHTML(page) {
  const cards = page.items.map(u => `
    <div class="usage-card" data-kanji="${escAttr(u.ja)}" data-kana="${escAttr(u.kana||'')}" data-en="${escAttr(u.en||'')}">
      <div class="ja">${colorParticles(u.ja)}</div>
      <div class="kana">${escHTML(u.kana)}</div>
      <div class="en">${escHTML(u.en)}</div>
    </div>`).join('');
  return `
    <div class="panel">
      <div style="margin-bottom:18px">
        <h2 style="font-family:var(--serif-jp);font-size:26px;color:var(--ink);margin:0;font-weight:600">${escHTML(page.title)}</h2>
        <div style="font-family:var(--serif);font-style:italic;font-size:14px;color:var(--ink-3);margin-top:4px">${escHTML(page.subtitle)}</div>
      </div>
      <div class="usage-grid">${cards}</div>
    </div>`;
}

function sentencesHTML(page, level, showAll) {
  const LEVELS = ['ALL', ...(window.JLPT_LEVELS || ['N5','N4','N3','N2','N1'])];
  const filtered = page.items.filter(s => level === 'ALL' || s.level === level);
  const INITIAL = 5;
  const visible = showAll ? filtered : filtered.slice(0, INITIAL);
  const hidden = filtered.length - visible.length;

  const levelPills = LEVELS.map(L => `
    <button class="pill ${level === L ? 'active' : ''}" data-level="${L}">${L === 'ALL' ? 'all' : L}</button>`
  ).join('');

  const rows = visible.map(s => `
    <div class="sentence">
      <span class="level-tag">${s.level}</span>
      <div class="body">
        <div class="ja">${jaSentenceHTML(s.ja)}</div>
        <div class="en">${escHTML(s.en)}</div>
      </div>
      <button class="icon-btn audio" title="play audio">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      </button>
    </div>`).join('');

  const emptyState = visible.length === 0
    ? `<div class="empty-state">no sentences at ${escHTML(level)} yet — try another level</div>` : '';
  const showMoreBtn = hidden > 0 && !showAll
    ? `<div style="text-align:center;margin-top:20px"><button class="btn ghost" data-show-more>see ${hidden} more ↓</button></div>` : '';
  const collapseBtn = showAll && filtered.length > INITIAL
    ? `<div style="text-align:center;margin-top:20px"><button class="btn ghost" data-collapse>collapse ↑</button></div>` : '';

  return `
    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;margin-bottom:18px">
        <div>
          <h2 style="font-family:var(--serif-jp);font-size:26px;color:var(--ink);margin:0;font-weight:600">${escHTML(page.title)}</h2>
          <div style="font-family:var(--serif);font-style:italic;font-size:14px;color:var(--ink-3);margin-top:4px">${escHTML(page.subtitle)}</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <span class="small-label">level:</span>
          ${levelPills}
        </div>
      </div>
      <div class="sentences">${emptyState}${rows}</div>
      ${showMoreBtn}${collapseBtn}
    </div>`;
}

function attachSentencesEvents(container, page) {
  let level = 'ALL', showAll = false;
  function rerender() {
    container.innerHTML = sentencesHTML(page, level, showAll);
    attachSentencesEvents(container, page);
  }
  container.querySelectorAll('[data-level]').forEach(btn => {
    btn.addEventListener('click', () => { level = btn.dataset.level; showAll = false; rerender(); });
  });
  const more = container.querySelector('[data-show-more]');
  if (more) more.addEventListener('click', () => { showAll = true; rerender(); });
  const collapse = container.querySelector('[data-collapse]');
  if (collapse) collapse.addEventListener('click', () => { showAll = false; rerender(); });
}
