  .ss-blk.ss-part.ss-h-no   { background: var(--pc-no);   filter: drop-shadow(0 3px 0 #872732); }
  .ss-blk.ss-part.ss-h-to   { background: var(--pc-to);   filter: drop-shadow(0 3px 0 #1c3e66); }
  .ss-blk.ss-part.ss-h-mo   { background: var(--pc-mo);   filter: drop-shadow(0 3px 0 #482664); }
  .ss-blk.ss-part.ss-h-kara { background: var(--pc-kara); filter: drop-shadow(0 3px 0 #6e305f); }
  .ss-blk.ss-part.ss-h-made { background: var(--pc-made); filter: drop-shadow(0 3px 0 #275660); }
  .ss-blk.ss-part.ss-h-ya   { background: var(--pc-ya);   filter: drop-shadow(0 3px 0 #5d4420); }

  /* ─── built sentence row ───────────────────────────────────────────── */
  .ss-sentence-build {
    background: linear-gradient(180deg, #2e261e, #1a140e);
    border-radius: 12px;
    padding: 28px clamp(16px, 3vw, 32px);
    position: relative;
    overflow: hidden;
    margin-top: 18px;
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,0.04),
      0 8px 30px rgba(58,40,24,0.30);
  }
  .ss-sentence-build::before {
    content: "";
    position: absolute; inset: 0;
    background-image:
      radial-gradient(circle at 12% 20%, rgba(212,136,74,0.06), transparent 40%),
      radial-gradient(circle at 88% 80%, rgba(143,108,156,0.05), transparent 40%);
    pointer-events: none;
  }
  .ss-sentence-build > * { position: relative; z-index: 1; }
  .ss-sentence-en {
    font-family: var(--serif); font-style: italic;
    color: rgba(255,255,255,0.65);
    font-size: 17px;
    text-align: center;
    margin: 0 0 16px;
    letter-spacing: 0.02em;
  }
  .ss-sentence-jp-text {
    font-family: var(--sans-jp); font-weight: 900;
    font-size: clamp(20px, 2.6vw, 30px);
    color: #fff;
    text-align: center;
    line-height: 1.2;
    margin: 0 0 16px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .ss-sentence-jp-text .ss-w-noun   { color: var(--block-noun); }
  .ss-sentence-jp-text .ss-w-verb   { color: var(--block-verb); }
  .ss-sentence-jp-text .ss-w-part   { color: var(--block-part); }
  .ss-sentence-jp-text .ss-w-stop   { color: var(--block-stop); }
  .ss-sentence-jp-text .ss-w-h-wa   { color: var(--pc-wa); }
  .ss-sentence-jp-text .ss-w-h-ga   { color: var(--pc-ga); }
  .ss-sentence-jp-text .ss-w-h-o    { color: #b287d6; }
  .ss-sentence-jp-text .ss-w-h-ni   { color: #74b187; }
  .ss-sentence-jp-text .ss-w-h-no   { color: var(--pc-no); }
  .ss-sentence-jp-text .ss-w-h-to   { color: #6a9bce; }
  .ss-sentence-jp-text .ss-w-h-mo   { color: #a87fc4; }

  .ss-blocks-row {
    display: flex; align-items: center; justify-content: center;
    gap: 0;
    flex-wrap: wrap;
    row-gap: 14px;
    margin-top: 14px;
    padding: 0 var(--chev);
  }
  .ss-blocks-row .ss-blk { margin: 0; }
  .ss-blocks-row .ss-blk + .ss-blk { margin-left: calc(-1 * var(--chev)); }
  .ss-blocks-row .ss-blk.ss-part { z-index: 1; }
  /* First arrow block in a row should have a flat left edge instead of a notch */
  .ss-blocks-row > .ss-blk.ss-noun:first-child {
    clip-path: polygon(0 0, 100% 0, calc(100% - var(--chev)) 50%, 100% 100%, 0 100%);
    padding-left: 22px;
  }
  .ss-blocks-row > .ss-blk.ss-verb:first-child {
    clip-path: polygon(0 0, calc(100% - var(--chev)) 0, 100% 50%, calc(100% - var(--chev)) 100%, 0 100%);
    padding-left: 22px;
  }

  .ss-breakdown {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 10px;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px dashed rgba(255,255,255,0.12);
  }
  .ss-breakdown .ss-bd {
    display: flex; flex-direction: column; gap: 2px;
    font-family: var(--serif); font-size: 13px;
    color: rgba(255,255,255,0.6);
    line-height: 1.3;
  }
  .ss-breakdown .ss-bd .ss-jp {
    font-family: var(--sans-jp); font-weight: 700;
    font-size: 15px;
    color: rgba(255,255,255,0.92);
    letter-spacing: 0.02em;
  }
  .ss-breakdown .ss-bd .ss-role {
    font-family: var(--serif); font-style: italic;
    font-size: 12px;
    color: rgba(255,255,255,0.5);
  }
  .ss-breakdown .ss-bd.ss-w-noun .ss-jp { color: var(--block-noun); }
  .ss-breakdown .ss-bd.ss-w-verb .ss-jp { color: var(--block-verb); }
  .ss-breakdown .ss-bd.ss-w-part .ss-jp { color: var(--block-part); }
  .ss-breakdown .ss-bd.ss-w-stop .ss-jp { color: var(--block-stop); }

  /* ─── flexible order grid ──────────────────────────────────────────── */
  .ss-reorder-list {
    display: flex; flex-direction: column;
    gap: 14px;
    margin-top: 12px;
  }
  .ss-reorder-row {
    background: var(--paper-2);
    border: 1px solid rgba(141,102,48,0.22);
    border-radius: 10px;
    padding: 16px 18px;
    display: grid;
    grid-template-columns: 150px 1fr;
    gap: 18px;
    align-items: center;
  }
  @media (max-width: 600px) {
    .ss-reorder-row { grid-template-columns: 1fr; }
  }
  .ss-reorder-row .ss-nuance {
    font-family: var(--serif); font-style: italic;
    color: var(--ink-3); font-size: 13px;
    line-height: 1.4;
  }
  .ss-reorder-row .ss-nuance b {
    font-family: var(--serif); font-style: normal; font-weight: 600;
    color: var(--gold-dark); display: block;
    font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase;
    margin-bottom: 3px;
    white-space: nowrap;
  }
  .ss-reorder-row .ss-jp-line {
    font-family: var(--serif-jp); font-weight: 500;
    font-size: 19px;
    color: var(--ink); line-height: 1.6;
    letter-spacing: 0.02em;
  }
  .ss-reorder-row .ss-jp-line .ss-pc { font-weight: 700; }
  .ss-reorder-row .ss-jp-line .ss-pc.ss-wa   { color: var(--pc-wa); }
  .ss-reorder-row .ss-jp-line .ss-pc.ss-ga   { color: var(--pc-ga); }
  .ss-reorder-row .ss-jp-line .ss-pc.ss-o    { color: var(--pc-o);  }
  .ss-reorder-row .ss-jp-line .ss-pc.ss-ni   { color: var(--pc-ni); }
  .ss-reorder-row .ss-jp-line .ss-pc.ss-de   { color: var(--pc-de); }
  .ss-reorder-row .ss-jp-line .ss-pc.ss-no   { color: var(--pc-no); }
  .ss-reorder-row .ss-jp-line .ss-pc.ss-to   { color: var(--pc-to); }
  .ss-reorder-row .ss-jp-line .ss-pc.ss-kara { color: var(--pc-kara); }
  .ss-reorder-row .ss-jp-line .ss-pc.ss-made { color: var(--pc-made); }
  .ss-reorder-row .ss-jp-line .ss-verb-u { border-bottom: 2px solid var(--block-verb); padding-bottom: 1px; }
  .ss-reorder-row .ss-jp-line .ss-trans {
    font-family: var(--serif); font-style: italic; font-size: 13px;
    color: var(--ink-3); margin-top: 4px;
  }

  /* ─── rule pills (the two rules) ───────────────────────────────────── */
  .ss-rules-two {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    margin-top: 12px;
  }
  @media (max-width: 600px) { .ss-rules-two { grid-template-columns: 1fr; } }
  .ss-rule-pill {
    position: relative;
    background: var(--paper-2);
    border-radius: 10px;
    border: 1px solid rgba(141,102,48,0.22);
    padding: 22px 22px 22px 70px;
    overflow: hidden;
  }
  .ss-rule-pill .ss-num {
    position: absolute; left: 18px; top: 22px;
    width: 38px; height: 38px;
    border-radius: 50%;
    background: var(--gold);
    color: #fff;
    font-family: var(--serif-jp); font-weight: 700;
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 0 var(--gold-dark);
  }
  .ss-rule-pill h4 {
    font-family: var(--serif-jp); font-weight: 700;
    font-size: 16px; color: var(--ink);
    margin: 0 0 6px;
  }
  .ss-rule-pill p {
    font-family: var(--serif); font-size: 14px;
    color: var(--ink-2); line-height: 1.55;
    margin: 0;
  }
  .ss-rule-pill p b { color: var(--ink); font-weight: 600; }

  /* ─── confusing pairs ───────────────────────────────────────────────── */
  .ss-pairs {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 18px;
    margin-top: 18px;
  }
  .ss-pair {
    background: var(--paper-2);
    border: 1px solid rgba(141,102,48,0.22);
    border-radius: 10px;
    padding: 20px;
  }
  .ss-pair-head {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 14px;
    font-family: var(--serif); font-style: italic;
    color: var(--ink-3); font-size: 14px;
  }
  .ss-pair-chip {
    width: 52px; height: 52px;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--serif-jp); font-weight: 700;
    font-size: 22px;
    background: var(--ss-pc-bg, var(--block-part));
    color: #fff;
    border-radius: 50%;
    text-shadow: 0 1px 2px rgba(0,0,0,0.4), 0 0 6px rgba(0,0,0,0.25);
  }
  .ss-pair-chip.ss-wa { --ss-pc-bg: var(--pc-wa); }
  .ss-pair-chip.ss-ga { --ss-pc-bg: var(--pc-ga); }
  .ss-pair-chip.ss-o  { --ss-pc-bg: var(--pc-o);  }
  .ss-pair-chip.ss-ni { --ss-pc-bg: var(--pc-ni); }
  .ss-pair-chip.ss-de { --ss-pc-bg: var(--pc-de); }
  .ss-pair-chip.ss-e  { --ss-pc-bg: var(--pc-e);  }
  .ss-pair-vs {
    font-family: var(--serif); font-style: italic;
    color: var(--ink-3); font-size: 14px;
  }
  .ss-pair-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }
  .ss-pair-col h5 {
    font-family: var(--serif); font-weight: 600;
    font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-3); margin: 0 0 6px;
  }
  .ss-pair-col p {
    font-family: var(--serif); font-size: 14px;
    color: var(--ink-2); line-height: 1.5;
    margin: 0 0 8px;
  }
  .ss-pair-col p b { color: var(--ink); font-weight: 600; }
  .ss-pair-ex {
    font-family: var(--serif-jp); font-size: 15px;
    color: var(--ink);
    background: var(--paper);
    border-radius: 6px;
    padding: 6px 10px;
    border-left: 2px solid var(--gold-soft);
    margin-bottom: 4px;
  }
  .ss-pair-ex .ss-pc { font-weight: 700; }
  .ss-pair-ex .ss-pc.ss-wa { color: var(--pc-wa); }
  .ss-pair-ex .ss-pc.ss-ga { color: var(--pc-ga); }
  .ss-pair-ex .ss-pc.ss-ni { color: var(--pc-ni); }
  .ss-pair-ex .ss-pc.ss-de { color: var(--pc-de); }
  .ss-pair-ex .ss-pc.ss-e  { color: var(--pc-e); }
  .ss-pair-ex .ss-en {
    display: block;
    font-family: var(--serif); font-style: italic;
    color: var(--ink-3); font-size: 12px;
    margin-top: 2px;
  }

  /* ─── inline kana marker (for body text references) ──────────────── */
  .ss-pmark {
    display: inline-flex; align-items: center; justify-content: center;
    width: 1.8em; height: 1.8em;
    margin: 0 0.1em;
    vertical-align: middle;
    font-family: var(--serif-jp); font-weight: 700;
    background: var(--ss-pc-bg, var(--block-part));
    color: #fff;
    border-radius: 50%;
    line-height: 1;
    text-shadow: 0 1px 2px rgba(0,0,0,0.4), 0 0 4px rgba(0,0,0,0.25);
  }
  .ss-pmark.ss-wa   { --ss-pc-bg: var(--pc-wa); }
  .ss-pmark.ss-ga   { --ss-pc-bg: var(--pc-ga); }
  .ss-pmark.ss-o    { --ss-pc-bg: var(--pc-o);  }
  .ss-pmark.ss-ni   { --ss-pc-bg: var(--pc-ni); }
  .ss-pmark.ss-de   { --ss-pc-bg: var(--pc-de); }
  .ss-pmark.ss-e    { --ss-pc-bg: var(--pc-e);  }
  .ss-pmark.ss-no   { --ss-pc-bg: var(--pc-no); }
  .ss-pmark.ss-to   { --ss-pc-bg: var(--pc-to); }
  .ss-pmark.ss-mo   { --ss-pc-bg: var(--pc-mo); }
  .ss-pmark.ss-kara { --ss-pc-bg: var(--pc-kara); width: 2.4em; font-size: 0.85em; }
  .ss-pmark.ss-made { --ss-pc-bg: var(--pc-made); width: 2.4em; font-size: 0.85em; }
  .ss-pmark.ss-ya   { --ss-pc-bg: var(--pc-ya); }

  /* ─── footnote paragraphs ──────────────────────────────────────────── */
  .ss-footnote {
    font-family: var(--serif); font-style: italic; font-size: 14px;
    color: var(--ink-3);
    margin-top: 18px;
    max-width: 64ch;
    line-height: 1.5;
  }
  .ss-footnote i { color: var(--ink-2); }

  /* ─── final call-to-action ──────────────────────────────────────────── */
  .ss-end-cta {
    text-align: center;
    padding: 32px 24px;
    margin-top: 20px;
    background:
      radial-gradient(circle at 50% 0%, rgba(180,138,74,0.10), transparent 70%),
      var(--paper-2);
    border-radius: 10px;
    border: 1px solid rgba(141,102,48,0.22);
  }
  .ss-end-cta h3 {
    font-family: var(--serif-jp); font-weight: 600;
    font-size: 22px; margin: 0 0 8px;
    color: var(--ink);
  }
  .ss-end-cta p {
    font-family: var(--serif); font-style: italic;
    color: var(--ink-2); font-size: 15px;
    margin: 0 0 16px;
  }
  .ss-btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .ss-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 22px; border-radius: 8px;
    background: var(--gold); color: white;
    border: 1px solid var(--gold-dark);
    font-family: var(--serif); font-size: 14px;
    text-decoration: none;
    transition: all .15s;
    box-shadow: 0 3px 0 var(--gold-dark);
    cursor: pointer;
  }
  .ss-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 0 var(--gold-dark); }
  .ss-btn.ss-ghost {
    background: transparent;
    color: var(--ink-2);
    border: 1px dashed rgba(141,102,48,0.4);
    box-shadow: none;
  }
  .ss-btn.ss-ghost:hover { background: rgba(180,138,74,0.10); box-shadow: none; transform: none; }

  /* ───────────────────────────────────────────────────────────────────
     Days & Time page — last basics page. Visual language mixes the
     numbered sections from sentence-structure (large kanji numerals
     anchoring each section head) with the badge-and-table chrome
     from numbers. Page-local tokens at the top so future tweaks land
     in one place.
     ──────────────────────────────────────────────────────────────── */
  .dt-page {
    --dt-paper:        var(--paper);
    --dt-paper-2:      var(--paper-2);
    --dt-ink:          var(--ink);
    --dt-ink-2:        var(--ink-2);
    --dt-ink-3:        var(--ink-3);
    --dt-gold:         var(--gold);
    --dt-gold-soft:    var(--gold-soft);
    --dt-gold-dark:    var(--gold-dark);
    /* Element accents — one hue per elemental kanji. Subtle, all in
       the same paper/ink family, so the grid reads as a series and
       not a rainbow. */
    --dt-elem-sun:     #c97a2c;
    --dt-elem-moon:    #6f7a94;
    --dt-elem-fire:    #b04a3a;
    --dt-elem-water:   #3a7a94;
    --dt-elem-wood:    #4a7a4a;
    --dt-elem-metal:   #a07a2a;
    --dt-elem-earth:   #8a6a4a;
  }

  /* ─── section chrome — no kanji-numeral chips, just title + lede ───
     Earlier versions had a circular kanji-numeral chip (一 / 二 / 三)
     leading each section. Dropped because three sections don't need
     ceremonial numbering — the title and lede do the work, and the
     left-margin was eating horizontal space the day grid needed for
     all 7 cards. */
  .dt-section { margin-bottom: 56px; }
  .dt-section-head {
    display: flex;
    align-items: flex-start;
    gap: 18px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }
  .dt-section-title {
    margin: 0;
    font-family: var(--font-title);
    font-size: clamp(22px, 2.4vw, 28px);
    font-weight: 600;
    color: var(--dt-ink);
    letter-spacing: -0.005em;
    line-height: 1.15;
    flex: 1;
    min-width: 240px;
  }
  .dt-section-title em {
    display: block;
    margin-top: 4px;
    font-family: var(--serif);
    font-style: italic;
    font-size: 14px;
    font-weight: 400;
    color: var(--dt-ink-3);
    letter-spacing: 0.01em;
  }
  .dt-section-lede {
    flex-basis: 100%;
    margin: 0;
    font-family: var(--serif);
    font-size: 15px;
    line-height: 1.6;
    color: var(--dt-ink-2);
  }
  .dt-section-lede b { color: var(--dt-ink); font-weight: 600; }
  .dt-section-footnote {
    margin: 14px 0 0;
    font-family: var(--serif);
    font-style: italic;
    font-size: 13px;
    color: var(--dt-ink-3);
    line-height: 1.55;
  }
  .dt-section-footnote .ja {
    font-style: normal;
    font-family: var(--serif-jp);
    color: var(--dt-ink-2);
  }
  .dt-section-footnote b { color: var(--dt-ink); font-weight: 600; }

  /* ─── block labels — replace what was .dt-card-eyebrow ─────────────
     The page used to wrap each content chunk in a paper card with an
     eyebrow label. Distillation pass dropped the cards; the label
     survives as a subhead sitting directly on the page background. */
  .dt-block-label {
    margin: 24px 0 12px;
    padding-bottom: 8px;
    border-bottom: 1px dashed rgba(141,102,48,0.25);
    font-family: var(--serif);
    font-style: italic;
    font-size: 13px;
    color: var(--dt-ink-3);
    letter-spacing: 0.04em;
  }
  .dt-block-label .ja {
    font-style: normal;
    font-family: var(--serif-jp);
    color: var(--dt-ink-2);
    font-weight: 600;
  }

  /* ─── 一. Days of the week — image-first, 7 across ──────────────────
     Image takes the top slot (1:1 frame); body below carries the
     compound kanji, kana, and a small elemental + EN meta line.
     The per-day element-accent stripe moves OFF the card (the image
     now does the visual identification work) — we keep an
     elemental color on the small "日" inline glyph so the variety
     still threads through the row. */
  .dt-day-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
  }
  .dt-day-card {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 8px;
    background: var(--dt-paper);
    /* Explicit 1px border on ALL sides — earlier iterations of this
       page used a colored border-top stripe per row that fought the
       images for visual primacy. Forcing the border declaration here
       makes sure no leftover stripe survives a partial CSS cache. */
    border: 1px solid var(--paper-edge);
    border-top-width: 1px;
    border-radius: 8px;
    text-align: center;
    transition: border-color .15s, box-shadow .15s, transform .15s;
    min-width: 0;
  }
  .dt-day-card:hover {
    border-color: var(--dt-gold-soft);
    box-shadow: 0 4px 12px rgba(141,102,48,0.10);
    transform: translateY(-1px);
  }
  /* Color the inline elemental glyph per-row via nth-child. The image
     itself carries the day's primary visual identity; the elemental
     hue is a quiet thread under it, not a competing stripe. */
  .dt-day-card:nth-child(1) { --dt-elem: var(--dt-elem-sun); }
  .dt-day-card:nth-child(2) { --dt-elem: var(--dt-elem-moon); }
  .dt-day-card:nth-child(3) { --dt-elem: var(--dt-elem-fire); }
  .dt-day-card:nth-child(4) { --dt-elem: var(--dt-elem-water); }
  .dt-day-card:nth-child(5) { --dt-elem: var(--dt-elem-wood); }
  .dt-day-card:nth-child(6) { --dt-elem: var(--dt-elem-metal); }
  .dt-day-card:nth-child(7) { --dt-elem: var(--dt-elem-earth); }
  .dt-day-image {
    aspect-ratio: 1 / 1;
    width: 100%;
    background: var(--dt-paper-2);
    border-radius: 6px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .dt-day-image image-slot {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 6px;
  }
  .dt-day-image image-slot::part(img),
  .dt-day-image image-slot::part(frame) {
    border-radius: 6px;
  }
  .dt-day-body {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 4px 0;
    min-width: 0;
  }
  .dt-day-ja {
    font-family: var(--serif-jp);
    font-weight: 600;
    font-size: 16px;
    color: var(--dt-ink);
    line-height: 1.05;
    letter-spacing: -0.01em;
  }
  .dt-day-kana {
    font-family: var(--serif-jp);
    font-size: 11px;
    color: var(--dt-ink-3);
    letter-spacing: 0.01em;
    line-height: 1.2;
  }
  .dt-day-meta {
    margin-top: 4px;
    display: inline-flex;
    align-items: baseline;
    gap: 5px;
    font-family: var(--font-title);
    font-size: 11px;
    color: var(--dt-ink-2);
    line-height: 1.2;
  }
  .dt-day-elem {
    font-family: var(--serif-jp);
    font-weight: 700;
    font-size: 13px;
    color: var(--dt-elem, var(--dt-ink));
    line-height: 1;
  }
  .dt-day-sep {
    color: var(--dt-ink-4, var(--dt-ink-3));
    font-weight: 400;
  }
  .dt-day-en {
    font-weight: 600;
  }
  /* Below the desktop-wide breakpoint, fall back to a wrapping grid
     since 7 narrow cards become unreadable. 4 then 2 at the smallest. */
  @media (max-width: 980px) {
    .dt-day-grid { grid-template-columns: repeat(4, 1fr); }
  }
  @media (max-width: 560px) {
    .dt-day-grid { grid-template-columns: repeat(2, 1fr); }
  }

  /* Subsection title — used inside Section 1 to introduce the
     months subsection (the formula card + irregulars below it).
     Mirrors the section-title family but at a lower hierarchy
     level so it reads as "section heading"-style, not as a peer
     of the H2. */
  .dt-subsection-title {
    margin: 36px 0 12px;
    font-family: var(--font-title);
    font-size: clamp(18px, 2vw, 22px);
    font-weight: 600;
    color: var(--dt-ink);
    letter-spacing: -0.005em;
    line-height: 1.2;
  }
  .dt-subsection-title em {
    display: block;
    margin-top: 3px;
    font-family: var(--serif);
    font-style: italic;
    font-size: 13px;
    font-weight: 400;
    color: var(--dt-ink-3);
    letter-spacing: 0.02em;
  }

  /* ─── 曜 construction diagram ──────────────────────────────────────
     Visual equation primes the day grid: [elemental kanji] + [曜
     image] + [日] = day name. The image of 曜 anchors the centerpiece
     so the unfamiliar character has a face attached to it; the seven
     elementals on the left visually communicate "any one of these."
     Squint test reads as four blocks connected by operators (+ + = )
     — clean four-beat rhythm. */
  .dt-yo-build {
    display: grid;
    grid-template-columns: 1.2fr auto 1.3fr auto 0.7fr auto 1.2fr;
    gap: 8px;
    align-items: center;
    padding: 22px;
    margin-bottom: 14px;
    background: var(--dt-paper);
    border: 1px solid var(--paper-edge);
    border-radius: 8px;
    box-shadow: 0 2px 10px rgba(141,102,48,0.06);
  }
  .dt-yo-build-plus,
  .dt-yo-build-eq {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(20px, 2.6vw, 28px);
    color: var(--dt-gold-dark);
    text-align: center;
    user-select: none;
  }
  /* Slot — the swap-position holding all 7 elementals stacked as a
     vertical chip column. Communicates "any of these slots in here." */
  .dt-yo-build-slot,
  .dt-yo-build-yo,
  .dt-yo-build-day,
  .dt-yo-build-result {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  .dt-yo-build-slot-eyebrow,
  .dt-yo-build-yo-eyebrow,
  .dt-yo-build-day-eyebrow,
  .dt-yo-build-result-eyebrow {
    font-family: var(--serif);
    font-style: italic;
    font-size: 11px;
    color: var(--dt-ink-3);
    letter-spacing: 0.05em;
  }
  .dt-yo-build-elements {
    display: grid;
    grid-template-columns: repeat(4, auto);
    gap: 3px;
    padding: 8px;
    background: var(--dt-paper-2);
    border: 1.5px dashed var(--dt-gold-soft);
    border-radius: 8px;
  }
  .dt-yo-build-elem {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px; height: 26px;
    font-family: var(--serif-jp);
    font-weight: 700;
    font-size: 16px;
    color: var(--dt-elem, var(--dt-ink));
    line-height: 1;
  }
  .dt-yo-build-slot-label,
  .dt-yo-build-yo-label,
  .dt-yo-build-day-label,
  .dt-yo-build-result-ex {
    font-family: var(--serif);
    font-style: italic;
    font-size: 11px;
    color: var(--dt-ink-3);
    text-align: center;
  }
  .dt-yo-build-yo-label .ja,
  .dt-yo-build-day-label .ja,
  .dt-yo-build-result-ex .ja {
    font-style: normal;
    font-family: var(--serif-jp);
    color: var(--dt-ink-2);
  }
  /* The 曜 image — the centerpiece of the equation. Larger than the
     surrounding tiles since this is the kanji the learner doesn't
     yet know by sight. */
  .dt-yo-build-yo-image {
    width: 96px; height: 96px;
    background: var(--dt-paper-2);
    border: 1px solid var(--paper-edge);
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .dt-yo-build-yo-image image-slot {
    width: 100%; height: 100%;
    display: block;
    border-radius: 8px;
  }
  .dt-yo-build-yo-image image-slot::part(img),
  .dt-yo-build-yo-image image-slot::part(frame) {
    border-radius: 8px;
  }
  /* Closing 日 — sits as a single kanji chip, smaller than the 曜
     centerpiece but heavier than the slot of elementals. */
  .dt-yo-build-day-glyph {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 54px; height: 54px;
    background: var(--dt-paper-2);
    border: 1px solid var(--paper-edge);
    border-radius: 8px;
    font-family: var(--serif-jp);
    font-weight: 700;
    font-size: 32px;
    color: var(--dt-ink);
    line-height: 1;
  }
  /* Result — the final compound. The "X" slot is dashed-gold like
     the formula card's N slot; the 曜日 tail is solid ink. */
  .dt-yo-build-result-formula {
    display: inline-flex;
    align-items: baseline;
    gap: 2px;
    padding: 8px 10px;
    background: var(--dt-paper-2);
    border-radius: 8px;
  }
  .dt-yo-build-result-slot {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 26px;
    padding: 2px 6px;
    background: var(--dt-paper);
    border: 1.5px dashed var(--dt-gold-soft);
    border-radius: 4px;
    font-family: var(--serif);
    font-style: italic;
    font-weight: 600;
    font-size: 18px;
    color: var(--dt-gold-dark);
    line-height: 1;
  }
  .dt-yo-build-result-tail {
    font-family: var(--serif-jp);
    font-weight: 700;
    font-size: 24px;
    color: var(--dt-ink);
    line-height: 1;
  }
  .dt-yo-build-explain {
    margin: 0 0 32px;
    font-family: var(--serif);
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--dt-ink-3);
    font-style: italic;
  }
  .dt-yo-build-explain .ja {
    font-style: normal;
    font-family: var(--serif-jp);
    color: var(--dt-ink-2);
  }
  /* Mobile collapse — the 7-block diagram becomes too narrow on
     small screens. Stack the parts and use a thin dashed line
     between them instead of the +/= operators (which would float
     awkwardly mid-stack). */
  @media (max-width: 760px) {
    .dt-yo-build {
      grid-template-columns: 1fr;
      gap: 14px;
      padding: 18px 16px;
    }
    .dt-yo-build-plus,
    .dt-yo-build-eq {
      font-size: 18px;
    }
  }

  /* ─── 月 — formula card + three exceptions ───────────────────────
     Replaced the 12-cell grid (pattern-as-data default) with a
     two-part treatment: the rule as a visual equation on top,
     the three exceptions as larger highlighted cards below.
     The squint test should read "rule → exceptions" — two beats,
     not twelve. */
  .dt-month-formula-card {
    margin-bottom: 24px;
    padding: 24px 28px;
    background: var(--dt-paper);
    border: 1px solid var(--paper-edge);
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(141,102,48,0.06);
  }
  .dt-month-formula {
    display: flex;
    align-items: baseline;
    justify-content: center;
    flex-wrap: wrap;
    gap: 6px 12px;
    padding: 16px 0 18px;
    font-family: var(--serif-jp);
    color: var(--dt-ink);
    line-height: 1;
  }
  .dt-month-formula-n {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 38px;
    padding: 6px 10px;
    background: var(--dt-paper-2);
    border: 1.5px dashed var(--dt-gold-soft);
    border-radius: 6px;
    font-family: var(--serif);
    font-style: italic;
    font-weight: 600;
    font-size: 22px;
    color: var(--dt-gold-dark);
    line-height: 1;
  }
  .dt-month-formula-glyph {
    font-weight: 700;
    font-size: clamp(32px, 4vw, 44px);
    color: var(--dt-ink);
  }
  .dt-month-formula-eq {
    margin: 0 6px;
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(28px, 3.5vw, 36px);
    color: var(--dt-gold-dark);
  }
  .dt-month-formula-suffix {
    font-weight: 600;
    font-size: clamp(22px, 2.8vw, 28px);
    color: var(--dt-ink);
  }
  .dt-month-formula-explain {
    margin: 0;
    padding-top: 14px;
    border-top: 1px dashed rgba(141,102,48,0.25);
    text-align: center;
    font-family: var(--serif);
    font-size: 14px;
    line-height: 1.7;
    color: var(--dt-ink-2);
  }
  .dt-month-formula-explain b { color: var(--dt-ink); font-weight: 600; }
  .dt-month-formula-explain .ja {
    font-family: var(--serif-jp);
    color: var(--dt-ink);
  }
  /* Examples sub-line — sits on its own row below the rule sentence.
     Smaller and slightly more spaced so it reads as "here's the
     pattern in action," not as a continuation of the rule. */
  .dt-month-formula-examples {
    display: inline-block;
    margin-top: 6px;
    font-size: 13px;
    color: var(--dt-ink-3);
    letter-spacing: 0.01em;
  }
  .dt-month-formula-examples .ja {
    color: var(--dt-ink-2);
  }

  .dt-month-irr-label {
    margin: 24px 0 12px;
    font-family: var(--serif);
    font-size: 13px;
    color: var(--dt-ink-2);
    letter-spacing: 0.04em;
    font-weight: 600;
  }
  .dt-month-irr-label em {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 400;
    color: var(--dt-ink-3);
  }
  .dt-month-irr-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .dt-month-irr-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 18px 12px 14px;
    background: linear-gradient(180deg, var(--dt-paper) 0%, rgba(180,138,74,0.08) 100%);
    border: 1.5px solid var(--dt-gold);
    border-radius: 8px;
    text-align: center;
  }
  .dt-month-irr-glyph {
    font-family: var(--serif-jp);
    font-weight: 700;
    font-size: 36px;
    color: var(--dt-gold-dark);
    line-height: 1;
  }
  .dt-month-irr-kana {
    font-family: var(--serif-jp);
    font-weight: 600;
    font-size: 18px;
    color: var(--dt-gold-dark);
    margin-top: 2px;
  }
  .dt-month-irr-en {
    font-family: var(--serif);
    font-style: italic;
    font-size: 13px;
    color: var(--dt-ink-3);
  }
  .dt-month-irr-wrong {
    margin-top: 6px;
    padding-top: 8px;
    border-top: 1px dashed rgba(141,102,48,0.3);
    width: 100%;
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 6px;
    font-size: 12px;
  }
  .dt-month-irr-x {
    font-family: var(--serif);
    font-style: italic;
    color: var(--dt-ink-3);
    text-decoration: line-through;
    text-decoration-color: var(--dt-ink-4, var(--dt-ink-3));
  }
  .dt-month-irr-wrong .ja {
    font-family: var(--serif-jp);
    color: var(--dt-ink-3);
    text-decoration: line-through;
    text-decoration-color: var(--dt-ink-3);
  }
  .dt-month-footnote {
    margin: 12px 0 0;
    font-family: var(--serif);
    font-style: italic;
    font-size: 13px;
    color: var(--dt-ink-3);
    line-height: 1.55;
  }
  .dt-month-footnote .ja {
    font-style: normal;
    font-family: var(--serif-jp);
    color: var(--dt-ink-2);
  }
  @media (max-width: 720px) {
    .dt-month-formula-card { padding: 18px 16px; }
    .dt-month-irr-grid { grid-template-columns: 1fr; }
  }

  /* ─── 二. Reading dates — three neutral stamps + dl rules ────────────
     Stamps lead with the 年/月/日 marker (the LESSON), the numeral
     sits below as data. No colored top-stripes — the colors didn't
     mean anything and read as decorative KPI-card chrome. Rules are
     a definition list flowing on the page background, no boxes. */
  .dt-date-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 16px;
  }
  .dt-date-stamp {
    background: var(--dt-paper-2);
    border-radius: 8px;
    padding: 20px 16px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .dt-date-marker {
    font-family: var(--serif-jp);
    font-weight: 700;
    font-size: clamp(40px, 5vw, 56px);
    color: var(--dt-ink);
    line-height: 1;
  }
  .dt-date-num {
    font-family: var(--serif);
    font-size: clamp(22px, 3vw, 32px);
    font-weight: 400;
    color: var(--dt-ink-2);
    line-height: 1;
    font-feature-settings: 'tnum' 1;
  }
  .dt-date-label {
    margin-top: 6px;
    font-family: var(--serif);
    font-style: italic;
    font-size: 12px;
    color: var(--dt-ink-3);
    letter-spacing: 0.04em;
  }
  .dt-date-translation {
    display: flex;
    align-items: baseline;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px 24px;
    padding: 12px 0;
    margin-bottom: 24px;
    border-bottom: 1px dashed rgba(141,102,48,0.25);
  }
  .dt-date-trans-ja {
    font-family: var(--serif-jp);
    font-size: 18px;
    color: var(--dt-ink);
    letter-spacing: 0.02em;
  }
  .dt-date-trans-en {
    font-family: var(--serif);
    font-style: italic;
    font-size: 15px;
    color: var(--dt-ink-3);
  }
  /* Definition list — no boxes, no accent borders, just flowing text.
     dt holds the marker + kana; dd holds the explanation. */
  .dt-date-rules {
    margin: 0;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 8px 24px;
    align-items: baseline;
  }
  .dt-date-rules dt {
    display: flex;
    align-items: baseline;
    gap: 10px;
    font-family: var(--serif-jp);
    color: var(--dt-ink);
    padding-top: 2px;
  }
  .dt-date-rule-marker {
    font-weight: 700;
    font-size: 22px;
    line-height: 1;
    color: var(--dt-ink);
  }
  .dt-date-rule-kana {
    font-size: 13px;
    color: var(--dt-ink-3);
    letter-spacing: 0.04em;
  }
  .dt-date-rules dd {
    margin: 0;
    font-family: var(--serif);
    font-size: 14px;
    line-height: 1.55;
    color: var(--dt-ink-2);
  }
  .dt-date-rules dd .ja {
    font-family: var(--serif-jp);
    color: var(--dt-ink);
  }

  /* ─── 三. Telling time ──────────────────────────────────────────── */
  .dt-hour-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 10px;
  }
  .dt-hour-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 10px 8px;
    background: var(--dt-paper-2);
    border: 1px solid var(--paper-edge);
    border-radius: 6px;
    position: relative;
  }
  .dt-hour-cell.is-irregular {
    border-color: var(--dt-gold);
    background: linear-gradient(180deg, var(--dt-paper-2) 0%, rgba(180,138,74,0.08) 100%);
  }
  .dt-hour-num {
    font-family: var(--serif);
    font-size: 11px;
    color: var(--dt-ink-3);
    font-feature-settings: 'tnum' 1;
  }
  .dt-hour-ja {
    font-family: var(--serif-jp);
    font-weight: 600;
    font-size: 22px;
    color: var(--dt-ink);
    line-height: 1;
  }
  .dt-hour-cell.is-irregular .dt-hour-ja { color: var(--dt-gold-dark); }
  .dt-hour-kana {
    font-family: var(--serif-jp);
    font-size: 13px;
    color: var(--dt-ink-2);
  }
  .dt-hour-cell.is-irregular .dt-hour-kana { color: var(--dt-gold-dark); font-weight: 600; }
  .dt-hour-note {
    font-family: var(--serif);
    font-style: italic;
    font-size: 10px;
    color: var(--dt-ink-3);
    margin-top: 2px;
  }
  /* Minutes */
  .dt-min-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 10px;
    margin-bottom: 16px;
  }
  .dt-min-cell {
    display: grid;
    grid-template-columns: auto 1fr auto;
    grid-template-rows: auto auto;
    gap: 2px 8px;
    align-items: center;
    padding: 10px 12px;
    background: var(--dt-paper-2);
    border: 1px solid var(--paper-edge);
    border-radius: 6px;
  }
  .dt-min-num {
    grid-row: 1;
    grid-column: 1;
    font-family: var(--serif);
    font-size: 11px;
    color: var(--dt-ink-3);
    font-feature-settings: 'tnum' 1;
  }
  .dt-min-ja {
    grid-row: 1;
    grid-column: 2;
    font-family: var(--serif-jp);
    font-weight: 600;
    font-size: 16px;
    color: var(--dt-ink);
    line-height: 1;
  }
  .dt-min-stem {
    grid-row: 1;
    grid-column: 3;
    align-self: start;
    padding: 1px 6px;
    border-radius: 3px;
    font-family: var(--serif);
    font-style: italic;
    font-size: 10px;
    letter-spacing: 0.04em;
  }
  .dt-min-stem-fun {
    background: rgba(58,122,148,0.14);
    color: #2a5b94;
  }
  .dt-min-stem-pun {
    background: rgba(176,74,58,0.14);
    color: #8a2538;
  }
  .dt-min-kana {
    grid-row: 2;
    grid-column: 1 / 3;
    font-family: var(--serif-jp);
    font-size: 12px;
    color: var(--dt-ink-2);
  }
  .dt-min-alt {
    grid-row: 2;
    grid-column: 3;
    display: inline-flex;
    align-items: baseline;
    gap: 3px;
    padding: 1px 5px;
    background: rgba(180,138,74,0.14);
    border-radius: 3px;
  }
  .dt-min-alt-ja {
    font-family: var(--serif-jp);
    font-weight: 700;
    font-size: 13px;
    color: var(--dt-gold-dark);
  }
  .dt-min-alt-kana {
    font-family: var(--serif-jp);
    font-size: 10px;
    color: var(--dt-gold-dark);
  }
  /* Minutes explanation — flowing prose paragraph, no row-list or
     paper-2 frame. The fun/pun chips inline carry the visual cue
     they had before; everything else is read normally. */
  .dt-min-explain-prose {
    margin: 12px 0 0;
    font-family: var(--serif);
    font-size: 14px;
    line-height: 1.65;
    color: var(--dt-ink-2);
  }
  .dt-min-explain-prose .ja {
    font-family: var(--serif-jp);
    color: var(--dt-ink);
  }
  .dt-min-explain-prose .dt-min-stem {
    margin: 0 4px;
    /* The chips are the same inline padding+radius from .dt-min-stem
       already — they sit nicely in flowing text without extra glue. */
  }

  /* AM / PM block — two side-by-side blocks, no divider. */
  .dt-ampm-row {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px;
    align-items: start;
    padding: 8px 0 16px;
  }
  .dt-ampm-block {
    text-align: center;
  }
  .dt-ampm-ja {
    font-family: var(--serif-jp);
    font-weight: 700;
    font-size: 32px;
    color: var(--dt-ink);
    line-height: 1;
  }
  .dt-ampm-block.dt-ampm-am .dt-ampm-ja { color: var(--dt-elem-sun); }
  .dt-ampm-block.dt-ampm-pm .dt-ampm-ja { color: var(--dt-elem-moon); }
  .dt-ampm-kana {
    font-family: var(--serif-jp);
    font-size: 14px;
    color: var(--dt-ink-3);
    margin-top: 4px;
  }
  .dt-ampm-en {
    margin-top: 6px;
    font-family: var(--font-title);
    font-weight: 600;
    font-size: 14px;
    color: var(--dt-ink-2);
  }
  .dt-ampm-footnote {
    margin: 0;
    font-family: var(--serif);
    font-style: italic;
    font-size: 13px;
    color: var(--dt-ink-3);
    line-height: 1.55;
  }
  .dt-ampm-footnote .ja {
    font-style: normal;
    font-family: var(--serif-jp);
    color: var(--dt-ink-2);
  }

  /* ─── Interactive clock ────────────────────────────────────────────
     SVG analog face on the left, numeric inputs + Japanese readout on
     the right. Two-column on desktop; stacks on mobile. The clock
     hands are SVG <line> elements with cursor:grab — the JS wiring
     in renderWritingDatetime handles drag + numeric input syncing. */
  .dt-clock-card {
    display: grid;
    grid-template-columns: minmax(220px, 280px) 1fr;
    gap: 24px;
    align-items: start;
    padding: 20px 24px;
    background: var(--dt-paper);
    border: 1px solid var(--paper-edge);
    border-radius: 8px;
    box-shadow: 0 2px 10px rgba(141,102,48,0.06);
  }
  .dt-clock-left {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .dt-clock-svg {
    width: 100%;
    max-width: 260px;
    height: auto;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .dt-clock-svg [data-clock-hand] {
    cursor: grab;
    transition: stroke .12s;
  }
  .dt-clock-svg [data-clock-hand]:hover { stroke: var(--dt-gold-dark); }
  .dt-clock-svg [data-clock-hand]:active { cursor: grabbing; }

  .dt-clock-right {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .dt-clock-inputs {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 14px;
    align-items: stretch;
  }
  .dt-clock-input-group {
    flex: 1 1 110px;
    display: grid;
    grid-template-columns: auto 1fr;
    grid-template-rows: auto auto;
    grid-template-areas:
      "glyph label"
      "input input"
      "hint  hint";
    column-gap: 8px;
    align-items: center;
    padding: 10px 12px;
    background: var(--dt-paper-2);
    border: 1px solid var(--paper-edge);
    border-radius: 6px;
    cursor: text;
    transition: border-color .12s, box-shadow .12s;
  }
  .dt-clock-input-group:focus-within {
    border-color: var(--dt-gold);
    box-shadow: 0 0 0 2px rgba(180,138,74,0.18);
  }
  .dt-clock-input-glyph {
    grid-area: glyph;
    font-family: var(--serif-jp);
    font-weight: 700;
    font-size: 20px;
    color: var(--dt-ink);
    line-height: 1;
  }
  .dt-clock-input-label {
    grid-area: label;
    font-family: var(--serif);
    font-style: italic;
    font-size: 12px;
    color: var(--dt-ink-3);
    letter-spacing: 0.04em;
  }
  .dt-clock-input-group input {
    grid-area: input;
    width: 100%;
    margin-top: 4px;
    padding: 4px 0 0;
    border: none;
    background: transparent;
    border-bottom: 2px solid var(--paper-edge);
    font-family: var(--serif);
    font-size: 28px;
    font-weight: 600;
    color: var(--dt-ink);
    text-align: left;
    font-feature-settings: 'tnum' 1;
    outline: none;
    transition: border-color .12s;
    -moz-appearance: textfield;
  }
  .dt-clock-input-group input:focus { border-bottom-color: var(--dt-gold-dark); }
  .dt-clock-input-group input::-webkit-outer-spin-button,
  .dt-clock-input-group input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .dt-clock-input-hint {
    grid-area: hint;
    margin-top: 4px;
    font-family: var(--serif);
    font-style: italic;
    font-size: 10px;
    color: var(--dt-ink-4, var(--dt-ink-3));
    letter-spacing: 0.04em;
  }

  .dt-clock-ampm-btn {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: var(--dt-paper-2);
    border: 1px solid var(--paper-edge);
    border-radius: 6px;
    font-family: var(--font-title);
    font-weight: 600;
    font-size: 12px;
    color: var(--dt-ink-2);
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: background .12s, border-color .12s, color .12s;
    align-self: center;
  }
  .dt-clock-ampm-btn:hover {
    background: var(--dt-paper);
    border-color: var(--dt-gold);
    color: var(--dt-ink);
  }
  .dt-clock-ampm-btn:active { transform: translateY(1px); }
  .dt-clock-ampm-icon {
    font-size: 16px;
    color: var(--dt-gold-dark);
  }

  .dt-clock-readout {
    padding: 16px 18px;
    background: linear-gradient(180deg, var(--dt-paper-2) 0%, rgba(180,138,74,0.06) 100%);
    border: 1px solid var(--dt-gold-soft);
    border-radius: 8px;
  }
  .dt-clock-readout-label {
    margin-bottom: 6px;
    font-family: var(--serif);
    font-style: italic;
    font-size: 12px;
    color: var(--dt-ink-3);
    letter-spacing: 0.04em;
  }
  .dt-clock-readout-label .ja {
    font-style: normal;
    font-family: var(--serif-jp);
    color: var(--dt-ink-2);
    font-weight: 600;
  }
  .dt-clock-ja {
    font-family: var(--serif-jp);
    font-weight: 700;
    font-size: clamp(20px, 2.6vw, 28px);
    color: var(--dt-ink);
    line-height: 1.2;
    letter-spacing: 0.02em;
  }
  .dt-clock-kana {
    margin-top: 4px;
    font-family: var(--serif-jp);
    font-size: 15px;
    color: var(--dt-ink-2);
    letter-spacing: 0.02em;
  }
  /* Gold marker tint — applied to 時 / 分 / 半 in the kanji readout
     and their kana equivalents (じ / ふん|ぷん / はん) in the kana
     readout. Visually splits the unit boundary so a long readout
     like 午後十二時五十五分 reads as PM + hour + minute instead of
     a single solid block. */
  .dt-clock-ja .dt-clock-mk,
  .dt-clock-kana .dt-clock-mk {
    color: var(--dt-gold-dark);
    margin-left: 0.04em;
  }
  .dt-clock-en {
    margin-top: 6px;
    font-family: var(--serif);
    font-style: italic;
    font-size: 14px;
    color: var(--dt-ink-3);
    font-feature-settings: 'tnum' 1;
  }
  .dt-clock-explain {
    margin: 14px 0 0;
    font-family: var(--serif);
    font-size: 14px;
    line-height: 1.6;
    color: var(--dt-ink-2);
  }
  .dt-clock-explain b { color: var(--dt-ink); font-weight: 600; }
  .dt-clock-explain .ja {
    font-family: var(--serif-jp);
    color: var(--dt-ink);
  }

  @media (max-width: 760px) {
    .dt-clock-card { grid-template-columns: 1fr; gap: 18px; padding: 18px 16px; }
    .dt-clock-svg { max-width: 220px; }
  }

  /* Responsive — collapse heavy multi-column grids */
  @media (max-width: 720px) {
    .dt-date-row         { grid-template-columns: 1fr; }
    .dt-ampm-row         { grid-template-columns: 1fr; gap: 16px; }
    .dt-date-rules       { grid-template-columns: 1fr; gap: 4px 0; }
    .dt-date-rules dt    { padding-top: 12px; }
  }
</style>
</head>

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>

<!-- Mobile drawer for vocab cheatsheet items. Hidden on desktop; opens via FAB. -->

  <span class="vocab-fab-count" id="vocab-fab-count" hidden></span>
</button>

<!-- Card modal — opens when a writing/colors tile is clicked, shows the
     deck flashcard for that color. Centered modal on desktop, fullscreen
     dialog on mobile. Click backdrop / X / Escape to close. -->

<!-- Stroke-order format index — kanji → 'gif' | 'svg'. Regenerated by
     scripts/download-stroke-gifs.mjs on every run so it stays in sync

     window.STROKE_FORMATS to construct the right URL directly. -->

<script>
'use strict';

// ── Persistence helpers ─────────────────────────────────────────────────
function lsGet(key, def) {
  try { const r = localStorage.getItem(key); return r == null ? def : JSON.parse(r); }
  catch { return def; }
}
function lsSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}

// ── Sections ────────────────────────────────────────────────────────────
const SECTIONS = [
  { id: 'writing',    glyph: '基', ja: '基礎',  en: 'Basics' },
  { id: 'flashcards', glyph: '札', ja: '単語札', en: 'Flashcards' },
  { id: 'vocab',      glyph: '語', ja: '語彙',  en: 'Vocabulary' },
  { id: 'search',     glyph: '検', ja: '検索',  en: 'Search' },
  { id: 'dictionary', glyph: '辞', ja: '辞書',   en: 'Dictionary' },
];

function hashSection() {
  const h = (location.hash || '').replace('#', '');
  return ['vocab','writing','flashcards','search','dictionary'].includes(h) ? h : lsGet('jp:section', 'vocab');
}

const APP = {
  section:      hashSection(),
  showEnglish:  lsGet('jp:showEnglish', true),
  density:      lsGet('jp:density', 'comfortable'),
  particlesOn:  lsGet('jp:particles', true),
  // Migrate legacy vocab class ids: 'onomatopoeia' → 'jougo'.
  vocabClassId: (() => {
    const v = lsGet('jp:vocabClass', 'home');
    if (v === 'onomatopoeia') return 'jougo';
    return v;
  })(),
  vocabBookId:  (() => {
    const v = lsGet('jp:vocabBook', 'bathroom');
    if (v === 'ono-basics') return 'ono';
    return v;
  })(),
  vocabPageIdx: 0,
  // Flavors page (Phase 1 of the Flavors & Textures sub-system). Holds
  // the active flavor id when the user has drilled into a flavor's
  // immersion view; null when the bento map is showing. Persisted so
  // a session-resume lands the user back in the flavor they were
  // sitting with — the page is a contemplative surface, not a quiz,
  // and breaking immersion across reloads would break the contract.
  flavorId:     lsGet('jp:flavorId', null),
  // Edibles database (Phase 3 of the sub-system). Two state slots
  // drive three views:
  //   edibleCategory=null, edibleItem=null   → category-browse (8 tiles)
  //   edibleCategory='kudamono', item=null   → item-grid in that category
  //   edibleCategory='kudamono', item='ringo'→ item-detail spread
  // Both persisted; reload resumes wherever the user was.
  edibleCategory: lsGet('jp:edibleCategory', null),
  edibleItem:     lsGet('jp:edibleItem', null),
  // Cross-link breadcrumb: when the user navigates from a flavor's
  // "foods that taste like X" row into an edible detail, this slot
  // records which flavor they came from. The edible-detail spread
  // renders a second back button labeled with the flavor's kana so
  // the user can bounce back to that flavor's color world. Cleared
  // when the user navigates up out of detail view (or jumps into a
  // different flavor via a badge); preserved when walking sideways
  // through "similar items" since the flavor context still applies.
  edibleFromFlavor: lsGet('jp:edibleFromFlavor', null),
  // Migrate legacy class ids: 'weather' → 'nature', 'doors' → 'rooms'.
  flashClassId: (() => {
    const v = lsGet('jp:flashClass', 'basic');
    if (v === 'weather') return 'nature';
    if (v === 'doors') return 'rooms';
    return v;
  })(),
  flashIdx:     0,
  flashShowEn:  lsGet('jp:flashShowEn', true),
  // Card flip state — false = front (image + meaning + examples), true =
  // back (stroke order GIF + radical composition + writing notes). Reset
  // to false whenever the active card changes so a fresh card always
  // shows its front. Not persisted across sessions (transient study state).
  flashFlipped: false,
  // Background preference for the flashcards page only. 'random' (the
  // default) cycles a new bg on every category change; a filename like
  // 'bg-fuji.webp' locks the page to that specific image. Persisted so
  // the learner's preference survives reloads.
  flashBgPref:  lsGet('jp:flashBgPref', 'random'),
  // Colors-class only: paint the kanji itself in the swatch color so the
  // glyph IS the color it names. The trailing 色 in compound names stays in
  // ink for easy cross-referencing back to the base 色 kanji.
  flashColorize: lsGet('jp:flashColorize', true),
  // Furigana toggle — when on, scene dialogues and titles render with
  // <ruby> reading guides above kanji. Off by default so first-time
  // visitors aren't overwhelmed; the toggle lives in the scene-head.
  showFurigana: lsGet('jp:showFurigana', false),
  // ── TTS + settings preferences ───────────────────────────────
  // Site-wide JP font theme. One of: mincho | gothic | kyokasho | brush.
  // Mirrors the four fonts the writing/kana page already uses so the
  // app feels consistent end-to-end.
  uiFont:           lsGet('jp:uiFont', 'mincho'),
  // Per-role font assignments. Title defaults to brush (calligraphic),
  // menu / body keep the chosen body font. menu-en gets a Latin default
  // since it sets English label typography.
  fontTitle:        lsGet('jp:fontTitle', 'brush'),
  fontMenu1:        lsGet('jp:fontMenu1', 'mincho'),
  fontMenu2:        lsGet('jp:fontMenu2', 'garamond'),
  // The voiceURI of the user-picked TTS voice. null = auto-pick the
  // best available Japanese voice (prefers Google → Kyoko → others).
  ttsVoiceURI:      lsGet('jp:ttsVoiceURI', null),
  // Speech rate. 0.85 reads slightly slower than the SpeechSynthesis
  // default; that's better for learners catching unfamiliar kanji.
  ttsRate:          lsGet('jp:ttsRate', 0.85),
  // Autoplay NPC dialogue in the immersive (restaurant scene) flow.
  ttsAutoplay:      lsGet('jp:ttsAutoplay', true),
  // Delay before autoplay fires after a scene step renders, in seconds.
  // 0.4s feels natural — long enough to read the speaker's name, short
  // enough that the voice still feels reactive.
  ttsAutoplayDelay: lsGet('jp:ttsAutoplayDelay', 0.4),
  dictQ:        '',
  dictKind:     'all',
  dictLevel:    'all',
  dictTag:      'all',
  popoverItem:  null,
  popoverRect:  null,
  pendingDictQ: null,
  _flashKeyHandler: null,
  // writing / kana
  kanaShowH:    lsGet('jp:kana-show-h', true),
  kanaShowK:    lsGet('jp:kana-show-k', true),
  kanaRomaji:   lsGet('jp:kana-romaji', true),
  // Direct sizes for each script — the user sets them independently.
  // Migrates from the previous (emphasis + min/max) model so saved
  // preferences keep working.
  kanaSizeH: (function() {
    const v = lsGet('jp:kana-size-h', null);
    if (typeof v === 'number') return v;
    // Migration from old emphasis + min/max scheme
    const emph = lsGet('jp:kana-emphasis', 0);
    const min  = lsGet('jp:kana-font-min', 20);
    const max  = lsGet('jp:kana-font-max', 36);
    const e = typeof emph === 'number' ? emph : (emph === 'h' ? -1 : emph === 'k' ? 1 : 0);
    return Math.round((min + max) / 2 - e * (max - min) / 2);
  })(),
  kanaSizeK: (function() {
    const v = lsGet('jp:kana-size-k', null);
    if (typeof v === 'number') return v;
    const emph = lsGet('jp:kana-emphasis', 0);
    const min  = lsGet('jp:kana-font-min', 20);
    const max  = lsGet('jp:kana-font-max', 36);
    const e = typeof emph === 'number' ? emph : (emph === 'h' ? -1 : emph === 'k' ? 1 : 0);
    return Math.round((min + max) / 2 + e * (max - min) / 2);
  })(),
  // Rōmaji size — small caption-style label under each kana. Default
  // matches the original 11px caption size used in the original CSS.
  kanaSizeR: lsGet('jp:kana-size-r', 11),
  kanaFont:     lsGet('jp:kana-font', 'mincho'),
  writingPage:  lsGet('jp:writingPage', 'kana'),
  particleIdx:  lsGet('jp:particleIdx', 0),
  // 'quiz' shows the test, 'particle' shows the single-particle lesson.
  particleMode: lsGet('jp:particleMode', 'lessons'),
  // Quiz config (drives the start screen). All particles, levels chosen,
  // and size persist across sessions so users don't reconfigure every time.
  quizParticles: lsGet('jp:quizParticles', ['は','が','を','に','で','へ','の','と','も','から','まで','や']),
  quizLevels:    lsGet('jp:quizLevels', ['N5','N4']),
  quizSize:      lsGet('jp:quizSize', 20),
  // Lesson id currently being viewed (null = catalog screen).
  lessonId:      lsGet('jp:lessonId', null),
  // Article id currently being viewed (null = articles catalog).
  articleId:     lsGet('jp:articleId', null),
  // Radicals page — array of selected radical glyphs. Selecting two or more
  // intersects: a kanji must contain ALL selected radicals to appear.
  radicalsSelected: lsGet('jp:radicalsSelected', []),
  // Flashcards view mode — two options:
  //   'card' — editorial 2-column layout (image + brush glyph + info pane)
  //   'list' — every kanji in the class as a 2-col scrollable list
  // The legacy 'old' / 'new' values both migrate to 'card' (the old
  // classic layout has been retired).
  flashView:        (function() {
    const v = lsGet('jp:flashView', 'card');

  document.querySelectorAll('.active-brush-particle').forEach(brush => {
    const row = brush.parentElement;
    if (!row) return;
    // Anchor to the GLYPH element, not the sidebar. The glyph is the
    // kana character (は が を …) that the brush should visually wrap.
    const glyph = row.querySelector('.cat-glyph');
    if (!glyph) return;
    const glyphRect = glyph.getBoundingClientRect();
    if (glyphRect.width === 0 && glyphRect.height === 0) return;
    // SIZE — derived from the glyph's LAYOUT width (offsetWidth),
    // NOT the bounding-rect width. The particle-glyph-emerge keyframe
    // scales the glyph to 1.22 via CSS transform, which inflates its
    // getBoundingClientRect dimensions. Using rect.width here meant
    // the brush kept growing as the emerge animation played — and
    // each scroll-triggered reposition picked up the new scaled rect
    // and ratcheted the brush size up further. offsetWidth ignores
    // CSS transforms (returns the layout box), so brush size stays
    // stable regardless of the glyph's current scale state.
    const refWidth = glyph.offsetWidth || 26;
    const brushWidth = refWidth * BRUSH_PARTICLE_GLYPH_SCALE;
    const aspect = (brush.naturalWidth && brush.naturalHeight)
      ? brush.naturalWidth / brush.naturalHeight
      : 1.0;
    const brushHeight = brushWidth / aspect;
    brush.style.width  = brushWidth + 'px';
    brush.style.height = brushHeight + 'px';
    // POSITION — derived from getBoundingClientRect, which DOES
    // include transforms. We want the brush to follow the glyph's
    // current visual center (including the -2px emerge translate),
    // so this is correct: brush slides with the glyph as it emerges,
    // and follows the row as the user scrolls the sub-sidebar.
    const cx = glyphRect.left + glyphRect.width  / 2;
    const cy = glyphRect.top  + glyphRect.height / 2;
    brush.style.left = (cx - brushWidth  / 2) + 'px';
    brush.style.top  = (cy - brushHeight / 2) + 'px';
  });
}
// Brush-bg positioning ────────────────────────────────────────────────
// The .active-brush-bg <img> is position:fixed (escapes the sub-sidebar's
// overflow-y:auto clip), so JS sets ALL geometry — width, height, left,
// top — each frame. The math derives everything from two things:
//
//   1. The host sub-sidebar's rendered width (measured live)
//   2. The brush image's native aspect ratio (read from naturalWidth/
//      naturalHeight once the image loads)
//
// Formula:
//   brushWidth  = sidebar.width × (1 + 2 × spillRatio)
//                 ↳ default spillRatio = 0.10 means sidebar + 10% on
//                   each side = sidebar × 1.20
//   brushHeight = brushWidth / aspect
//                 ↳ preserves the artist's stroke aspect regardless
//                   of how wide the sidebar is
//   left        = sidebar.left − sidebar.width × spillRatio
//                 ↳ 10% of the sidebar leaks into the previous column
//   top         = row.top + (row.height − brushHeight) / 2
//                 ↳ vertically centered on the active row
//
// This adapts automatically when:
//   - The user swaps brush images (different native aspect → new height)
//   - The viewport resizes (sub-sidebar widths reflow → re-measure)
//   - A new sub-sidebar gets the brush-bg variant later (any class
//     listed in SUB_SIDEBAR_SELECTOR is supported)
//
// BRUSH_BG_FALLBACK_ASPECT covers the brief window between <img> insert
// and the image's `load` event firing (naturalWidth is 0 until then).
// We register a capture-phase `load` listener in initTier3BrushPositioning
// that re-schedules a reposition when any brush image finishes loading,
// so the fallback only governs the first paint frame before the image
// arrives.
const BRUSH_BG_SPILL_RATIO = 0.10;
const BRUSH_BG_FALLBACK_ASPECT = 2.0;
const SUB_SIDEBAR_SELECTOR =
  '.particles-sidebar, .flash-sidebar, .writing-sidebar, ' +
  '.vocab-sidebar, .vocab-books-sidebar';
function repositionBgBrushes() {
  document.querySelectorAll('.active-brush-bg').forEach(brush => {
    const row = brush.parentElement;
    if (!row) return;
    const rect = row.getBoundingClientRect();
    // Hidden ancestor — skip rather than paint at (0,0). Next mutation
    // pass catches us when the row becomes visible.
    if (rect.width === 0 && rect.height === 0) return;
    // The brush sizes itself relative to the SUB-SIDEBAR it lives in
    // (not the main nav sidebar), so look up that ancestor specifically.
    const subSidebar = row.closest(SUB_SIDEBAR_SELECTOR);
    if (!subSidebar) return;
    const sidebarRect = subSidebar.getBoundingClientRect();
    if (sidebarRect.width === 0) return;

    // Width = sidebar + (spillRatio × 2) overhang.
    const brushWidth = sidebarRect.width * (1 + BRUSH_BG_SPILL_RATIO * 2);
    // Height proportional to the picked image's native aspect. If the
    // image hasn't loaded yet (naturalWidth = 0), use the fallback and
    // self-correct on the next reposition triggered by the load event.
    const aspect = (brush.naturalWidth && brush.naturalHeight)
      ? brush.naturalWidth / brush.naturalHeight
      : BRUSH_BG_FALLBACK_ASPECT;
    const brushHeight = brushWidth / aspect;

    brush.style.width = brushWidth + 'px';
    brush.style.height = brushHeight + 'px';
    // Anchor the brush's left edge to the sub-sidebar's left edge minus
    // the leftward spill. This keeps the brush positionally consistent
    // across rows in the same sidebar — no per-row drift even if some
    // rows have different padding.
    brush.style.left = (sidebarRect.left - sidebarRect.width * BRUSH_BG_SPILL_RATIO) + 'px';
    // Vertically center the brush on the active row.
    brush.style.top = (rect.top + (rect.height - brushHeight) / 2) + 'px';
  });
}

// Tier-3 brush positioning ─────────────────────────────────────────────
// Tier-3 brushes use `position: fixed` (see CSS at .cat-item .active-brush.tier-3)
// so they can escape the sub-sidebars' overflow:hidden clip. Fixed strips
// them out of normal flow, so JS sets their left/top each frame to keep
// them centered on their parent row's right edge — half inside the row,
// half spilling into the content area beyond the sub-sidebar.
//
// Triggers a reposition on:
//   - DOM mutations (new active state inserted/removed during section change)
//   - Window resize (sidebar widths change)
//   - Scroll events anywhere (sub-sidebars have their own overflow:auto;
//     capture phase catches inner scrolls before they bubble up)
const TIER3_BRUSH_SIZE = 70;
function repositionTier3Brushes() {
  document.querySelectorAll('.active-brush.tier-3').forEach(brush => {
    const parent = brush.parentElement;
    if (!parent) return;
    const rect = parent.getBoundingClientRect();
    // Hidden parent (display:none somewhere up the tree) — skip rather
    // than place at (0,0) where it would flash before the next tick
    // catches it.
    if (rect.width === 0 && rect.height === 0) return;
    brush.style.left = (rect.right - TIER3_BRUSH_SIZE / 2) + 'px';
    brush.style.top  = (rect.top + (rect.height - TIER3_BRUSH_SIZE) / 2) + 'px';
  });
}
function initTier3BrushPositioning() {
  // rAF-coalesce so multiple triggers in a single frame collapse to one
  // measurement pass. Every fixed-positioned brush variant — the small
  // tier-3 dots, the wide bg-brushes, and the medium-sized particle brushes
  // — is a child of a cat-item that needs to track its parent row, so
  // we run every repositioner on the same trigger set.
  let pending = false;
  const schedule = () => {
    if (pending) return;
    pending = true;
    requestAnimationFrame(() => {
      pending = false;
      repositionTier3Brushes();
      repositionBgBrushes();
      repositionParticleBrushes();
    });
  };
  // DOM changes anywhere — covers active-state swaps inside any sidebar.
  // Scoped to document.body with subtree:true; the per-call work is just
  // a querySelectorAll on a tiny set of nodes, so noisy mutations are fine.
  new MutationObserver(schedule).observe(document.body, {
    childList: true,
    subtree: true,
  });
  // Viewport size changes — sidebar widths reflow, parent rects shift.
  window.addEventListener('resize', schedule);
  // Capture-phase scroll listener — needed because sub-sidebars scroll
  // independently (each has overflow-y:auto), and scroll events from
  // them do NOT bubble to window. Capture catches every scroll regardless
  // of origin.
  document.addEventListener('scroll', schedule, true);
  // Capture-phase load listener — brush-bg <img>s arrive with width/
  // height zero until the PNG/SVG byte stream finishes loading. The
  // first reposition uses BRUSH_BG_FALLBACK_ASPECT; we need a second
  // reposition once the actual naturalWidth/naturalHeight are known so
  // the brush adopts its native aspect. `load` events don't bubble, so
  // we listen at capture phase to catch every <img> load in the page.
  document.addEventListener('load', (e) => {
    const t = e.target;
    if (!t || !t.classList) return;
    if (t.classList.contains('active-brush-bg') ||
        t.classList.contains('active-brush-particle')) schedule();
  }, true);
  // Initial pass on the next frame so anything already in the DOM at
  // boot gets anchored before paint.
  schedule();
}

function speakerIconSVG() {
  return `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M11 5L6 9H2v6h4l5 4V5z"/>
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>

  `;
